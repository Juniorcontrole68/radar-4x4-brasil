<style id="lotacao-complementos-addon">
/* Formulário mais compacto: menos espaço vazio em todos os campos. */
#modal{width:min(1080px,97vw)!important}
#formColeta{padding:14px 16px!important}

.coleta-form-grid input,.coleta-form-grid select,.coleta-form-grid textarea{padding:5px 8px!important;font-size:13.5px!important;min-height:32px;border-radius:7px!important;color:#0f172a}

.doc-field{padding:7px 9px!important;border-radius:9px!important}
.doc-field .doc-title{margin-bottom:3px!important;font-size:12px}
.doc-field input[type=file]{padding:4px 6px!important;min-height:0!important;font-size:12.5px!important}
.doc-status{margin-top:3px!important}
.doc-refresh-field{padding:8px 10px!important}
#doc_refresh_data{padding:7px 12px!important}
.history-select-wrap{padding:7px 9px!important;border-radius:9px!important}

/* Destinatários adicionais */
.lc-sub{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:7px;border-top:1px dashed #cbd5e1;font-size:12.5px;font-weight:700;color:#334155}
.lc-sub small{font-weight:400;color:#64748b}
.lc-add{border:1px solid #93c5fd;background:#eff6ff;color:#1d4ed8;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.lc-dest-list{grid-column:1/-1;display:grid;gap:6px}
.lc-dest{display:grid;grid-template-columns:28px 1fr 30px;gap:7px;align-items:end;background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:6px 8px}
.lc-campos{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(200px,2fr) minmax(120px,1fr) 56px;gap:6px 7px}
.lc-campos .lc-w2{grid-column:span 2}

.lc-dest .lc-num{align-self:center;width:24px;height:24px;border-radius:50%;background:#0057a8;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.lc-dest label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:600;color:#475569}
.lc-dest input{padding:5px 8px!important;font-size:13px!important;min-height:30px;border-radius:7px!important}
.lc-del{border:0;background:#fee2e2;color:#b91c1c;border-radius:7px;height:30px;font-size:16px;cursor:pointer}
@media(max-width:720px){.lc-dest{grid-template-columns:24px 1fr 30px}}
.lc-auto-note{grid-column:1/-1;font-size:11.5px;color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;border-radius:7px;padding:5px 8px;display:none}
.lc-auto-note.show{display:block}

/* Ordem de coleta (pré-visualização) */
.lc-btn-ordem{border-color:#0057a8!important;color:#0057a8!important}
#lcOrdemDlg{border:0;border-radius:12px;padding:0;width:min(960px,97vw);height:94vh;max-height:94vh;box-shadow:0 28px 80px #0006;overflow:hidden}
#lcOrdemDlg::backdrop{background:#0b171cb0}
#lcOrdemDlg .lc-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;background:#0f172a;color:#fff}
#lcOrdemDlg .lc-bar strong{font-size:14px}
#lcOrdemDlg .lc-bar div{display:flex;gap:6px;flex-wrap:wrap}
#lcOrdemDlg .lc-bar button{border:0;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;background:#e2e8f0;color:#0f172a}
#lcOrdemDlg .lc-bar button.pri{background:#f28c00;color:#fff}
#lcOrdemDlg iframe{width:100%;height:calc(94vh - 50px);border:0;background:#e5e7eb}
.lc-extra-dest{margin-top:4px;font-size:12px;color:#475569}
.lc-extra-dest b{color:#0f172a}
.lc-rem .lc-num{background:#f28c00}
.lc-rem .lc-quando{display:grid;grid-template-columns:1fr 1fr;gap:6px 7px}

/* Cadastro de clientes */
.lc-cli-wrap{grid-column:1/-1;display:flex;gap:8px;align-items:flex-end;padding:7px 9px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:9px}
.lc-cli-wrap label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:#1e3a8a}
.lc-cli-wrap select{min-height:32px;padding:4px 8px;border-radius:7px;border:1px solid #93c5fd;font-size:13.5px;background:#fff}
.lc-cli-wrap button,.lc-cli-btn{border:1px solid #93c5fd;background:#fff;color:#1d4ed8;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.lc-r-cli{grid-column:1/-1}
.lc-busca-linha{display:flex;gap:6px;flex-wrap:wrap}.lc-busca-linha select{flex:1 1 220px;min-width:0}
.lc-cli-busca{flex:1 1 200px;min-width:0;min-height:32px;padding:4px 8px;border-radius:7px;border:1px solid #93c5fd;font-size:13px;background:#fff;font-weight:400}
.lc-r-cli select{padding:4px 8px;font-size:13px;min-height:30px;border-radius:7px;border:1px solid #93c5fd;background:#eff6ff}
/* Remetente e destinatário vêm só do cadastro de clientes: sem as listas de "já utilizado". */
.history-select-wrap:has(#historico_remetente),.history-select-wrap:has(#historico_destinatario){display:none!important}
#lcCliAviso{display:block;color:#b45309;font-size:11.5px;font-weight:600;margin-top:3px}
#lcCliDlg{border:0;border-radius:12px;padding:0;width:min(980px,97vw);max-height:92vh;box-shadow:0 28px 80px #0006;overflow:hidden}
#lcCliDlg::backdrop{background:#0b171cb0}
#lcCliDlg .lc-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:#0f172a;color:#fff}
#lcCliDlg .lc-bar strong{font-size:15px}
#lcCliDlg .lc-bar button{border:0;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;background:#e2e8f0;color:#0f172a}
.lc-cli-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;padding:14px;max-height:calc(92vh - 52px);overflow:auto}
@media(max-width:760px){.lc-cli-body{grid-template-columns:1fr}}
.lc-cli-lista{display:flex;flex-direction:column;gap:6px;min-width:0}
.lc-cli-lista input[type=search]{padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px}
.lc-cli-itens{display:flex;flex-direction:column;gap:5px;max-height:60vh;overflow:auto}
.lc-cli-item{border:1px solid #e2e8f0;border-radius:9px;padding:7px 9px;cursor:pointer;background:#fff}
.lc-cli-item:hover,.lc-cli-item.sel{border-color:#0057a8;background:#f0f7ff}
.lc-cli-item b{display:block;font-size:13.5px;color:#0f172a}
.lc-cli-item small{display:block;color:#64748b;font-size:12px}
.lc-cli-vazio{color:#64748b;font-size:13px;padding:8px}
.lc-cli-form{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px 10px;align-content:start;border:1px solid #e2e8f0;border-radius:10px;padding:12px;background:#f8fafc}
.lc-cli-form h3{grid-column:1/-1;margin:0;font-size:14px;color:#0f172a}
.lc-cli-form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:#475569;min-width:0}
.lc-cli-form label.w3{grid-column:1/-1}.lc-cli-form label.w2{grid-column:span 2}
.lc-cli-form input,.lc-cli-form textarea{padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:13.5px;font-family:inherit;color:#0f172a;background:#fff}
.lc-cli-form textarea{min-height:64px;resize:vertical}
.lc-cli-acoes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lc-cli-acoes button{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.lc-cli-acoes .pri{background:#0057a8;border-color:#0057a8;color:#fff}
.lc-cli-acoes .del{color:#b91c1c;border-color:#fecaca;margin-right:auto}
.lc-cli-msg{grid-column:1/-1;font-size:12.5px;min-height:16px;color:#0f766e}
.lc-cli-msg.err{color:#b91c1c}
@media(max-width:520px){.lc-cli-form{grid-template-columns:1fr 70px}.lc-cli-form label.w2{grid-column:1/-1}}
</style>
<script id="lotacao-complementos-script">
(() => {
  const baseFetch = window.fetch.bind(window);
  const byId = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
  const rows = () => (typeof coletas !== 'undefined' && Array.isArray(coletas)) ? coletas : [];
  const rowById = id => rows().find(r => String(r.id) === String(id));
  const currentId = () => String(byId('id')?.value || '').trim();
  const BANCO_CAMPOS = [
    ['banco', 'Banco', 'text', 'Ex.: Itaú, Nubank'],
    ['agencia', 'Agência', 'text', '0000'],
    ['conta', 'Conta', 'text', '00000-0'],
    ['tipo_conta', 'Tipo de conta', 'select', ['', 'Corrente', 'Poupança', 'Pagamento']],
    ['titular', 'Titular da conta', 'text', 'Nome do titular'],
    ['documento_titular', 'CPF / CNPJ do titular', 'text', '000.000.000-00'],
    ['pix_tipo', 'Tipo da chave Pix', 'select', ['', 'CPF', 'CNPJ', 'Celular', 'E-mail', 'Aleatória']],
    ['pix_chave', 'Chave Pix', 'text', 'Chave Pix do motorista']
  ];
  const CNH_CAMPOS = ['motorista_cpf', 'motorista_rg', 'cnh_numero', 'cnh_categoria', 'cnh_validade'];
  const CAMINHAO_CAMPOS = ['placa', 'tipo_caminhao', 'implemento', 'eixos', 'placa_carreta', 'capacidade_carga_cavalo', 'eixos_cavalo', 'capacidade_carga_carreta', 'eixos_carreta'];

  function obj(v) {
    if (!v) return {};
    if (typeof v === 'string') { try { v = JSON.parse(v) } catch { return {} } }
    return v && typeof v === 'object' ? v : {};
  }
  function lista(v) {
    if (typeof v === 'string') { try { v = JSON.parse(v) } catch { return [] } }
    return Array.isArray(v) ? v : [];
  }
  function card(title) {
    return [...document.querySelectorAll('.coleta-form-card')].find(x => norm(x.querySelector('h3')?.textContent) === norm(title));
  }
  function gridOf(id, title) {
    return byId(id)?.closest('.coleta-form-grid') || card(title)?.querySelector('.coleta-form-grid') || null;
  }

  /* ---------- Destinatários adicionais ---------- */
  function renumerar() {
    ['#lcDestList', '#lcRemList'].forEach(sel => [...document.querySelectorAll(sel + ' .lc-dest')].forEach((d, i) => { d.querySelector('.lc-num').textContent = String(i + 2) }));
  }
  function addDestRow(e = {}) {
    const list = byId('lcDestList'); if (!list) return;
    const row = document.createElement('div'); row.className = 'lc-dest';
    row.innerHTML = '<span class="lc-num"></span><div class="lc-campos">' +
      '<label class="lc-r-cli">Cliente cadastrado<select class="lc-d-cli-sel">' + opcoesClientes() + '</select></label>' +
      '<label>Destinatário<input class="lc-d-nome" placeholder="Nome do destinatário"></label>' +
      '<label>Endereço de entrega<input class="lc-d-end" placeholder="Rua, número, bairro" data-no-titlecase="true"></label>' +
      '<label>Cidade<input class="lc-d-cid" placeholder="Cidade"></label>' +
      '<label>UF<input class="lc-d-uf" maxlength="2" placeholder="SP" data-no-titlecase="true"></label>' +
      '<label class="lc-w2">Localização no Google Maps <small>(opcional)</small><input class="lc-d-loc" placeholder="cole o link do Google Maps" data-no-titlecase="true"></label>' +
      '<label class="lc-w2">Observação / NF<input class="lc-d-obs" placeholder="Opcional" data-no-titlecase="true"></label>' +
      '</div><button type="button" class="lc-del" title="Remover destinatário">×</button>';
    row.querySelector('.lc-d-nome').value = e.destinatario || '';
    row.querySelector('.lc-d-end').value = e.endereco_entrega || '';
    row.querySelector('.lc-d-cid').value = e.cidade || '';
    row.querySelector('.lc-d-uf').value = e.uf || '';
    row.querySelector('.lc-d-loc').value = e.localizacao || '';
    row.querySelector('.lc-d-obs').value = e.observacao || '';
    row.querySelector('.lc-d-uf').addEventListener('input', ev => { ev.target.value = ev.target.value.toUpperCase() });
    row.querySelector('.lc-d-cli-sel').addEventListener('change', ev => {
      const c = clientePorId(ev.target.value); if (!c) return;
      row.querySelector('.lc-d-nome').value = c.nome || '';
      row.querySelector('.lc-d-end').value = enderecoSemCidade(c);
      row.querySelector('.lc-d-cid').value = c.cidade || '';
      row.querySelector('.lc-d-uf').value = c.uf || '';
      row.querySelector('.lc-d-obs').value = obsDoCliente(c);
    });
    row.querySelector('.lc-del').onclick = () => { row.remove(); renumerar() };
    list.appendChild(row); renumerar(); ligarBusca(row.querySelector('.lc-d-cli-sel'));
    return row;
  }
  function lerDestinos() {
    return [...document.querySelectorAll('#lcDestList .lc-dest')].map(d => ({
      destinatario: d.querySelector('.lc-d-nome').value.trim(),
      endereco_entrega: d.querySelector('.lc-d-end').value.trim(),
      cidade: d.querySelector('.lc-d-cid').value.trim(),
      uf: d.querySelector('.lc-d-uf').value.trim().toUpperCase(),
      localizacao: d.querySelector('.lc-d-loc').value.trim(),
      observacao: d.querySelector('.lc-d-obs').value.trim()
    })).filter(e => e.destinatario || e.endereco_entrega || e.cidade);
  }
  /* ---------- Outros remetentes (mais de um local de coleta na mesma lotação) ---------- */
  function addRemRow(e = {}) {
    const list = byId('lcRemList'); if (!list) return;
    const row = document.createElement('div'); row.className = 'lc-dest lc-rem';
    row.innerHTML = '<span class="lc-num"></span><div class="lc-campos">' +
      '<label class="lc-r-cli">Cliente cadastrado<select class="lc-r-cli-sel">' + opcoesClientes() + '</select></label>' +
      '<label>Remetente<input class="lc-r-nome" placeholder="Nome do remetente"></label>' +
      '<label>Endereço da coleta<input class="lc-r-end" placeholder="Rua, número, bairro" data-no-titlecase="true"></label>' +
      '<label>Cidade<input class="lc-r-cid" placeholder="Cidade"></label>' +
      '<label>UF<input class="lc-r-uf" maxlength="2" placeholder="SP" data-no-titlecase="true"></label>' +
      '<div class="lc-quando lc-w2"><label>Data da coleta<input class="lc-r-data" type="date"></label><label>Hora da coleta<input class="lc-r-hora" type="time"></label></div>' +
      '<label class="lc-w2">Localização no Google Maps <small>(opcional)</small><input class="lc-r-loc" placeholder="cole o link do Google Maps" data-no-titlecase="true"></label>' +
      '<label class="lc-w2">Observação / NF<input class="lc-r-obs" placeholder="Opcional" data-no-titlecase="true"></label>' +
      '</div><button type="button" class="lc-del" title="Remover remetente">×</button>';
    row.querySelector('.lc-r-nome').value = e.remetente || '';
    row.querySelector('.lc-r-end').value = e.endereco_coleta || '';
    row.querySelector('.lc-r-cid').value = e.cidade || '';
    row.querySelector('.lc-r-uf').value = e.uf || '';
    row.querySelector('.lc-r-data').value = String(e.data_coleta || '').slice(0, 10);
    row.querySelector('.lc-r-hora').value = String(e.hora_coleta || '').slice(0, 5);
    row.querySelector('.lc-r-loc').value = e.localizacao || '';
    row.querySelector('.lc-r-obs').value = e.observacao || '';
    row.querySelector('.lc-r-uf').addEventListener('input', ev => { ev.target.value = ev.target.value.toUpperCase() });
    row.querySelector('.lc-r-cli-sel').addEventListener('change', ev => {
      const c = clientePorId(ev.target.value); if (!c) return;
      row.querySelector('.lc-r-nome').value = c.nome || '';
      row.querySelector('.lc-r-end').value = enderecoSemCidade(c);
      row.querySelector('.lc-r-cid').value = c.cidade || '';
      row.querySelector('.lc-r-uf').value = c.uf || '';
      row.querySelector('.lc-r-obs').value = obsDoCliente(c);
    });
    row.querySelector('.lc-del').onclick = () => { row.remove(); renumerar() };
    list.appendChild(row); renumerar(); ligarBusca(row.querySelector('.lc-r-cli-sel'));
    return row;
  }
  function lerRemetentes() {
    return [...document.querySelectorAll('#lcRemList .lc-dest')].map(d => ({
      remetente: d.querySelector('.lc-r-nome').value.trim(),
      endereco_coleta: d.querySelector('.lc-r-end').value.trim(),
      cidade: d.querySelector('.lc-r-cid').value.trim(),
      uf: d.querySelector('.lc-r-uf').value.trim().toUpperCase(),
      data_coleta: d.querySelector('.lc-r-data').value,
      hora_coleta: d.querySelector('.lc-r-hora').value,
      localizacao: d.querySelector('.lc-r-loc').value.trim(),
      observacao: d.querySelector('.lc-r-obs').value.trim()
    })).filter(e => e.remetente || e.endereco_coleta || e.cidade);
  }
  /* ---------- Cidade, UF e localização da entrega 1 (destinatário principal) ---------- */
  const ENTREGA1 = [['lc_ent_cidade', 'cidade', 'Cidade da entrega', 'Cidade'], ['lc_ent_uf', 'uf', 'UF', 'SP'], ['lc_ent_loc', 'localizacao', 'Localização no Google Maps (opcional)', 'cole o link do Google Maps']];
  function lerEntrega1() {
    const o = {}; ENTREGA1.forEach(([id, k]) => { o[k] = String(byId(id)?.value || '').trim() }); o.uf = o.uf.toUpperCase(); return o;
  }
  function lerColeta1() { return { referencia: String(byId('lc_col_ref')?.value || '').trim(), observacao: String(byId('lc_col_obs')?.value || '').trim() } }
  function preencherEntrega1(e) { e = obj(e); ENTREGA1.forEach(([id, k]) => { const el = byId(id); if (el) el.value = e[k] || '' }) }

  /* ---------- Dados bancários e Pix ---------- */
  function lerBanco() {
    const b = {};
    BANCO_CAMPOS.forEach(([k]) => { const v = String(byId('mb_' + k)?.value || '').trim(); if (v) b[k] = v });
    return b;
  }
  function preencherBanco(b, soVazios) {
    b = obj(b);
    BANCO_CAMPOS.forEach(([k]) => {
      const el = byId('mb_' + k); if (!el) return;
      if (soVazios && String(el.value || '').trim()) return;
      if (b[k] !== undefined || !soVazios) el.value = b[k] || '';
    });
  }

  /* ---------- Cadastro de clientes (nome, endereço completo, referência, observações) ---------- */
  let CLIENTES = [];
  const clientePorId = id => CLIENTES.find(c => String(c.id) === String(id));
  // Rua, bairro e CEP: cidade e UF ficam nos campos próprios (outros remetentes e destinatários, entrega 1).
  const enderecoSemCidade = c => [c.endereco, c.bairro, c.cep ? 'CEP ' + c.cep : ''].filter(Boolean).join(' - ');
  const obsDoCliente = c => [c.referencia ? 'Ref.: ' + c.referencia : '', c.observacoes || ''].filter(Boolean).join(' • ').replace(/\s+/g, ' ').slice(0, 200);
  // Procurar: o texto digitado ao lado do seletor filtra os clientes por nome, cidade, UF, endereço ou CNPJ.
  const textoCliente = c => norm([c.nome, c.cidade, c.uf, c.endereco, c.bairro, c.cep, c.cnpj, c.documento].filter(Boolean).join(' '));
  const clientesFiltrados = q => { const t = norm(q); return t ? CLIENTES.filter(c => t.split(' ').every(p => textoCliente(c).includes(p))) : CLIENTES };
  function opcoesClientes(q) {
    const lista = clientesFiltrados(q);
    return '<option value="">' + (!CLIENTES.length ? 'Nenhum cliente cadastrado' : q && norm(q) ? (lista.length ? lista.length + ' encontrado(s): escolha…' : 'Nenhum cliente encontrado') : 'Escolha um cliente cadastrado…') + '</option>' +
      lista.map(c => '<option value="' + esc(c.id) + '">' + esc(c.nome) + '</option>').join('');
  }
  function atualizarSeletores() {

  /* ---------- Puxar dados do caminhão (e do banco) pelo motorista ---------- */
  function ultimaDoMotorista(nome) {
    const k = norm(nome); if (!k) return null;
    const doMot = rows().filter(r => norm(r.motorista) === k && String(r.id) !== currentId())
      .sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
    return { comPlaca: doMot.find(r => String(r.placa || '').trim()) || null, comBanco: doMot.find(r => Object.keys(obj(r.motorista_banco)).length) || null, comCnh: doMot.find(r => String(r.motorista_cpf || r.cnh_numero || '').trim()) || null, ultima: doMot[0] || null };
  }
  function setVal(id, v, soVazio) {
    const el = byId(id); if (!el || v === undefined || v === null || String(v).trim() === '') return false;
    if (soVazio && String(el.value || '').trim()) return false;
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === String(v) || o.textContent === String(v))) {
      const o = document.createElement('option'); o.textContent = String(v); el.appendChild(o);

    return true;
  }
  function puxarDadosMotorista(nome, forcar) {

    const v = h.comPlaca;
    let caminhao = false;
    if (v) {
      const placaAtual = String(byId('placa')?.value || '').trim();
      if (forcar || !placaAtual) {
        CAMINHAO_CAMPOS.forEach(k => { if (setVal(k, k === 'placa' || k === 'placa_carreta' ? String(v[k] || '').toUpperCase() : v[k], false)) caminhao = true });

      }

    setVal('telefone_motorista', h.ultima.telefone_motorista, !forcar);
    setVal('transportadora_agregado', h.ultima.transportadora_agregado, !forcar);
    const cnh = h.comCnh;
    if (cnh) CNH_CAMPOS.forEach(k => setVal(k, k === 'cnh_validade' ? String(cnh[k] || '').slice(0, 10) : cnh[k], true));
    if (h.comBanco) preencherBanco(h.comBanco.motorista_banco, !forcar);
    const note = byId('lcAutoNote');
    if (note && (caminhao || h.comBanco)) {
      const partes = [];
      if (caminhao) partes.push('caminhão ' + (v.placa ? String(v.placa).toUpperCase() : '') + (v.placa_carreta ? ' / carreta ' + String(v.placa_carreta).toUpperCase() : ''));

      note.textContent = '✓ Preenchido com a última coleta deste motorista (' + partes.join(' e ') + '). Confira e ajuste se mudou.';
      note.classList.add('show');
    }
  }

      dlg.innerHTML = '<div class="lc-bar"><strong id="lcOrdemTit"></strong><div>' +
        '<label style="display:inline-flex;gap:6px;align-items:center;font-weight:600">Para<select id="lcOrdemVia">' + Object.keys(VIAS).map(k => '<option value="' + k + '">' + VIAS[k] + '</option>').join('') + '</select></label>' +
        '<button type="button" class="pri" data-a="print">🖨️ Imprimir / Salvar PDF</button>' +
        '<button type="button" data-a="whats">📲 WhatsApp (PDF)</button>' +
        '<button type="button" data-a="down">⬇️ Baixar PDF</button>' +
        '<button type="button" data-a="close">Fechar</button></div></div><iframe title="Ordem de coleta"></iframe>';
      document.body.appendChild(dlg);
      byId('lcOrdemVia').onchange = ev => { if (dlg._row) abrirOrdem(dlg._row, ev.target.value) };
      dlg.addEventListener('click', ev => {
        const a = ev.target?.closest?.('button')?.dataset?.a; if (!a) return;
        const cur = dlg._ordem; if (!cur) return;
        if (a === 'close') dlg.close();
        else if (a === 'print') { try { dlg.querySelector('iframe').contentWindow.focus(); dlg.querySelector('iframe').contentWindow.print() } catch { alert('Não foi possível abrir a impressão.') } }
        else if (a === 'whats') enviarWhatsPdf(dlg._row, dlg._via, ev.target.closest('button'));
        else if (a === 'down') { const b = ev.target.closest('button'), t = b.textContent; b.disabled = true; b.textContent = 'Gerando PDF…'; gerarPdf(dlg._row, dlg._via).then(baixarArquivo).catch(e => alert(e.message)).finally(() => { b.disabled = false; b.textContent = t }) }
      });
    }
    dlg._ordem = { html, nome: nomeArquivo(c, via) }; dlg._row = c; dlg._via = via; byId('lcOrdemVia').value = via;
    byId('lcOrdemTit').textContent = 'Ordem de coleta ' + (c.os_numero || c.id || '(nova)');
    dlg.querySelector('iframe').srcdoc = html;
    if (!dlg.open) dlg.showModal();
  }
  window.exportarOrdemColeta = id => abrirOrdem(rowById(id));
  // Botão WhatsApp da lista: manda a ordem em PDF (via do motorista) no lugar do texto.
  window.whatsapp = id => { const r = rowById(id); if (r) enviarWhatsPdf(r, 'motorista') };

  /* ---------- Lista: botão da ordem e destinatários extras ---------- */
  function decorarLista() {
    const tbody = byId('tbodyOperacional'); if (!tbody) return;
    [...tbody.querySelectorAll('tr')].forEach(tr => {
      const ed = tr.querySelector('button[onclick^="edit("]'); if (!ed) return;
      const id = (ed.getAttribute('onclick').match(/\d+/) || [])[0]; const r = id && rowById(id); if (!r) return;
      if (!tr.querySelector('.lc-btn-ordem')) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small lc-btn-ordem'; b.textContent = 'Ordem';
        b.title = 'Exportar a ordem de coleta completa'; b.onclick = () => abrirOrdem(r);
        ed.after(b);
      }
      const rems = lista(r.remetentes_extras);
      if (rems.length && tr.cells[0] && !tr.cells[0].querySelector('.lc-extra-rem')) {
        const d = document.createElement('div'); d.className = 'lc-extra-dest lc-extra-rem';
        d.innerHTML = rems.map((e, i) => '<div><b>' + (i + 2) + '. ' + esc(e.remetente || '—') + '</b> • ' + esc(e.endereco_coleta || '') + '</div>').join('');
        tr.cells[0].appendChild(d);
      }
      const extras = lista(r.entregas_extras);
      if (extras.length && tr.cells[1] && !tr.cells[1].querySelector('.lc-extra-dest')) {
        const d = document.createElement('div'); d.className = 'lc-extra-dest';
        d.innerHTML = extras.map((e, i) => '<div><b>' + (i + 2) + '. ' + esc(e.destinatario || '—') + '</b> • ' + esc(e.endereco_entrega || '') + '</div>').join('');
        tr.cells[1].appendChild(d);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    [120, 450, 1000].forEach(ms => setTimeout(ensureUI, ms));
    carregarClientes();
    const modal = byId('modal');
    if (modal) new MutationObserver(() => { if (modal.open) setTimeout(carregarNoFormulario, 60) }).observe(modal, { attributes: true, attributeFilter: ['open'] });
    const tbody = byId('tbodyOperacional');
    if (tbody) { let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(decorarLista, 80) }).observe(tbody, { childList: true, subtree: true }) }
  });
})();
</script>
