<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="rc-versao" content="eac931a7e809"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Roteirizador Inteligente de Cargas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: trilho de navegação à esquerda (barra inferior no celular), área de trabalho com cartões por função. Sinalização viária: asfalto + amarelo de faixa. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --sunk:#E3E8ED;
  --ink:#14202B; --ink-2:#4B5A68; --ink-3:#77869A; --line:#D3DAE1; --line-2:#E4E9EE;
  --brand:#1E3448; --brand-ink:#FFFFFF; --accent:#F2B300; --accent-ink:#7A5400; --accent-soft:#FFF3CC;
  --ok:#1D7F55; --ok-soft:#DDF2E8; --warn:#B66A00; --warn-soft:#FCEBD2; --bad:#B8322A; --bad-soft:#F9DEDB; --info:#2C67A6; --info-soft:#DCE8F6;
  --r1:#2C67A6; --r2:#D1522A; --r3:#1D7F55; --r4:#8B46B0; --r5:#B66A00; --r6:#0E8A8A; --r7:#B0386A; --r8:#5E6E1A;
  --map-dot:#B9C4CF; --map-bg:#F4F6F8;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --rad:10px; --rad-s:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --sunk:#0C1217;
  --ink:#E6ECF1; --ink-2:#A9B6C3; --ink-3:#7B8A99; --line:#2C3946; --line-2:#24303B;
  --brand:#0B1218; --brand-ink:#F3F6F8; --accent:#F2B300; --accent-ink:#FFD25C; --accent-soft:#3A2E0A;
  --ok:#4CC08A; --ok-soft:#173A2B; --warn:#F0A43A; --warn-soft:#3D2A10; --bad:#F07467; --bad-soft:#41201D; --info:#77AEEA; --info-soft:#1A2E45;
  --r1:#77AEEA; --r2:#F08560; --r3:#4CC08A; --r4:#C08BE0; --r5:#F0A43A; --r6:#4CC9C9; --r7:#EE7AA9; --r8:#B5C95A;
  --map-dot:#34424F; --map-bg:#141C23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --sunk:#0C1217;
  --ink:#E6ECF1; --ink-2:#A9B6C3; --ink-3:#7B8A99; --line:#2C3946; --line-2:#24303B;
  --brand:#0B1218; --brand-ink:#F3F6F8; --accent:#F2B300; --accent-ink:#FFD25C; --accent-soft:#3A2E0A;
  --ok:#4CC08A; --ok-soft:#173A2B; --warn:#F0A43A; --warn-soft:#3D2A10; --bad:#F07467; --bad-soft:#41201D; --info:#77AEEA; --info-soft:#1A2E45;
  --r1:#77AEEA; --r2:#F08560; --r3:#4CC08A; --r4:#C08BE0; --r5:#F0A43A; --r6:#4CC9C9; --r7:#EE7AA9; --r8:#B5C95A;
  --map-dot:#34424F; --map-bg:#141C23; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:.93em}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* casca */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--brand);color:var(--brand-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14.5px;color:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button:hover{background:color-mix(in srgb,var(--brand-ink) 9%,transparent);color:var(--brand-ink)}
.nav button[aria-current="page"]{background:var(--accent);color:#1A1300}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);background:color-mix(in srgb,var(--brand-ink) 14%,transparent);padding:1px 6px;border-radius:9px}
.nav button[aria-current="page"] .cnt{background:rgba(0,0,0,.15)}
.rail-foot{margin-top:auto;font-size:12px;opacity:.8;display:flex;flex-direction:column;gap:6px;padding:0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.local{background:var(--warn)}
main{min-width:0;padding-block:18px 60px;padding-inline:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:30px;line-height:1.05;text-transform:uppercase}
.top .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.datebox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:4px 6px}
.datebox input{border:0;background:transparent;padding:4px;font-family:var(--f-mono);font-size:14px}
.datebox .dow{font:700 13px var(--f-display);text-transform:uppercase;background:var(--accent);color:#1A1300;border-radius:5px;padding:2px 7px;letter-spacing:.04em}

/* elementos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card+.card,.stack>*+*{margin-top:14px}
.card h2{font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.card h3{font-size:16px}
.card-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink-3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--accent);border-color:var(--accent);color:#1A1300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--accent);border-color:var(--accent);color:#1A1300}}
.btn.go{background:var(--accent);border-color:var(--accent);color:#1A1300}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:13px;border-radius:6px}
.btn.ic{padding:4px 7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14.5px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-size:14px}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2)}
textarea{min-height:64px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.daychips{display:flex;gap:3px}
.daychips button{all:unset;cursor:pointer;font:600 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.03em;width:30px;text-align:center;padding:4px 0;border-radius:5px;background:var(--sunk);color:var(--ink-3)}
.daychips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .daychips button[aria-pressed="true"]{background:var(--accent);color:#1A1300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daychips button[aria-pressed="true"]{background:var(--accent);color:#1A1300}}
.daychips button:disabled{cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.note{border-left:4px solid var(--info);background:var(--info-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:20px;color:var(--ink);margin-bottom:6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.kpi{background:var(--surface);padding:11px 13px;min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 23px/1.15 var(--f-display);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font:500 13px var(--f-body);color:var(--ink-2)}
.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td input[type=number],td input[type=text],td input[type=time],td select{padding:4px 6px;font-size:13px}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* mapa */
.map{position:relative;background:var(--map-bg);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;touch-action:none;user-select:none}
.map svg{display:block;width:100%;height:auto;aspect-ratio:16/10;max-width:100%;cursor:grab}
.map .ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.map .ctl button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.map .tag{position:absolute;left:8px;bottom:8px;font-size:11.5px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 7px;border-radius:5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}

/* rotas */
.vcard{border:1px solid var(--line);border-radius:var(--rad);background:var(--surface);overflow:hidden}
.vcard+.vcard{margin-top:12px}
.vhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vhead .sw{width:12px;height:30px;border-radius:3px;flex:none}
.vhead h3{font-size:19px;text-transform:uppercase}
.plate{font:500 12px var(--f-mono);border:1.5px solid var(--ink-2);border-radius:4px;padding:1px 6px;letter-spacing:.06em}
.vstats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2)}
.vstats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.hi{background:var(--warn)} .bar i.over{background:var(--bad)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-2);align-items:center}
.stop:last-child{border-bottom:0}
.seq{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff}
.stop .who{font-weight:600}
.stop .meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px}
.stop .act{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.stop.locked{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.vfoot{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--surface-2)}
.money b{font-family:var(--f-mono);font-weight:500}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* carga */
.scroll-list{max-height:560px;overflow:auto}
.cargo svg{width:100%;height:auto;max-width:100%;display:block}
.dz{border:2px dashed var(--line);border-radius:var(--rad);padding:22px;text-align:center;background:var(--surface-2);transition:border-color .15s}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* painel lateral */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:18px 18px 40px;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;gap:0}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;overflow-x:auto}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;min-width:0;align-items:center}
  .nav .cnt{display:none}
  main{padding-inline:16px;padding-block:14px 96px}
  .top h1{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .stop{grid-template-columns:30px minmax(0,1fr)}
  .stop .act{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dsp-q{width:100%;padding:8px 10px;border:1px solid var(--line,#d5dbe3);border-radius:8px;font:inherit;margin-bottom:10px;background:var(--surface,#fff);color:inherit}.dsp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.dsp{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--line,#d5dbe3);border-radius:8px}.dsp label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-width:0;flex:1}.dsp input{margin-top:3px}.dsp.com-rota{border-color:var(--info,#2b6cb0);background:rgba(43,108,176,.07)}.dsp span{display:flex;flex-direction:column;min-width:0}.dsp small{opacity:.7;font-size:11.5px}.dsp:has(input:checked){border-color:#2f9e61;background:rgba(47,158,97,.07)}
.escala-cols{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px}@media(max-width:760px){.escala-cols{grid-template-columns:1fr}}.dsp-list{display:flex;flex-direction:column;gap:5px;max-height:460px;overflow:auto}.dsp-list .dsp{cursor:pointer;justify-content:flex-start}.escala{margin-bottom:14px}.ideia{border:1px solid var(--line,#d5dbe3);border-left:4px solid var(--info,#2b6cb0);border-radius:8px;padding:8px 10px;margin-bottom:8px}.ideia .row{gap:8px;align-items:center}.rota-cid{margin-top:3px;opacity:.85}.escala .empty{padding:18px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line,#d5dbe3);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:inherit;border-right:1px solid var(--line,#d5dbe3)}.seg button:last-child{border-right:0}.seg button.on{font-weight:700;color:#fff}.seg button.t-fiorino{background:#2f9e61}.seg button.t-van{background:#2b6cb0}.seg button.t-tubos{background:#b7791f}.seg button:disabled{cursor:default}
.sb-st{font:inherit;font-size:12.5px;font-weight:600;padding:4px 6px;border-radius:7px;border:1px solid var(--line,#d5dbe3)}.sb-st.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}.sb-st.info{background:#dbeafe;color:#1e40af;border-color:#93c5fd}.sb-st.ok{background:#dcfce7;color:#166534;border-color:#86efac}
.copiar-nf{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:4px;padding:0;border:1px solid var(--line,#d5dbe3);border-radius:6px;background:var(--surface,#fff);color:var(--ink,#334155);cursor:pointer;vertical-align:middle}.copiar-nf:hover{border-color:currentColor}

<script>
/* Ponte do Roteirizador dentro do CONSTRULOG: oferece à página a mesma interface que ela usa
   como artefato (claude.use('db' | 'user' | 'downloads')), gravando no banco do CONSTRULOG
   (/api/rc/...) com a sessão do usuário. Também expõe RC_HOST para buscar no SSW e na Frota. */
(function () {
  'use strict';
  const LOGIN = '/?login=1#roteirizador-cargas';
  async function api(method, url, body) {
    const r = await fetch(url, { method, credentials: 'same-origin', cache: 'no-store', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    let j = {};
    try { j = await r.json(); } catch (e) { /* sem corpo */ }
    if (r.status === 401) { try { (window.top || window).location.href = LOGIN; } catch (e) { location.href = LOGIN; } }
    if (!r.ok || j.ok === false) {
      const e = new Error(j.error || 'HTTP ' + r.status);
      e.code = r.status === 403 || r.status === 400 ? 'invalid_argument' : r.status === 413 ? 'quota_exceeded' : r.status === 401 ? 'revoked' : 'unavailable';
      e.status = r.status;
      throw e;
    }
    return j;
  }

  // ---- banco de documentos com atualização periódica ----
  const docs = new Map();
  let desde = null, pronto = false, subs = [], timer = null, emAndamento = null;
  const colDe = (p) => p.slice(0, p.lastIndexOf('/'));
  const snapDoc = (p) => { const d = docs.get(p); return { id: p.slice(p.lastIndexOf('/') + 1), exists: !!d, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const snapCol = (c) => {
    const out = [];
    for (const [p, d] of docs) if (colDe(p) === c) out.push({ id: p.slice(p.lastIndexOf('/') + 1), exists: true, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } });
    out.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    return { docs: out, size: out.length, empty: !out.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  };
  function avisar(paths) {
    for (const s of subs.slice()) {
      if (paths && !paths.some((p) => (s.doc ? p === s.path : colDe(p) === s.path))) continue;
      try { s.cb(s.doc ? snapDoc(s.path) : snapCol(s.path)); } catch (e) { console.error(e); }
    }
  }
  async function buscar() {
    if (emAndamento) return emAndamento;
    emAndamento = (async () => {
      try {
        const j = await api('GET', '/api/rc/mudancas' + (desde ? '?desde=' + encodeURIComponent(desde) : ''));
        const mudou = [];
        if (j.completo) docs.clear();
        for (const d of j.docs || []) { docs.set(d.path, d.data); mudou.push(d.path); }
        for (const p of j.removidos || []) { docs.delete(p); mudou.push(p); }
        desde = j.agora;
        if (!pronto) { pronto = true; avisar(null); } else if (mudou.length) avisar(mudou);
      } catch (e) { console.warn('Roteirizador: sincronização', e.message); }
      finally { emAndamento = null; }
    })();
    return emAndamento;
  }
  function ligar() {
    if (timer) return;
    buscar();
    timer = setInterval(() => { if (document.visibilityState !== 'hidden') buscar(); }, 8000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscar(); });
  }
  function assinar(path, doc, cb) {
    const s = { path, doc, cb };
    subs.push(s);
    ligar();
    if (pronto) setTimeout(() => cb(doc ? snapDoc(path) : snapCol(path)), 0);
    return () => { subs = subs.filter((x) => x !== s); };
  }
  const db = {
    doc(path) {
      return {
        path, id: path.slice(path.lastIndexOf('/') + 1),
        onSnapshot: (cb) => assinar(path, true, cb),
        get: async () => { if (!pronto) await buscar(); return snapDoc(path); },
        set: async (data) => { await api('PUT', '/api/rc/doc', { path, data }); docs.set(path, data); avisar([path]); },
        update: async (data) => { const cur = Object.assign({}, docs.get(path) || {}, data); await api('PUT', '/api/rc/doc', { path, data: cur }); docs.set(path, cur); avisar([path]); },
        delete: async () => { await api('DELETE', '/api/rc/doc?path=' + encodeURIComponent(path)); docs.delete(path); avisar([path]); },
        collection: (sub) => db.collection(path + '/' + sub),
      };
    },
    collection(path) {
      return {
        path,
        onSnapshot: (cb) => assinar(path, false, cb),
        get: async () => { if (!pronto) await buscar(); return snapCol(path); },
        doc: (id) => db.doc(path + '/' + (id || Math.random().toString(36).slice(2, 12))),
        add: async (data) => { const d = db.doc(path + '/' + Math.random().toString(36).slice(2, 12)); await d.set(data); return d; },
        where() { return this; }, orderBy() { return this; }, limit() { return this; },
      };
    },
  };

  // ---- usuário ----
  let eu = null;
  const euP = api('GET', '/api/rc/eu').then((j) => (eu = j)).catch(() => null);
  const user = {
    canEdit: async () => { await euP; return !!(eu && eu.admin); },
    isOwner: async () => { await euP; return !!(eu && eu.admin); },
    can: async () => true,
    id: async () => { await euP; return eu ? eu.username : null; },
    me: async () => { await euP; return { id: eu && eu.username, name: eu && eu.username, email: null }; },
    profiles: async (ids) => Object.fromEntries((ids || []).map((i) => [i, { name: String(i) }])),
  };

  // ---- arquivos para baixar ----
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return { status: 'saved' };
    },
  };
  window.claude = { use: async (nome) => ({ db, user, downloads }[nome] || null) };

  // ---- aviso de versão nova ----
  (function () {
    const meta = document.querySelector('meta[name="rc-versao"]');
    const minha = meta && meta.content;
    if (!minha) return;
    let avisado = false;
    async function conferir() {
      if (avisado) return;
      try {
        const r = await fetch('/api/rc/sistema', { cache: 'no-store', credentials: 'same-origin' });
        const j = await r.json();
        if (j && j.pagina && j.pagina !== minha) mostrar();
      } catch (e) { /* sem rede: tenta depois */ }
    }
    function mostrar() {
      avisado = true;
      window.RC_HOST.novaVersao = true;
      const bt = document.getElementById('rcAtualizar'); if (bt) { bt.textContent = '🔄 Nova versão — atualizar'; bt.style.background = '#f5b301'; bt.style.color = '#16142f'; }
      const d = document.createElement('div');
      d.setAttribute('role', 'status');
      d.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#16142f;color:#fff;padding:10px 12px 10px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font:14px system-ui,sans-serif;max-width:calc(100% - 32px)';
      d.innerHTML = '<span>Nova versão do Roteirizador disponível.</span>';
      const b = document.createElement('button');
      b.textContent = 'Atualizar agora';
      b.style.cssText = 'background:#f5b301;color:#16142f;border:0;border-radius:7px;padding:7px 12px;font:600 14px system-ui,sans-serif;cursor:pointer';
      b.onclick = () => { try { (window.top || window).location.reload(); } catch (e) { location.reload(); } };
      d.appendChild(b);
      document.body.appendChild(d);
    }
    setInterval(() => { if (document.visibilityState !== 'hidden') conferir(); }, 5 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') conferir(); });
    setTimeout(conferir, 20000);
  })();

  // ---- integrações do CONSTRULOG ----
  const diasAtras = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }); };
  window.RC_HOST = {
    nome: 'CONSTRULOG',
    // empresa fora da CONSTRULOG (demonstração ou teste grátis): o app roda sem as integrações do SSW/Frota/Rastreio,
    // que leem dados da CONSTRULOG. Resolve com {demo, cliente, testeAte} nesse caso, ou null.
    pronto: euP.then((j) => (j && j.sandbox ? { demo: !!j.demo, cliente: j.cliente || '', testeAte: j.testeAte || null } : null)).catch(() => null),
    // CTRCs disponíveis para entrega: SSW opção 038 (pendências), com peso, m³ e frete do BI2
    // situação das notas que ficaram: em rota (saiu dos disponíveis = romaneio) ou entregue (baixa no BI2)
    statusNfs: (nfs, desde) => api('GET', '/api/programacao-entregas/status-nfs?nfs=' + encodeURIComponent(nfs.join(',')) + '&desde=' + encodeURIComponent(desde || '')),
    // romaneios emitidos no SSW num dia (por motorista) e a rota de um romaneio (km e pontos de entrega)
    romaneiosDoDia: (data) => api('GET', '/api/roteirizador/lista?date=' + encodeURIComponent(data)),
    recalcularRota: (corpo) => api('POST', '/api/roteirizador/recalcular', corpo),
    rotaRomaneio: (data, romaneio) => api('GET', '/api/roteirizador/rota?date=' + encodeURIComponent(data) + '&romaneio=' + encodeURIComponent(romaneio)),
    sswDisponiveis: (forcar) => api('GET', '/api/programacao-entregas/disponiveis' + (forcar ? '?force=1' : '')),
    // veículos e motoristas: tela Frota + quem rodou no Rastreio de carga nos últimos dias
    async frotaERastreio(dias) {
      dias = dias || 14;
      const out = { veiculos: [], pessoas: [], rastreio: [], contatos: [], avisos: [] };
      try { const f = await api('GET', '/api/painel/frota-state'); out.veiculos = (f.data && f.data.vehicles) || []; out.pessoas = (f.data && f.data.people) || []; }
      catch (e) { out.avisos.push('Frota: ' + e.message); }
      try { out.contatos = (await api('GET', '/api/painel/tracking/contacts')).rows || []; } catch (e) { out.avisos.push('Telefones do rastreio: ' + e.message); }
      const datas = Array.from({ length: dias }, (_, i) => diasAtras(i));
      const res = await Promise.all(datas.map((d) => api('GET', '/api/painel/tracking/history-drivers?date=' + d).then((j) => (j.rows || []).map((r) => Object.assign({ data: d }, r))).catch((e) => { out.avisos.push('Rastreio de carga: ' + e.message); return []; })));
      out.rastreio = res.flat();
      out.avisos = [...new Set(out.avisos)].slice(0, 5);
      return out;
    },
  };
})();

</script>

  // Linhas de planilha -> notas. Linhas com a mesma chave/número viram itens da mesma nota.
  RE.rowsToNotas = (rows) => {
    if (rows.length < 2) return [];
    const map = RE.mapHeaders(rows[0]);
    const byKey = new Map();
    for (const r of rows.slice(1)) {
      const g = (k) => (map[k] != null ? String(r[map[k]] == null ? '' : r[map[k]]).trim() : '');
      const chave = g('chave').replace(/\D/g, '');
      const key = chave || (g('numero') + '/' + g('serie') + '/' + g('destDoc') + g('destNome'));
      if (!key.replace(/\//g, '')) continue;
      let n = byKey.get(key);
      if (!n) {
        n = {
          chave: chave.length === 44 ? chave : '', numero: g('numero'), serie: g('serie'), emissao: RE.parseDateBR(g('emissao')) || '',
          destNome: g('destNome'), destDoc: g('destDoc').replace(/\D/g, ''),
          endereco: { lgr: g('lgr'), nro: g('nro'), bairro: g('bairro'), cidade: g('cidade'), uf: g('uf').toUpperCase(), cep: g('cep').replace(/\D/g, ''), cMun: '' },
          pesoB: num(g('pesoB')), volM3: num(g('volM3')), valorMerc: num(g('valorMerc')) || 0, freteXml: 0,
          frete: num(g('frete')), prazo: RE.parseDateBR(g('prazo')) || '', itens: [], origem: 'planilha',
          ctrc: g('ctrc'), emitente: g('emitente'), qVol: num(g('qVol')), mercadoria: g('mercadoria'), exigeTubo: /TUBO/i.test(g('mercadoria')),
          lat: num(g('lat')), lon: num(g('lon')),
        };
        if (chave.length === 44) { const c = RE.parseChave(chave); if (c) { n.numero = n.numero || c.numero; n.serie = n.serie || c.serie; } }
        byKey.set(key, n);
      } else {
        const p = num(g('pesoB')); if (p != null) n.pesoB = (n.pesoB || 0) + p;
        const v = num(g('volM3')); if (v != null) n.volM3 = (n.volM3 || 0) + v;
      }
      if (g('desc')) {
        const it = { cod: g('cod'), desc: g('desc'), qtd: num(g('qtd')) || 1, un: '', vProd: 0 };
        const dmm = num(g('diam')), cm = num(g('compr'));
        if (dmm) it.desc += ' ' + dmm + 'MM';
        if (cm) it.desc += ' ' + String(cm).replace('.', ',') + 'M';
        n.itens.push(it);
      }
    }
    return [...byKey.values()];
  };

  // Linha de "CTRCs disponíveis para entrega" (SSW opção 038, pendências) -> nota
  RE.notaDoSSW = (r) => {
    const merc = [r.mercadoria, r.detalhes].filter(Boolean).join(' ');
    return {
      numero: String(r.nf || '').replace(/^0+/, ''), serie: '', ctrc: r.ctrc || '', emitente: r.remetente || '', destNome: r.cliente || '',
      endereco: { lgr: r.endereco || '', nro: '', bairro: '', cidade: r.cidade || '', uf: r.uf || 'SP', cep: '', cMun: '' },
      pesoB: r.peso > 0 ? r.peso : null, volM3: r.m3 > 0 ? r.m3 : null, qVol: r.volumes || null, valorMerc: r.valorMerc || 0, freteXml: 0,
      frete: r.frete > 0 ? r.frete : null, prazo: RE.parseDateBR(r.previsao) || '', itens: [], origem: 'ssw', mercadoria: r.mercadoria || '',
      obs: r.detalhes || '', exigeTubo: /\bTUBO/i.test(merc), statusSSW: r.status || '',
    };
  };

  // ---------- reconhecimento de produtos ----------
  const NPS = { '1/2': 21.3, '3/4': 26.7, '1': 33.4, '1.1/4': 42.2, '1.1/2': 48.3, '2': 60.3, '2.1/2': 73.0, '3': 88.9, '4': 114.3, '5': 141.3, '6': 168.3, '8': 219.1, '10': 273.1, '12': 323.9 };
  RE.classificar = (desc) => {
    const d = norm(desc);
    if (/\bCAIXA D.?AGUA\b|\bCX D.?AGUA\b|\bRESERVATORIO\b|\bCAIXA DAGUA\b/.test(d)) return 'caixa_agua';
    if (/\b(JOELHO|LUVA|CURVA|CONEXAO|ADAPTADOR|REDUCAO|BUCHA|TAMPAO|CAP|UNIAO|COLAR|REGISTRO|VALVULA|FLANGE|TE)\b/.test(d)) return 'conexao';
    if (/\b(TUBO|TUBOS|TB|CANO|BARRA TUBO)\b/.test(d)) return 'tubo';
    return 'outro';
  };
  RE.materialDe = (desc) => {
    const d = norm(desc);
    if (/PEAD|POLIETILENO/.test(d)) return 'PEAD';
    if (/PVC/.test(d)) return 'PVC';
    if (/GALV|ACO|FERRO|CARBONO|INOX/.test(d)) return 'AÇO';
    if (/PPR|POLIPROPILENO/.test(d)) return 'PPR';
    if (/CONCRETO/.test(d)) return 'CONCRETO';
    if (/COBRE/.test(d)) return 'COBRE';
    return '';
  };
  // Extrai dimensões de tubo da descrição. Só devolve o que está escrito.
  RE.dimsDaDescricao = (desc) => {
    const d = norm(desc).replace(/,/g, '.');
    const out = {};
    let m = /(?:\bDN|\bDE|\bØ|\bDIAM\.?|\bD\.)\s*(\d{2,4}(?:\.\d+)?)/.exec(d) || /(\d{2,4}(?:\.\d+)?)\s*MM\b/.exec(d);
    if (m) out.de = +m[1];
    else {
      m = /(\d(?:\.\d\/\d)?|\d\/\d)\s*(?:"|POL\b|POLEGADA)/.exec(d);
      if (m && NPS[m[1]]) { out.dePol = m[1]; out.deNpsSugerido = NPS[m[1]]; }
    }
    m = /(?:\bX\s*|\bC\/\s*|\bCOMP\.?\s*|\bBARRA\s*(?:DE\s*)?)?(\d{1,2}(?:\.\d{1,2})?)\s*(?:M|MT|MTS|METROS?)\b(?!M)/.exec(d.replace(/(\d)\s*MM\b/g, '$1MM'));
    if (m && +m[1] > 0.2 && +m[1] <= 13) out.compr = +m[1];
    m = /(?:ESP\.?|ESPESSURA|PAREDE|E=)\s*(\d{1,2}(?:\.\d+)?)\s*(?:MM)?/.exec(d);
    if (m) out.esp = +m[1];
    m = /\bDI\s*(\d{2,4}(?:\.\d+)?)/.exec(d);
    if (m) out.di = +m[1];
    m = /\bSDR\s*(\d{1,2}(?:\.\d+)?)/.exec(d);
    if (m && out.de && !out.esp) out.esp = round(out.de / +m[1], 1);
    return out;
  };

  // Procura o produto no cadastro: código exato, depois texto contido na descrição
  RE.matchProduto = (it, produtos) => {
    if (!produtos || !produtos.length) return null;
    if (it.cod) { const p = produtos.find((p) => p.codigo && norm(p.codigo) === norm(it.cod)); if (p) return p; }
    const d = norm(it.desc);
    let best = null;
    for (const p of produtos) {
      const t = norm(p.padrao || '');
      if (t && d.includes(t) && (!best || t.length > norm(best.padrao).length)) best = p;
    }
    return best;
  };

  const DENS = { PVC: 1.40, PEAD: 0.95, 'AÇO': 7.85, PPR: 0.90, CONCRETO: 2.40, COBRE: 8.96 };
  // Enriquecimento de uma nota com cadastro, unidades e pendências. Não inventa peso, volume nem frete.
  RE.enriquecer = (nota, ctx) => {
    const produtos = ctx.produtos || [];
    const cfg = ctx.cfg || {};
    const pend = [], avisos = [];
    let volItens = 0, volItensCompleto = true, pesoItens = 0, pesoItensCompleto = true;
    const itens = (nota.itens || []).map((it0) => {
      const it = Object.assign({}, it0);
      const p = RE.matchProduto(it, produtos);
      it.produtoId = p ? p.id : null;
      it.tipo = p && p.tipo ? p.tipo : RE.classificar(it.desc);
      const un = norm(it.un);
      if (it.tipo === 'tubo') {
        const dd = RE.dimsDaDescricao(it.desc);
        const t = {
          de: p && p.diamExtMm || dd.de || null,
          esp: p && p.espMm || dd.esp || null,
          di: p && p.diamIntMm || dd.di || null,
          compr: p && p.comprM || dd.compr || null,
          material: p && p.material || RE.materialDe(it.desc),
          encaixavel: p ? p.encaixavel !== false : true,
          pesoUnit: p && p.pesoUnitKg || null,
          dims: p && (p.diamExtMm || p.comprM) ? 'cadastro' : 'descricao',
        };
        if (!t.di && t.de && t.esp) t.di = round(t.de - 2 * t.esp, 1);
        // vendido por metro: quantidade em metros -> barras
        let barras = it.qtd;
        if ((un === 'M' || un === 'MT' || un === 'MTS' || un === 'METRO') && t.compr) barras = Math.ceil(it.qtd / t.compr - 1e-9);
        t.barras = Math.max(0, Math.round(barras));
        if (!t.de) pend.push({ cod: 'tubo_diametro', bloqueia: true, item: it.desc, msg: 'Tubo sem diâmetro externo: ' + it.desc + (dd.dePol ? ' (bitola ' + dd.dePol + '" — confirme o diâmetro em mm no cadastro)' : '') });
        if (!t.compr) pend.push({ cod: 'tubo_comprimento', bloqueia: true, item: it.desc, msg: 'Tubo sem comprimento: ' + it.desc });
        if (t.de && !t.di) avisos.push({ cod: 'tubo_sem_di', msg: 'Sem diâmetro interno: ' + it.desc + ' não recebe outros tubos dentro' });
        if (t.de && t.compr) {
          it.volM3 = round((t.de / 1000) ** 2 * t.compr * t.barras, 4); // caixa envolvente
          volItens += 0; // tubos são tratados pela geometria
          if (t.pesoUnit) { t.pesoFonte = 'cadastro'; }
          else if (t.di && DENS[t.material]) {
            const a = Math.PI / 4 * ((t.de / 1000) ** 2 - (t.di / 1000) ** 2);
            t.pesoUnit = round(a * t.compr * DENS[t.material] * 1000, 2); t.pesoFonte = 'geometria';
          }
        }
        it.tubo = t;
        if (t.pesoUnit) pesoItens += t.pesoUnit * t.barras; else pesoItensCompleto = false;
      } else {
        const vu = p && p.volUnitM3, pu = p && p.pesoUnitKg;
        if (vu) { it.volM3 = round(vu * it.qtd, 4); volItens += it.volM3; } else volItensCompleto = false;
        if (pu) { it.pesoKg = round(pu * it.qtd, 3); pesoItens += it.pesoKg; } else pesoItensCompleto = false;
      }
      return it;
    });
    const n = Object.assign({}, nota, { itens });
    // peso: nota > operador > cadastro
    if (nota.pesoOperador != null) { n.pesoKg = nota.pesoOperador; n.pesoFonte = 'operador'; }
    else if (nota.pesoB != null && nota.pesoB > 0) { n.pesoKg = nota.pesoB; n.pesoFonte = 'nota'; }
    else if (itens.length && pesoItensCompleto && pesoItens > 0) { n.pesoKg = round(pesoItens, 2); n.pesoFonte = 'cadastro'; }
    else { n.pesoKg = null; pend.push({ cod: 'peso', bloqueia: true, msg: 'Sem peso bruto na nota nem no cadastro dos produtos' }); }
    // volume das mercadorias que não são tubo
    const naoTubos = itens.filter((i) => i.tipo !== 'tubo');
    if (nota.volOperador != null) { n.volOutrosM3 = nota.volOperador; n.volFonte = 'operador'; }
    else if (nota.volM3 != null && nota.volM3 > 0 && !itens.some((i) => i.tipo === 'tubo')) { n.volOutrosM3 = nota.volM3; n.volFonte = nota.origem === 'ssw' ? 'SSW' : nota.origem === 'manual' ? 'informado' : 'planilha'; }
    else if (itens.length && !naoTubos.length) { n.volOutrosM3 = 0; n.volFonte = 'sem itens soltos'; }
    else if (itens.length && volItensCompleto) { n.volOutrosM3 = round(volItens, 4); n.volFonte = 'cadastro'; }
    else if (cfg.cubagemKgM3 > 0 && n.pesoKg) {
      const pesoTubos = itens.filter((i) => i.tubo && i.tubo.pesoUnit).reduce((s, i) => s + i.tubo.pesoUnit * i.tubo.barras, 0);
      n.volOutrosM3 = round(Math.max(0, n.pesoKg - pesoTubos) / cfg.cubagemKgM3, 4); n.volFonte = 'fator de cubagem';
      avisos.push({ cod: 'vol_cubagem', msg: 'Volume estimado pelo fator de cubagem (' + cfg.cubagemKgM3 + ' kg/m³)' });
    } else if (n.pesoKg > 0) {
      // sem m³ mas com peso: não trava a nota, a carga é controlada só pelo peso
      n.volOutrosM3 = 0; n.volFonte = 'sem m³ (vale o peso)';
      avisos.push({ cod: 'vol_peso', msg: 'Sem volume (m³): a carga desta nota é controlada só pelo peso' });
    } else { n.volOutrosM3 = null; pend.push({ cod: 'volume', bloqueia: true, msg: 'Sem volume (m³): informe na nota ou cadastre os produtos' }); }
    // tubos
    n.tubos = [];
    itens.forEach((it, idx) => { if (it.tubo && it.tubo.de && it.tubo.compr && it.tubo.barras > 0) n.tubos.push({ item: idx, desc: it.desc, ...it.tubo }); });
    n.qtdTubos = n.tubos.reduce((s, t) => s + t.barras, 0);
    n.exigeTubo = !!nota.exigeTubo && !n.tubos.length;
    n.volTubosM3 = round(n.tubos.reduce((s, t) => s + (t.de / 1000) ** 2 * t.compr * t.barras, 0), 4);
    // destino
    const e = nota.endereco || {};
    const mun = RE.findMun(e.cMun, e.cidade, e.uf);
    if (!mun) pend.push({ cod: 'cidade', bloqueia: true, msg: 'Cidade de entrega não reconhecida: ' + (e.cidade || '(vazia)') + '/' + (e.uf || '') });
    n.cidadeId = mun ? mun.cod : null;
    n.cidadeNome = mun ? mun.nome + '/' + mun.uf : (e.cidade || '') + '/' + (e.uf || '');
    if (!e.lgr && !nota.pdfParcial) avisos.push({ cod: 'endereco', msg: 'Endereço sem logradouro' });
    if (nota.pdfParcial && !nota.pdfConferido) pend.push({ cod: 'pdf', bloqueia: true, msg: 'Nota lida do PDF: confira destinatário, cidade e peso, ou importe o XML' });
    const cidadeCad = ctx.cidades && n.cidadeId ? ctx.cidades[n.cidadeId] : null;
    if (n.cidadeId && !cidadeCad) pend.push({ cod: 'cidade_sem_rota', bloqueia: true, msg: 'Cidade sem dias de rota cadastrados: ' + n.cidadeNome });
    // coordenadas
    const cli = ctx.clientes && ctx.clientes[RE.clienteKey(nota)];
    if (nota.lat != null && nota.lon != null) { n.lat = nota.lat; n.lon = nota.lon; n.coordFonte = 'confirmada'; }
    else if (cli && cli.lat != null) { n.lat = cli.lat; n.lon = cli.lon; n.coordFonte = 'confirmada'; if (cli.janelaIni) n.janela = { ini: cli.janelaIni, fim: cli.janelaFim }; }
    else if (mun) { n.lat = mun.lat; n.lon = mun.lon; n.coordFonte = 'centro da cidade'; }
    // frete
    if (nota.frete != null && nota.frete !== '') { n.freteValor = +nota.frete; n.freteFonte = 'operador'; }
    else if (nota.freteXml > 0) { n.freteValor = nota.freteXml; n.freteFonte = 'nota'; }
    else if (cidadeCad && (cidadeCad.freteKg > 0 || cidadeCad.freteMin > 0 || cidadeCad.fretePct > 0) && n.pesoKg) {
      n.freteValor = round(Math.max(cidadeCad.freteMin || 0, (cidadeCad.freteKg || 0) * n.pesoKg + (cidadeCad.fretePct || 0) / 100 * (n.valorMerc || 0)), 2);
      n.freteFonte = 'tabela da cidade';
    } else { n.freteValor = 0; n.freteFonte = 'sem frete'; avisos.push({ cod: 'frete', msg: 'Sem valor de frete: a receita desta nota entra como zero' }); }
    // prazo
    if (nota.prazo) n.prazoEfetivo = nota.prazo;
    else if (cfg.prazoPadraoDias > 0 && nota.emissao) { n.prazoEfetivo = RE.addDays(nota.emissao, cfg.prazoPadraoDias); avisos.push({ cod: 'prazo_padrao', msg: 'Prazo calculado pelo padrão de ' + cfg.prazoPadraoDias + ' dias após a emissão' }); }
    else n.prazoEfetivo = '';
    n.pendencias = pend; n.avisos = avisos;
    n.bloqueada = pend.some((p) => p.bloqueia);
    return n;
  };
  RE.clienteKey = (n) => {
    const e = n.endereco || {};
    return ((n.destDoc || norm(n.destNome)) + '-' + (e.cep || '') + '-' + norm(e.nro)).replace(/[^A-Za-z0-9_\-.]/g, '').slice(0, 120) || 'sem-cliente';
  };

  // ---------- geometria de círculos (encaixe e seção transversal) ----------
  // Empacota círculos (raio em mm) num contêiner: {tipo:'retangulo', w, h} com origem no canto inferior esquerdo,
  // ou {tipo:'circulo', r} com centro na origem. Gravidade para baixo. folga em mm entre peças e paredes.
  function Packer(cont, folga) {
    this.c = cont; this.g = folga || 0; this.list = []; this.cell = 0; this.grid = new Map();
  }
  Packer.prototype._key = function (x, y) { return Math.floor(x / this.cell) + ',' + Math.floor(y / this.cell); };
  Packer.prototype._near = function (x, y, rad) {
    if (!this.cell) return this.list;
    const out = new Set();
    const k = Math.ceil(rad / this.cell) + 1;
    const cx = Math.floor(x / this.cell), cy = Math.floor(y / this.cell);
    for (let i = cx - k; i <= cx + k; i++) for (let j = cy - k; j <= cy + k; j++) { const b = this.grid.get(i + ',' + j); if (b) for (const o of b) out.add(o); }
    return [...out];
  };
  Packer.prototype._add = function (o) {
    this.list.push(o);
    if (!this.cell) { this.cell = Math.max(10, o.r * 2); }
    const k = this._key(o.x, o.y);
    if (!this.grid.has(k)) this.grid.set(k, []);
    this.grid.get(k).push(o);
  };
  Packer.prototype._ok = function (x, y, r) {
    const g = this.g, e = 1e-6;
    if (this.c.tipo === 'retangulo') { if (x - r < g - e || x + r > this.c.w - g + e || y - r < g - e || y + r > this.c.h - g + e) return false; }
    else if (Math.hypot(x, y) + r > this.c.r - g + e) return false;
    for (const o of this._near(x, y, r + this.maxR + g)) {
      if (Math.hypot(x - o.x, y - o.y) < o.r + r + g - e) return false;
    }
    return true;
  };
  const circInter = (x1, y1, r1, x2, y2, r2) => {
    const d = Math.hypot(x2 - x1, y2 - y1);
    if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return [];
    const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
    const xm = x1 + a * (x2 - x1) / d, ym = y1 + a * (y2 - y1) / d;
    return [[xm + h * (y2 - y1) / d, ym - h * (x2 - x1) / d], [xm - h * (y2 - y1) / d, ym + h * (x2 - x1) / d]];
  };
  Packer.prototype.place = function (r, data) {
    this.maxR = Math.max(this.maxR || 0, r);
    const g = this.g, c = this.c, cand = [];
    const rr = r + g; // distância centro-a-parede mínima = r+g ; centro-a-centro = r+o.r+g
    if (c.tipo === 'retangulo') {
      cand.push([rr, rr], [c.w - rr, rr]);
      for (const o of this.list) {
        const D = o.r + r + g;
        for (const y of [rr]) { const dy = y - o.y; if (Math.abs(dy) <= D) { const dx = Math.sqrt(D * D - dy * dy); cand.push([o.x - dx, y], [o.x + dx, y]); } }
        for (const x of [rr, c.w - rr]) { const dx = x - o.x; if (Math.abs(dx) <= D) { const dy = Math.sqrt(D * D - dx * dx); cand.push([x, o.y + dy], [x, o.y - dy]); } }
        for (const o2 of this._near(o.x, o.y, 2 * (this.maxR + g) + 2 * r)) {
          if (o2 === o || o2.i < o.i) continue;
          for (const p of circInter(o.x, o.y, D, o2.x, o2.y, o2.r + r + g)) cand.push(p);
        }
      }
      cand.sort((a, b) => (a[1] - b[1]) || (a[0] - b[0]));
    } else {
      const R = c.r - rr;
      if (R < -1e-9) return null;
      cand.push([0, -R]);
      for (const o of this.list) {
        const D = o.r + r + g;
        for (const p of circInter(0, 0, R, o.x, o.y, D)) cand.push(p);
        for (const o2 of this._near(o.x, o.y, 2 * (this.maxR + g) + 2 * r)) {
          if (o2 === o || o2.i < o.i) continue;
          for (const p of circInter(o.x, o.y, D, o2.x, o2.y, o2.r + r + g)) cand.push(p);
        }
      }
      cand.sort((a, b) => (a[1] - b[1]) || (Math.abs(a[0]) - Math.abs(b[0])));
    }
    for (const [x, y] of cand) {
      if (this._ok(x, y, r)) { const o = { x, y, r, i: this.list.length, data }; this._add(o); return o; }
    }
    return null;
  };
  RE.Packer = Packer;

  // Monta conjuntos de tubos encaixados e a seção transversal.
  // tubos: [{id, de, di, compr, kg, ordem (posição de entrega, 0 = primeira), material, encaixavel, rotulo}]
  // opts: {secaoW, secaoH (mm), comprUtil (m), folga (mm entre tubos), folgaEncaixe (mm), niveis, cargaInternaKgM, ordemImporta}
  RE.encaixarTubos = (tubos, opts) => {
    const folgaEnc = opts.folgaEncaixe != null ? opts.folgaEncaixe : 10;
    const niveis = opts.niveis != null ? opts.niveis : 3;
    const limKgM = opts.cargaInternaKgM || 0;
    const L = opts.comprUtil;
    const pend = tubos.map((t, i) => Object.assign({ idx: i }, t)).sort((a, b) => (b.de - a.de) || (b.compr - a.compr));
    const erros = [];
    for (const t of pend) if (t.compr > L + 1e-9) erros.push({ tubo: t, msg: 'Tubo de ' + t.compr + ' m não cabe no comprimento útil de ' + L + ' m' });
    if (erros.length) return { ok: false, erros, motivo: erros[0].msg };
    const usado = new Set();
    let nEnc = 0;
    // Uma "coluna" é um espaço circular ao longo do comprimento que pode ter várias barras em sequência.
    const mkColuna = (t, comprDisp) => ({ de: t.de, di: t.di, pecas: [t], usadoCompr: t.compr, comprDisp, filhos: [], kg: t.kg });
    const podeEntrar = (c, host, nivel) => {
      if (usado.has(c.idx) || c.encaixavel === false) return false;
      if (nivel > niveis) return false;
      if (c.de > host.di - 2 * folgaEnc + 1e-9) return false;
      if (c.compr > host.comprInterno + 1e-9) return false;
      if (opts.ordemImporta && c.ordem > host.ordem) return false; // tubo de dentro sai antes ou junto do hospedeiro
      if (!opts.ordemImporta && c.ordem !== host.ordem) return false;
      return true;
    };
    const encherInterior = (col, nivel) => {
      // o interior do maior tubo da coluna (comprimento = menor peça da coluna, de forma conservadora)
      const host = col.pecas[0];
      if (!host.di || host.encaixavel === false) return;
      const comprInt = Math.min(...col.pecas.map((p) => p.compr));
      const hostInfo = { di: host.di, comprInterno: comprInt, ordem: Math.min(...col.pecas.map((p) => p.ordem)) };
      const R = host.di / 2 - folgaEnc;
      if (R <= 0) return;
      const pk = new Packer({ tipo: 'circulo', r: host.di / 2 }, folgaEnc);
      let kgDentro = 0;
      const limite = limKgM > 0 ? limKgM * comprInt : Infinity;
      for (const c of pend) {
        if (!podeEntrar(c, hostInfo, nivel)) continue;
        if (kgDentro + (c.kg || 0) > limite + 1e-9) continue;
        const o = pk.place(c.de / 2, null);
        if (!o) continue;
        usado.add(c.idx); nEnc++;
        kgDentro += c.kg || 0;
        const sub = mkColuna(c, comprInt);
        // barras menores em sequência no mesmo espaço
        for (const c2 of pend) {
          if (usado.has(c2.idx) || c2.de !== c.de || c2.di !== c.di || c2.material !== c.material) continue;
          if (!podeEntrar(c2, hostInfo, nivel)) continue;
          if (sub.usadoCompr + c2.compr > comprInt + 1e-9) continue;
          if (kgDentro + (c2.kg || 0) > limite + 1e-9) continue;
          usado.add(c2.idx); nEnc++; kgDentro += c2.kg || 0; sub.pecas.push(c2); sub.usadoCompr += c2.compr; sub.kg += c2.kg || 0;
        }
        o.data = sub;
        sub.x = o.x; sub.y = o.y;
        col.filhos.push(sub);
        encherInterior(sub, nivel + 1);
      }
      col.kgDentro = kgDentro;
    };
    const colunas = [];
    for (const t of pend) {
      if (usado.has(t.idx)) continue;
      usado.add(t.idx);
      const col = mkColuna(t, L);
      // barras iguais em sequência no comprimento útil
      for (const t2 of pend) {
        if (usado.has(t2.idx) || t2.de !== t.de || t2.di !== t.di || t2.material !== t.material) continue;
        if (opts.ordemImporta ? false : t2.ordem !== t.ordem) continue;
        if (col.usadoCompr + t2.compr > L + 1e-9) continue;
        usado.add(t2.idx); col.pecas.push(t2); col.usadoCompr += t2.compr; col.kg += t2.kg || 0;
      }
      // os maiores vêm primeiro: o interior é preenchido antes de os menores virarem colunas próprias
      encherInterior(col, 1);
      colunas.push(col);
    }
    const topo = colunas;
    if (opts.semSecao) return { ok: true, colunas: topo, encaixados: nEnc, kgTotal: tubos.reduce((a, t) => a + (t.kg || 0), 0) };
    // seção transversal
    const pk = new Packer({ tipo: 'retangulo', w: opts.secaoW, h: opts.secaoH }, opts.folga != null ? opts.folga : 5);
    const naoCouberam = [];
    topo.sort((a, b) => b.de - a.de);
    for (const col of topo) {
      const o = pk.place(col.de / 2, col);
      if (!o) { naoCouberam.push(col); continue; }
      col.x = o.x; col.y = o.y;
    }
    const kgTotal = tubos.reduce((s, t) => s + (t.kg || 0), 0);
    let alturaUsada = 0, areaUsada = 0;
    for (const o of pk.list) { alturaUsada = Math.max(alturaUsada, o.y + o.r); areaUsada += Math.PI * o.r * o.r; }
    const comprUsado = topo.length ? Math.max(...topo.map((c) => c.usadoCompr)) : 0;
    const contar = (c) => c.pecas.length + c.filhos.reduce((s, f) => s + contar(f), 0);
    return {
      ok: naoCouberam.length === 0,
      motivo: naoCouberam.length ? naoCouberam.length + ' coluna(s) de tubos não cabem na seção de ' + opts.secaoW + ' × ' + opts.secaoH + ' mm' : '',
      colunas: topo, naoCouberam,
      conjuntos: topo.filter((c) => c.filhos.length).length,
      encaixados: nEnc,
      totalTubos: tubos.length,
      alturaUsadaMm: round(alturaUsada, 0),
      ocupacaoSecao: round(areaUsada / (opts.secaoW * opts.secaoH), 4),
      ocupacaoAltura: round(alturaUsada / opts.secaoH, 4),
      comprUsadoM: round(comprUsado, 2),
      kgTotal: round(kgTotal, 2),
      pecasPorColuna: topo.map(contar),
    };
  };

  // ---------- carga do veículo ----------
  // paradas: [{key, ordem, kg, m3, tubos:[...]}]  (ordem só importa quando opts.ordemImporta)
  RE.verificarCarga = (veic, paradas, cfg, ordemImporta) => {
    const kg = paradas.reduce((s, p) => s + p.kg, 0);
    const m3Outros = paradas.reduce((s, p) => s + p.m3, 0);
    const res = { ok: true, motivos: [], kg: round(kg, 2), m3Outros: round(m3Outros, 4), tubos: null, m3Tubos: 0 };
    if (kg > veic.capKg + 1e-6) { res.ok = false; res.motivos.push('Peso ' + round(kg, 0) + ' kg acima da capacidade de ' + veic.capKg + ' kg'); }
    const tubos = [];
    for (const p of paradas) for (const t of p.tubos) {
      for (let b = 0; b < t.barras; b++) tubos.push({ de: t.de, di: t.di || null, compr: t.compr, kg: t.pesoUnit || 0, material: t.material || '', encaixavel: t.encaixavel !== false, ordem: p.ordem || 0, parada: p.key, rotulo: t.desc });
    }
    let volTuboZona = 0;
    if (tubos.length) {
      const tubeVan = veic.tipo === 'tubos';
      if (!tubeVan && veic.aceitaTubos === false) { res.ok = false; res.motivos.push('Veículo não aceita tubos'); }
      else {
        const secW = tubeVan ? (veic.secaoL || 1) * 1000 : (veic.larg || 1) * 1000;
        const secH = tubeVan ? (veic.secaoA || 1) * 1000 : (veic.alt || 1) * 1000;
        const comprUtil = tubeVan ? (veic.tuboCompr || veic.compr || 3) : (veic.compr || 2);
        const enc = RE.encaixarTubos(tubos, { secaoW: secW, secaoH: secH, comprUtil, folga: cfg.folgaSecaoMm, folgaEncaixe: cfg.folgaEncaixeMm, niveis: cfg.niveisEncaixe, cargaInternaKgM: cfg.cargaInternaKgM, ordemImporta });
        res.tubos = enc;
        if (!enc.ok) { res.ok = false; res.motivos.push(enc.motivo); }
        else {
          // zona ocupada pelos tubos dentro do baú (para o restante da carga)
          const comprNoBau = Math.min(enc.comprUsadoM, veic.compr || enc.comprUsadoM);
          volTuboZona = (secW / 1000) * (enc.alturaUsadaMm / 1000) * comprNoBau;
          res.m3Tubos = round(volTuboZona, 3);
        }
      }
    }
    const aprov = cfg.aproveitamento || 0.85;
    const livre = Math.max(0, veic.capM3 - volTuboZona) * aprov;
    res.m3Livre = round(livre, 3);
    res.m3Usado = round(m3Outros + volTuboZona, 3);
    res.ocupVol = round((m3Outros / aprov + volTuboZona) / veic.capM3, 4);
    res.ocupPeso = round(kg / veic.capKg, 4);
    if (m3Outros > livre + 1e-6) { res.ok = false; res.motivos.push('Volume ' + round(m3Outros, 2) + ' m³ acima do espaço útil de ' + round(livre, 2) + ' m³'); }
    return res;
  };

  // Verificação rápida usada durante a busca: encaixe dentro de cada parada (pré-calculado) e
  // ocupação da seção por área com densidade conservadora. O plano final passa pela verificação exata.
  RE.secaoVeic = (veic) => {
    const tubeVan = veic.tipo === 'tubos';
    return {
      w: (tubeVan ? (veic.secaoL || 1) : (veic.larg || 1)) * 1000,
      h: (tubeVan ? (veic.secaoA || 1) : (veic.alt || 1)) * 1000,
      compr: tubeVan ? (veic.tuboCompr || veic.compr || 3) : (veic.compr || 2),
    };
  };
  RE.colunasDaParada = (parada, comprUtil, cfg) => {
    const tubos = [];
    for (const t of parada.tubos) for (let b = 0; b < t.barras; b++) tubos.push({ de: t.de, di: t.di || null, compr: t.compr, kg: t.pesoUnit || 0, material: t.material || '', encaixavel: t.encaixavel !== false, ordem: 0 });
    if (!tubos.length) return { ok: true, area: 0, maxDe: 0, maxCompr: 0 };
    const enc = RE.encaixarTubos(tubos, { secaoW: 1e9, secaoH: 1e9, comprUtil, folgaEncaixe: cfg.folgaEncaixeMm, niveis: cfg.niveisEncaixe, cargaInternaKgM: cfg.cargaInternaKgM, semSecao: true });
    if (!enc.ok) return { ok: false, motivo: enc.motivo };
    const f = cfg.folgaSecaoMm != null ? cfg.folgaSecaoMm : 5;
    let area = 0, maxDe = 0, maxCompr = 0;
    for (const c of enc.colunas) { area += Math.PI / 4 * (c.de + f) ** 2; maxDe = Math.max(maxDe, c.de); maxCompr = Math.max(maxCompr, c.usadoCompr); }
    return { ok: true, area, maxDe, maxCompr, n: enc.colunas.length };
  };
  RE.cargaRapida = (veic, paradas, colsPorParada, cfg) => {
    const kg = paradas.reduce((s, p) => s + p.kg, 0);
    const m3Outros = paradas.reduce((s, p) => s + p.m3, 0);
    const res = { ok: true, motivos: [], kg, m3Outros };
    if (kg > veic.capKg + 1e-6) { res.ok = false; res.motivos.push('Peso ' + round(kg, 0) + ' kg acima da capacidade de ' + veic.capKg + ' kg'); return res; }
    let zona = 0;
    const temTubo = paradas.some((p) => p.tubos.length);
    if (temTubo) {
      if (veic.tipo !== 'tubos' && veic.aceitaTubos === false) { res.ok = false; res.motivos.push('Veículo não aceita tubos'); return res; }
      const sec = RE.secaoVeic(veic);
      let area = 0, maxDe = 0, maxCompr = 0;
      for (const c of colsPorParada) {
        if (!c.ok) { res.ok = false; res.motivos.push(c.motivo); return res; }
        area += c.area; maxDe = Math.max(maxDe, c.maxDe); maxCompr = Math.max(maxCompr, c.maxCompr);
      }
      const dens = cfg.densidadeSecao || 0.72;
      if (maxDe > Math.min(sec.w, sec.h) - 2 * (cfg.folgaSecaoMm || 0)) { res.ok = false; res.motivos.push('Tubo de ' + maxDe + ' mm não cabe na seção'); return res; }
      if (area > dens * sec.w * sec.h) { res.ok = false; res.motivos.push('Tubos ocupam mais que a seção disponível'); return res; }
      const h = Math.min(sec.h, Math.max(maxDe, area / dens / sec.w));
      zona = (sec.w / 1000) * (h / 1000) * Math.min(maxCompr, veic.compr || maxCompr);
    }
    const livre = Math.max(0, veic.capM3 - zona) * (cfg.aproveitamento || 0.85);
    if (m3Outros > livre + 1e-6) { res.ok = false; res.motivos.push('Volume ' + round(m3Outros, 2) + ' m³ acima do espaço útil de ' + round(livre, 2) + ' m³'); }
    return res;
  };

  // ---------- custos ----------
  RE.custoRota = (veic, km, cidadesIds, ctx, extras) => {
    const cfg = ctx.cfg;
    const preco = veic.combustivel === 'gasolina' ? cfg.precoGasolina : veic.combustivel === 'etanol' ? cfg.precoEtanol : cfg.precoDiesel;
    const comb = veic.kmL > 0 ? km / veic.kmL * preco : 0;
    let ped = 0;
    for (const id of cidadesIds) { const c = ctx.cidades[id]; if (c && c.pedagio > ped) ped = c.pedagio; }
    ped *= veic.multPedagio || 1;
    // pagamento do motorista: diária + R$ por km (cadastro do motorista; sem motorista, o do veículo)
    const mc = ctx.motoristas && veic.motoristaId ? ctx.motoristas[veic.motoristaId] : null;
    const mot = round(mc ? (+mc.diaria || 0) + km * (+mc.valorKm || 0) : (+veic.diariaMotorista || 0) + km * (+veic.valorKmMotorista || 0), 2);
    const c = {
      veiculo: +veic.custoDiaria || 0, motorista: mot, ajudante: +veic.custoAjudante || 0,
      combustivel: round(comb, 2), pedagio: round(ped, 2), manutencao: round(km * (+veic.custoKm || 0), 2), extras: +extras || 0,
    };
    c.total = round(Object.values(c).reduce((s, v) => s + v, 0), 2);
    return c;
  };

  // ---------- roteirização ----------
  // ctx: {cfg, cidades:{id:cidade}, motoristas, veiculos:[...], base:{lat,lon}}
  const veicDisponivel = (v, data) => {
    if (v.ativo === false) return false;
    if (v.manutIni && v.manutFim && data >= v.manutIni && data <= v.manutFim) return false;
    if (v.indisponivelEm && v.indisponivelEm.includes(data)) return false;
    if (v.motoristaIndisponivel) return false;
    if (v.indispDia) return false;
    return true;
  };
  RE.veicDisponivel = veicDisponivel;
  // motorista disponível na data: marcação geral + período de ausência (folga, férias, afastamento)
  RE.motoristaDisponivel = (m, data) => {
    if (!m || m.ativo === false || m.disponivel === false) return false;
    if (m.ausenteIni && data >= m.ausenteIni && (!m.ausenteFim || data <= m.ausenteFim)) return false;
    return true;
  };

  RE.dBR = (s) => (s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : s || '');
  RE.proximoDiaPermitido = (cidade, apartir, limiteDias = 21) => {
    for (let i = 0; i <= limiteDias; i++) { const d = RE.addDays(apartir, i); if ((cidade.dias || []).includes(RE.weekday(d))) return d; }
    return null;
  };

  // Notas elegíveis para a data: cidade com dia permitido (ou dia forçado), não bloqueadas, não roteirizadas em outro plano
  RE.elegiveis = (notasEnr, data, ctx, filtroCidades) => {
    const wd = RE.weekday(data);
    const out = [], fora = [];
    for (const n of notasEnr) {
      if (n.status === 'entregue' || n.status === 'cancelada' || n.status === 'em_rota') continue;
      if (n.planoData && n.planoData !== data && n.status === 'roteirizada') continue;
      if (filtroCidades && filtroCidades.length && !filtroCidades.includes(n.cidadeId)) continue;
      if (n.bloqueioUsuario) continue;   // bloqueada pelo usuário: fica fora da programação sem aparecer nela
      if (n.bloqueada) { fora.push({ nota: n, motivo: 'Dados pendentes' }); continue; }
      const cid = ctx.cidades[n.cidadeId];
      const forcado = n.diaForcado === data;
      if (!forcado && !(cid.dias || []).includes(wd)) { continue; }
      if (n.dataMinima && data < n.dataMinima) continue;
      let obrig = false, atrasada = false;
      if (n.prazoEfetivo) {
        if (n.prazoEfetivo < data) { atrasada = true; obrig = true; }
        else {
          const prox = RE.proximoDiaPermitido(cid, RE.addDays(data, 1));
          if (!prox || prox > n.prazoEfetivo) obrig = true;
        }
      }
      if (forcado) obrig = true;
      if (n.prioridade) obrig = true;
      out.push(Object.assign({}, n, { obrigatoria: obrig, atrasada, prioridade: !!n.prioridade }));
    }
    return { notas: out, fora };
  };

  // Alertas: notas que não chegam ao destino dentro do prazo com o calendário da cidade
  RE.alertasPrazo = (notasEnr, hoje, ctx) => {
    const al = [];
    for (const n of notasEnr) {
      if (['entregue', 'cancelada', 'roteirizada', 'em_rota'].includes(n.status) || n.bloqueioUsuario || !n.prazoEfetivo || !n.cidadeId) continue;
      const cid = ctx.cidades[n.cidadeId];
      if (!cid) continue;
      if (n.prazoEfetivo < hoje) { al.push({ nota: n, tipo: 'atrasada', msg: 'Prazo vencido em ' + RE.dBR(n.prazoEfetivo) }); continue; }
      const prox = RE.proximoDiaPermitido(cid, hoje);
      if (!prox || prox > n.prazoEfetivo) al.push({ nota: n, tipo: 'sem_dia', msg: 'Nenhum dia de rota de ' + cid.nome + ' até o prazo ' + RE.dBR(n.prazoEfetivo) + (prox ? ' (próximo: ' + RE.dBR(prox) + ')' : '') });
      else if (n.bloqueada) al.push({ nota: n, tipo: 'pendente', msg: 'Dados pendentes impedem a roteirização (prazo ' + RE.dBR(n.prazoEfetivo) + ')' });
    }
    return al;
  };

  // Agrupa notas no mesmo destino (cliente + endereço), preservando o vínculo com cada NF-e
  RE.consolidar = (notas) => {
    const m = new Map();
    for (const n of notas) {
      const k = RE.clienteKey(n);
      let p = m.get(k);
      if (!p) {
        p = { key: k, notas: [], kg: 0, m3: 0, tubos: [], receita: 0, cidadeId: n.cidadeId, cidadeNome: n.cidadeNome, lat: n.lat, lon: n.lon, coordFonte: n.coordFonte, dest: n.destNome, endereco: n.endereco, obrigatoria: false, atrasada: false, janela: n.janela || null, locks: null };
        m.set(k, p);
      }
      p.notas.push(n.id); p.kg += n.pesoKg || 0; p.m3 += n.volOutrosM3 || 0; p.receita += n.freteValor || 0;
      for (const t of n.tubos || []) p.tubos.push(Object.assign({ nota: n.id }, t));
      p.exigeTubo = p.exigeTubo || !!n.exigeTubo;
      p.obrigatoria = p.obrigatoria || n.obrigatoria; p.atrasada = p.atrasada || n.atrasada; p.prioridade = p.prioridade || !!n.prioridade;
      if (n.travaVeiculo) p.locks = n.travaVeiculo;
      if (n.janela && !p.janela) p.janela = n.janela;
    }
    return [...m.values()];
  };

  function Solver(stops, veiculos, ctx, opts) {
    this.S = stops; this.V = veiculos; this.ctx = ctx; this.cfg = ctx.cfg; this.opts = opts || {};
    this.base = ctx.base;
    this.cache = new Map(); this.colCache = new Map();
    this.n = stops.length;
    // matriz de distâncias (0 = base)
    const pts = [this.base].concat(stops);
    const F = this.cfg.fatorRodoviario || 1.25, urb = this.cfg.kmUrbano || 4;
    this.D = pts.map((a, i) => pts.map((b, j) => {
      if (i === j) return 0;
      if (i > 0 && j > 0 && a.cidadeId === b.cidadeId && (a.coordFonte !== 'confirmada' || b.coordFonte !== 'confirmada')) return urb;
      const h = haversine(a, b) * F;
      return Math.max(h, i > 0 && j > 0 && a.cidadeId === b.cidadeId ? 0.5 : 0);
    }));
    this.estimativa = stops.some((s) => s.coordFonte !== 'confirmada');
    // tipos de veículo distintos (dimensões iguais = mesmo comportamento de carga)
    const sig = (v) => [v.tipo, v.capKg, v.capM3, v.compr, v.larg, v.alt, v.secaoL, v.secaoA, v.tuboCompr, v.aceitaTubos].join('|');
    this.sig = sig;
    this.tipos = [];
    const seen = new Map();
    for (const v of veiculos) { const s = sig(v); if (!seen.has(s)) { seen.set(s, v); this.tipos.push(v); } }
  }
  Solver.prototype.colsParada = function (veic, i) {
    const sec = RE.secaoVeic(veic);
    const k = i + '@' + sec.compr;
    let c = this.colCache.get(k);
    if (!c) { c = RE.colunasDaParada(this.S[i], sec.compr, this.cfg); this.colCache.set(k, c); }
    return c;
  };
  Solver.prototype.cargaOk = function (veic, idxs) {
    const key = this.sig(veic) + '#' + idxs.slice().sort((a, b) => a - b).join(',');
    let r = this.cache.get(key);
    if (!r) {
      r = RE.cargaRapida(veic, idxs.map((i) => this.S[i]), idxs.map((i) => this.colsParada(veic, i)), this.cfg);
      if (this.cache.size > 200000) this.cache.clear();
      this.cache.set(key, r);
    }
    return r;
  };
  // verificação exata (geometria completa, considerando a ordem de entrega)
  Solver.prototype.cargaExata = function (veic, seq) {
    return RE.verificarCarga(veic, seq.map((i, k) => ({ key: this.S[i].key, kg: this.S[i].kg, m3: this.S[i].m3, tubos: this.S[i].tubos, ordem: k })), this.cfg, true);
  };
  // avalia uma sequência de paradas num veículo: viabilidade, tempo, custo e lucro
  Solver.prototype.avaliar = function (veic, seq, detalhe, semCarga) {
    const ctx = this.ctx, cfg = this.cfg;
    const out = { ok: true, motivos: [] };
    if (!seq.length) return { ok: true, km: 0, lucro: 0, custo: { total: 0 }, receita: 0, vazio: true };
    for (const i of seq) {
      const s = this.S[i];
      const cid = ctx.cidades[s.cidadeId];

  async function lerPDF(buf, nomeArq) {
    const pdfjs = await lib('pdfjs');
    try { pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { /* ok */ }
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const pg = await doc.getPage(i);
      const tc = await pg.getTextContent();
      pages.push(tc.items.map((it) => it.str).join(' '));
    }
    const temTexto = pages.some((t) => t.replace(/\s/g, '').length > 40);
    if (!temTexto) return { erro: nomeArq + ': PDF sem texto (digitalizado). O reconhecimento por imagem não roda nesta página; importe o XML da nota.' };
    const notas = RE.parseDanfeText(pages);
    if (!notas.length) return { erro: nomeArq + ': nenhuma chave de acesso válida encontrada no PDF' };
    return { notas };
  }
  async function lerArquivo(nome, obter, out) {

        if (r.tipo === 'nfe') out.notas.push(r.nota);
        else if (r.tipo === 'cancelamento') out.cancel.push(r.chave);

      } else if (ext === 'zip') {

        ui.imp.total += ents.length - 1;

        return;

  function proj(lat0) { const k = Math.cos(lat0 * Math.PI / 180); return (p) => [p.lon * k * 100, -p.lat * 100]; }
  function mapaHTML(plan, foco) {
    const base = ST.cfg.base;
    const pts = [base];
    const rotas = plan ? plan.rotas.filter((r) => !foco || r.veiculoId === foco) : [];
    for (const r of rotas) for (const p of r.paradas) if (p.lat != null) pts.push(p);
    const pend = plan ? (plan.naoRoteirizadas || []) : [];
    if (pts.length === 1) for (const c of ST.cidades.values()) { const m = cidadeCoord(c); if (m.lat != null) pts.push(m); }
    const P = proj(base.lat);
    const xy = pts.map(P);
    let x0 = Math.min(...xy.map((p) => p[0])), x1 = Math.max(...xy.map((p) => p[0])), y0 = Math.min(...xy.map((p) => p[1])), y1 = Math.max(...xy.map((p) => p[1]));
    let w = Math.max(x1 - x0, 20), h = Math.max(y1 - y0, 12);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (w / h > 1.6) h = w / 1.6; else w = h * 1.6;
    w *= 1.35; h *= 1.4;

  // ---------------- CTRCs disponíveis para entrega (SSW) e notas manuais ----------------
  // NF excluída no roteirizador some de todas as listas do SSW (fica guardada em 'ignoradas' por 60 dias)
  const sswLinhas = () => { const ign = ignoradas(); return [...ST.ssw.values()].filter((d) => d.id !== 'ignoradas').sort((a, b) => (a.id || '').localeCompare(b.id || '')).flatMap((d) => d.linhas || []).filter((r) => !ign[nfChave(r.nf)]); };
  const sswInfo = () => { const ds = [...ST.ssw.values()]; return ds.length ? { em: ds.map((d) => d.capturadoEm || '').sort().pop(), fonte: (ds[0] || {}).fonte || '' } : null; };
  const nfKey = (s) => { const d = String(s || '').replace(/\D/g, ''); return d ? String(+d) : ''; };
  const sswKey = (r) => 'ssw-' + (String(r.ctrc || '').replace(/[^A-Za-z0-9]/g, '') || 'nf' + nfKey(r.nf));
  function acharSSW(t) {
    const k = String(t).replace(/\D/g, '');
    if (!k) return null;
    return sswLinhas().find((r) => nfKey(r.nf) === String(+k)) || (k.length >= 5 ? sswLinhas().find((r) => String(r.ctrc || '').replace(/\D/g, '').endsWith(k)) : null) || null;
  }
  // nota já existente para a linha do SSW (mesmo CTRC, ou mesma NF do mesmo remetente)
  // mercadoria devolvida ao remetente: não é entrega, não entra no roteirizador
  const devolvidaSSW = (r) => /DEVOLV|DEVOLU|RETORN\w* (A|AO|P) ?REMET|AO REMETENTE|DEV REMET/.test(RE.norm((r.status || '') + ' ' + (r.detalhes || '') + ' ' + (r.ocorrencia || '')));
  const nfChave = (v) => String(v || '').replace(/\D/g, '').replace(/^0+/, '');
  const ignoradas = () => (ST.ssw.get('ignoradas') || {}).nfs || {};
  // tira notas (excluídas ou bloqueadas) das programações de hoje em diante e recalcula as rotas
  async function tirarDosPlanos(ids) {
    const fora = new Set(ids); if (!fora.size) return;
    const tem = (x) => (x && Array.isArray(x.notas) ? x.notas : [x && x.nota && (x.nota.id || x.nota), x && x.id]).some((id) => fora.has(id));
    for (const [d, p0] of [...ST.planos]) {
      if (d < hoje() || !p0 || !p0.rotas) continue;
      if (!p0.rotas.some((r) => r.paradas.some((x) => x.notas.some((id) => fora.has(id)))) && !(p0.naoRoteirizadas || []).some(tem) && !(p0.pendentes || []).some(tem)) continue;
      const p = clone(p0);
      for (const r of p.rotas) { for (const x of r.paradas) x.notas = x.notas.filter((id) => !fora.has(id)); r.paradas = r.paradas.filter((x) => x.notas.length); }
      p.rotas = p.rotas.filter((r) => r.paradas.length);
      if (p.naoRoteirizadas) p.naoRoteirizadas = p.naoRoteirizadas.filter((x) => !tem(x));
      if (p.pendentes) p.pendentes = p.pendentes.filter((x) => !tem(x));
      let rec = p; try { rec = Object.assign(RE.recalcularPlano(p, notasEnr().filter((n) => !fora.has(n.id)), ctx()), { naoRoteirizadas: p.naoRoteirizadas || [], pendentes: p.pendentes || [] }); } catch (e) { rec = p; }
      await salvar('planos', d, rec);
    }
  }
  async function excluirNotas(ids) {
    const ign = Object.assign({}, ignoradas()), nums = [];
    for (const id of ids) {
      const n = ST.notas.get(id); if (!n) continue;
      await remover('notas', id); nums.push(n.numero);
      const k = nfChave(n.numero); if (k) ign[k] = hoje();
    }
    await tirarDosPlanos(ids);
    const numsK = new Set(nums.map(nfChave));
    for (const sb of [...ST.sobras.values()]) if ((sb.notaId && ids.includes(sb.notaId)) || numsK.has(nfChave(sb.numero))) await remover('sobras', sb.id);
    // guarda por 60 dias para o SSW não trazer de volta
    const lim = RE.addDays(hoje(), -60); for (const k of Object.keys(ign)) if (ign[k] < lim) delete ign[k];
    await salvar('ssw', 'ignoradas', { id: 'ignoradas', nfs: ign });
    if (nums.length) registrar('Notas excluídas', nums.length + ' nota(s): NF ' + nums.join(', '));
    ui.notasSel = new Set(); ui.confirmar = null;
    toast(nums.length + ' nota(s) excluída(s).');
    render();
  }
  function notaDaLinhaSSW(r) {
    const id = sswKey(r);
    if (ST.notas.has(id)) return ST.notas.get(id);
    const k = nfKey(r.nf), rem = RE.norm(r.remetente).slice(0, 10);
    if (!k) return null;
    return [...ST.notas.values()].find((n) => nfKey(n.numero) === k && (!rem || !n.emitente || RE.norm(n.emitente).slice(0, 10) === rem)) || null;
  }
  async function criarNotaDeSSW(r) {

  document.addEventListener('input', (e) => {
    if (e.target.id === 'fSSWq') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { ui.sswFiltro.q = v; render(); const i = $('#fSSWq'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); return; }
    if (e.target.id === 'fMotQ') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { ui.motQ = v; render(); const i = $('#fMotQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 200); return; }
    if (e.target.id === 'fQ') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { ui.notasFiltro.q = v; ui.notasPag = 0; render(); const i = $('#fQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'sbNF') { e.preventDefault(); buscarSobra(); return; } if (e.key === 'Escape' && ui.notaAberta) { ui.notaAberta = null; render(); } });

  // ---------------- início ----------------
  async function iniciar() {
    ui.data = hoje();
    shell();
    $('#main').innerHTML = '<div class="empty"><h3>Carregando dados…</h3></div>';
    let db = null, user = null;
    try { if (window.claude && window.claude.use) { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch (e) { db = null; }
    if (user) {
      try { ST.admin = await user.canEdit(); } catch (e) { ST.admin = false; }
      try { ST.uid = (await user.id()) || 'anon'; } catch (e) { /* ok */ }
    }
    if (window.RC_HOST && window.RC_HOST.pronto) {
      let sb = null; try { sb = await window.RC_HOST.pronto; } catch (e) { sb = null; }
      if (sb) { ST.sandbox = sb; window.RC_HOST = undefined; }   // demonstração / teste grátis: sem SSW da CONSTRULOG
    }
    if (!db) { DB.local = true; ST.admin = true; carregarLocal(); VER++; render(); return; }
    DB.db = db;
    let prontos = 0;
    const total = COLS.length + 1;
    const pronto = () => {
      prontos++;
      if (prontos >= total) {
        render();
        if (ST.sandbox && ST.sandbox.demo && ST.admin && !ST.notas.size && !ui.demoAuto) { ui.demoAuto = true; setTimeout(() => carregarDemo().catch(() => {}), 120); }
        if (ST.sandbox && !ui.sbAviso) { ui.sbAviso = true; toast(ST.sandbox.demo ? 'Demonstração com dados fictícios: fique à vontade para testar.' : 'Bem-vindo ao teste grátis' + (ST.sandbox.testeAte ? ' (até ' + new Date(ST.sandbox.testeAte).toLocaleDateString('pt-BR') + ')' : '') + '.'); }
      } else if (prontos === 1) render();
    };
    db.doc(PATH.cfg).onSnapshot((s) => { ST.carregado.cfgDoc = s.exists; ST.cfg = Object.assign({}, RE.CFG_PADRAO, s.exists ? s.data() : {}); if (!ST.cfg.base || ST.cfg.base.lat == null) ST.cfg.base = RE.CFG_PADRAO.base; VER++; if (!ST.carregado.cfg) { ST.carregado.cfg = 1; pronto(); } else agendar(); }, (e) => toast('Conexão com o banco interrompida (' + e.code + '). Recarregue a página.', true));
    for (const c of COLS) {
      db.collection(PATH[c]).onSnapshot((s) => {
        ST[c] = new Map(s.docs.map((d) => [d.id, Object.assign({}, d.data(), { id: d.id })]));
        VER++;
        if (!ST.carregado[c]) { ST.carregado[c] = 1; pronto(); } else agendar();
        if (c === 'log' && user) resolverNomes(user);
      }, (e) => toast('Conexão com o banco interrompida (' + e.code + '). Recarregue a página.', true));
    }
  }
  let nomesT = null;
  function resolverNomes(user) {
    clearTimeout(nomesT);
    nomesT = setTimeout(async () => {
      const ids = new Set();
      for (const d of ST.log.values()) for (const e of d.entradas || []) if (e.u && /^u_/.test(e.u)) ids.add(e.u);
      if (!ids.size) return;
      try { const ps = await user.profiles([...ids].slice(0, 64)); for (const id of Object.keys(ps || {})) ST.nomes[id] = ps[id].name || ''; if (ui.tab === 'cfg') agendar(); } catch (e) { /* sem nomes */ }
    }, 400);
  }
  iniciar();
})();

</script>
