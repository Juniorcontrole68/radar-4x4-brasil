<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotação • CONSTRULOG</title>
<style>
:root{--nav:#0f172a;--blue:#0057a8;--orange:#f28c00;--line:#e2e8f0;--bg:#f5f7fa}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2937}
.wrap{height:100%;display:flex;flex-direction:column}
.head{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.title{font-size:20px;font-weight:800;color:#0f172a}.sub{font-size:12px;color:#64748b;margin-top:2px}
.tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);background:#fff;color:#334155;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.body{position:relative;flex:1;padding:8px}.loading{position:absolute;inset:8px;display:none;place-items:center;background:#ffffffdd;z-index:3;border-radius:12px;font-weight:700;color:#475569}
.loading.show{display:grid}iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff}
@media(max-width:700px){.head{padding:9px}.title{font-size:17px}.sub{display:none}.tabs{width:100%;display:grid;grid-template-columns:1fr 1fr}.tabs button{padding:9px}.body{padding:3px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="title">🚛 Lotação</div><div class="sub">Coletas e financeiro reunidos em um único módulo.</div></div>
    <div class="tabs">
      <button id="tabColetas" data-view="coletas">🚚 Coletas</button>
      <button id="tabFinanceiro" data-view="financeiro">💰 Financeiro</button>
    </div>
  </div>
  <div class="body">
    <div id="loading" class="loading">Abrindo módulo…</div>
    <iframe id="frame" title="Lotação CONSTRULOG"></iframe>
  </div>
</div>
<script>
let AUTH=null;
const frame=document.getElementById('frame'),loading=document.getElementById('loading');
const btnColetas=document.getElementById('tabColetas'),btnFinanceiro=document.getElementById('tabFinanceiro');
function hasPerm(p){return !!(AUTH&&(AUTH.is_admin||AUTH.permissions?.includes('*')||AUTH.permissions?.includes(p)))}
function openView(view){
  if(view==='coletas'&&!hasPerm('coletas'))view='financeiro';
  if(view==='financeiro'&&!hasPerm('financeiro'))view='coletas';
  if((view==='coletas'&&!hasPerm('coletas'))||(view==='financeiro'&&!hasPerm('financeiro'))){
    document.body.innerHTML='<div style="padding:30px;font-family:Segoe UI,Arial"><h2>Acesso não autorizado</h2><p>Seu usuário não possui acesso a Coletas nem Financeiro.</p></div>';return
  }
  btnColetas.classList.toggle('active',view==='coletas');
  btnFinanceiro.classList.toggle('active',view==='financeiro');
  loading.classList.add('show');
  frame.src=view==='financeiro'
    ?'/coletas?embed=1&view=financeiro&lotacao=1&refresh='+Date.now()
    :'/coletas?embed=1&lotacao=1&refresh='+Date.now();
  try{history.replaceState(null,'','#'+view)}catch(e){}
}
frame.addEventListener('load',()=>loading.classList.remove('show'));
btnColetas.onclick=()=>openView('coletas');
btnFinanceiro.onclick=()=>openView('financeiro');
(async()=>{
  try{
    const r=await fetch('/api/auth/me?refresh='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error();
    AUTH=j.user;
    btnColetas.style.display=hasPerm('coletas')?'':'none';
    btnFinanceiro.style.display=hasPerm('financeiro')?'':'none';
    const wanted=location.hash==='#financeiro'?'financeiro':'coletas';
    openView(wanted);
  }catch(e){location.href='/?login=1#lotacao'}
})();
</script>
</body></html>
