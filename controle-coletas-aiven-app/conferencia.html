<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Conferência de carga</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f8fafc;--muted:#94a3b8;--teal:#0f766e;--ok:#14b8a6;--verde:#16a34a;--amarelo:#d97706;--vermelho:#dc2626}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Segoe UI,Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--card);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:18px}header small{display:block;color:var(--muted);font-size:12px}
.fila{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#134e4a;color:#99f6e4;border:0;white-space:nowrap}.fila.off{background:#78350f;color:#fde68a}
main{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:700 16px Segoe UI,Roboto,Arial;cursor:pointer;padding:0 14px}
.btn.p{background:var(--teal);border-color:var(--teal)}.btn.d{background:transparent;border-color:#b91c1c;color:#fca5a5}.btn:disabled{opacity:.5;cursor:default}
.linha{display:flex;gap:10px;flex-wrap:wrap}.linha>*{flex:1;min-width:140px}
.card{background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.muted{color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#cbd5e1}
input,textarea{min-height:52px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#fff;font:600 18px Segoe UI,Roboto,Arial;padding:0 14px;width:100%}
textarea{padding:10px 14px;font-size:15px;min-height:80px}
input:focus{outline:none;border:2px solid var(--ok)}
.leitura{display:flex;gap:8px}.leitura input{flex:1;font-size:22px;min-height:64px;letter-spacing:.5px}
.leitura button{width:72px;flex:none;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:#fff;font-size:26px;cursor:pointer}
.leitura button.on{background:var(--teal);border-color:var(--teal)}
/* resultado da última leitura: o conferente olha de longe */
.sinal{border-radius:14px;padding:16px;font-size:20px;font-weight:800;text-align:center;min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:#1e293b;color:var(--muted)}
.sinal small{font-size:13px;font-weight:600;opacity:.85}
.sinal.ok,.sinal.ok_completo{background:#14532d;color:#bbf7d0}.sinal.ok_completo{background:var(--verde);color:#fff}
.sinal.alerta{background:#78350f;color:#fde68a}.sinal.erro{background:#7f1d1d;color:#fecaca}.sinal.info{background:#1e3a8a;color:#bfdbfe}
.totais{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.totais div{background:var(--card);border-radius:10px;padding:10px;text-align:center}.totais b{display:block;font-size:24px}.totais span{font-size:12px;color:var(--muted)}
.parc{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line)}
.parc.completo{border-left-color:var(--verde)}.parc.falta{border-left-color:var(--amarelo)}.parc.mais{border-left-color:var(--vermelho)}
.parc .topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.parc .topo b{font-size:17px}.parc .num{font-size:22px;font-weight:800}
.barra{height:10px;border-radius:99px;background:#0b1220;overflow:hidden}.barra i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:#0b1220;color:var(--muted)}
.chip.v{background:#14532d;color:#bbf7d0}.chip.a{background:#78350f;color:#fde68a}.chip.r{background:#7f1d1d;color:#fecaca}
.lst{display:flex;flex-direction:column;gap:6px}
.lei{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px}
.lei code{font-size:14px;color:#e2e8f0}.lei small{color:var(--muted)}.lei button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
.item{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);color:var(--txt);text-align:left;font:inherit;cursor:pointer;width:100%}
.item b{font-size:16px}.item small{display:block;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:700}
details summary{cursor:pointer;color:#cbd5e1;font-weight:700;padding:6px 0}
.aviso{padding:12px 14px;border-radius:10px;font-size:15px;font-weight:600}.aviso.ok{background:#134e4a;color:#ccfbf1}.aviso.err{background:#450a0a;color:#fecaca}
.voltar{background:none;border:0;color:var(--muted);font:600 15px Segoe UI,Roboto,Arial;padding:6px 0;text-align:left;cursor:pointer}
video{width:100%;border-radius:12px;background:#000;max-height:34vh;object-fit:cover}
[hidden]{display:none!important}
@media(max-width:520px){.totais b{font-size:20px}}
.rel h2{font-size:17px;margin:8px 0 4px}.rel td.n,.rel th.n{text-align:right}.rel tr.err td{color:#fecaca}
@media print{body,html{background:#fff;color:#000}header,.voltar,.noprint{display:none!important}main{max-width:none;padding:0}
  .card,.totais div{background:#fff;border:1px solid #999;color:#000}.muted,th,.totais span{color:#333}.rel tr.err td{color:#b91c1c}th,td{border-color:#999}}
</style>
</head>
<body>
<header><div><b id="titulo">Conferência de carga</b><small id="sub">carregando…</small></div><button class="fila" id="fila" type="button">Online</button></header>
<main id="tela"></main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0).toLocaleString('pt-BR');
const dh=t=>t?new Date(t).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const hr=t=>t?new Date(t).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
async function api(m,url,body){
  const r=await fetch(url,{method:m,credentials:'include',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch{}
  if(r.status===401){location.href='/?login=1#conferencia';throw new Error('Sessão expirada.')}
  if(!r.ok||j.ok===false){const e=new Error(j.error||('Erro '+r.status));e.status=r.status;throw e}
  return j
}
function render(h){$('#tela').innerHTML=h;scrollTo(0,0)}
function aviso(t,tipo='err'){const a=$('#aviso');if(!a)return alert(t);a.className='aviso '+tipo;a.textContent=t;a.hidden=false}

// ---------------- som e vibração (o conferente não precisa olhar para a tela a cada volume)
let ac=null;
function bip(tipo){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const tons={ok:[[1046,.08]],ok_completo:[[1046,.09],[1318,.12]],alerta:[[660,.12],[660,.12]],erro:[[220,.35]],info:[[880,.06]]}[tipo]||[[880,.06]];
    let t=ac.currentTime;
    for(const[f,d]of tons){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=tipo==='erro'?'square':'sine';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d+.05}
  }catch{}
  if(navigator.vibrate)navigator.vibrate(tipo==='erro'?[120,60,120,60,120]:tipo==='alerta'?[80,60,80]:40);
}

// ---------------- fila sem sinal: a leitura fica guardada e vai quando a conexão voltar
const FILA_K='conf_fila_v1';
const filaLer=()=>{try{return JSON.parse(localStorage.getItem(FILA_K)||'[]')}catch{return[]}};
const filaGravar=f=>{try{localStorage.setItem(FILA_K,JSON.stringify(f))}catch{}};
function filaMostrar(){const q=filaLer().length,b=$('#fila');b.textContent=q?q+' na fila':(navigator.onLine?'Online':'Sem sinal');b.classList.toggle('off',!!q||!navigator.onLine)}
let enviandoFila=false;
async function enviarFila(){
  if(enviandoFila)return;enviandoFila=true;
  try{let f=filaLer();
    while(f.length){const x=f[0];
      try{await api('POST','/api/painel/conferencia/sessoes/'+x.sessao+'/leituras',{codigo:x.codigo,uuid:x.uuid})}
      catch(e){if(!e.status||e.status>=500)break}   // sem sinal: tenta depois; erro do servidor (4xx): descarta
      f=filaLer().filter(y=>y.uuid!==x.uuid);filaGravar(f)}
  }finally{enviandoFila=false;filaMostrar();if(S.id)atualizar()}
}
addEventListener('online',enviarFila);addEventListener('offline',filaMostrar);setInterval(()=>{if(filaLer().length)enviarFila()},15000);

// ---------------- câmera: lê sem parar, para bipar a carga inteira em sequência
let detector=null,stream=null,ultimoCam={v:'',t:0};
async function camera(liga){
  const b=$('#bCam');
  if(!liga||stream){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=$('#video');if(v)v.hidden=true;if(b)b.classList.remove('on');return}
  if(!('BarcodeDetector' in window)){aviso('Este aparelho não lê códigos pela câmera no navegador. Use o coletor ou digite o código.');return}
  try{
    detector=detector||new BarcodeDetector({formats:['code_128','ean_13','ean_8','qr_code','code_39','itf','upc_a','data_matrix','codabar','pdf417']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#video');v.srcObject=stream;v.hidden=false;await v.play();b.classList.add('on');
    const loop=async()=>{if(!stream)return;
      try{const c=await detector.detect(v);
        if(c.length){const val=String(c[0].rawValue||'').trim(),agora=Date.now();
          // o mesmo código parado na frente da câmera não conta duas vezes
          if(val&&(val!==ultimoCam.v||agora-ultimoCam.t>3000)){ultimoCam={v:val,t:agora};registrar(val)}}
      }catch{}
      setTimeout(loop,180)};
    loop();
  }catch(e){camera(false);aviso('Não foi possível abrir a câmera: '+e.message)}
}

// ---------------- telas
const S={id:null,dados:null,timer:null};
let TIPO=(()=>{try{return localStorage.getItem('conf_tipo')||'descarga'}catch{return'descarga'}})();
async function inicio(){
  camera(false);S.id=null;clearInterval(S.timer);
  $('#titulo').textContent='Conferência de carga';$('#sub').textContent='Pelas etiquetas dos clientes';
  const abas='<div class="linha" style="gap:8px"><button class="btn '+(TIPO==='descarga'?'p':'')+'" data-tipo="descarga">⬇ Descarga</button><button class="btn '+(TIPO==='carregamento'?'p':'')+'" data-tipo="carregamento">⬆ Carregamento</button><button class="btn '+(TIPO==='contagem'?'p':'')+'" data-tipo="contagem">📦 Galpão</button></div>';
  const novo=TIPO==='contagem'
    ?'<div class="card"><b>Nova conferência do galpão</b><div class="muted">A contagem esperada são os CT-es disponíveis para entrega no SSW (ainda sem romaneio). Bipe todos os volumes que estão no galpão: no fim aparece o que falta e o que sobra, por parceiro. É uma contagem por dia: ela fica gravada com todas as rotas.</div>'+
      '<button class="btn p" id="nGalOk">Começar a contagem de hoje</button></div>'
    :TIPO==='descarga'
    ?'<div class="card"><b>Nova descarga</b><div class="muted">A carga esperada são os CT-es emitidos no SSW entre o horário inicial da véspera e o horário final do dia da descarga.</div>'+
      '<div class="linha"><label>Dia da descarga<input id="nData" type="date"></label><label>Da véspera, a partir de<input id="nIni" type="time" value="19:00"></label><label>Até (no dia)<input id="nFim" type="time" value="04:00"></label></div>'+
      '<button class="btn p" id="nOk">Começar descarga</button></div>'
    :'<div class="card"><b>Novo carregamento pelo romaneio</b><div class="muted">Escolha o romaneio de entregas de hoje no SSW. Só sobe no caminhão o que é dos CT-es dele.</div>'+
      '<div class="lst" id="roms"><div class="muted">buscando os romaneios de hoje no SSW…</div></div>'+
      '<div class="linha"><label>Ou digite o romaneio<input id="nRom" placeholder="AMR001186-0" autocapitalize="characters"></label></div><button class="btn p" id="nRomOk">Começar pelo romaneio</button></div>'+
      '<div class="card"><b>Novo carregamento bipando os CT-es</b><div class="muted">Bipe primeiro os DACTEs dos CT-es que vão no caminhão (cada um entra na carga) e depois os volumes.</div>'+
      '<div class="linha"><label>Placa (opcional)<input id="nPlaca" placeholder="ABC1D23" autocapitalize="characters" maxlength="8"></label></div><button class="btn p" id="nCteOk">Começar bipando os DACTEs</button></div>';
  render(abas+novo+'<button class="btn" id="bEtq">🏷 Etiquetas dos clientes (ensinar etiqueta nova)</button>'+
    '<div class="card"><b>🔎 Consultar nota</b><div class="muted">Mostra se alguma caixa da nota foi achada em rota errada na contagem do galpão.</div><div class="leitura"><input id="cNf" inputmode="numeric" autocomplete="off" placeholder="Número da NF"></div><div id="cNfRes"></div></div>'+
    '<div class="aviso" id="aviso" hidden></div><b>'+(TIPO==='descarga'?'Descargas':TIPO==='contagem'?'Conferências do galpão':'Carregamentos')+'</b><div class="lst" id="lista"><div class="muted">carregando…</div></div>');
  $('#bEtq').onclick=()=>etiquetas();
  document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{TIPO=b.dataset.tipo;try{localStorage.setItem('conf_tipo',TIPO)}catch{}inicio()});
  const criar=async(btn,corpo,txt)=>{const t0=btn.textContent;btn.disabled=true;btn.textContent=txt;
    try{const r=await api('POST','/api/painel/conferencia/sessoes',corpo);abrir(r.id)}catch(e){aviso(e.message);btn.disabled=false;btn.textContent=t0}};
  const j=await api('GET','/api/painel/conferencia/sessoes?tipo='+TIPO);
  $('#cNf').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();consultarNf($('#cNf').value,$('#cNfRes'))}});
  if(TIPO==='contagem'){
    const hoje=j.rows.find(x=>x.tipo==='contagem'&&(x.dia||new Date(x.criado_em).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}))===j.hoje);
    if(hoje)$('#nGalOk').textContent='Abrir a contagem de hoje'+(hoje.status==='aberta'?'':' (fechada)');
    $('#nGalOk').onclick=()=>criar($('#nGalOk'),{tipo:'contagem'},'Buscando os CT-es do galpão no SSW… (até 2 min)');
  }else if(TIPO==='descarga'){
    $('#nData').value=j.hoje;
    $('#nOk').onclick=()=>criar($('#nOk'),{tipo:'descarga',data:$('#nData').value,hora_inicio:$('#nIni').value,hora_fim:$('#nFim').value},'Buscando os CT-es no SSW… (até 1 min)');
  }else{
    $('#nRomOk').onclick=()=>{const r=$('#nRom').value.trim().toUpperCase();if(!r){aviso('Escolha ou digite o romaneio.');return}criar($('#nRomOk'),{tipo:'carregamento',modo:'romaneio',romaneio:r},'Buscando o romaneio no SSW… (até 1 min)')};
    $('#nCteOk').onclick=()=>criar($('#nCteOk'),{tipo:'carregamento',modo:'ctes',placa:$('#nPlaca').value.trim()},'Abrindo…');
    api('GET','/api/painel/conferencia/romaneios').then(r=>{
      $('#roms').innerHTML=r.rows.length?r.rows.map(x=>'<button class="item" data-rom="'+esc(x.romaneio)+'" data-ctes="'+x.ctes+'" data-placa="'+esc(x.placa)+'" data-mot="'+esc(x.motorista)+'"><b>'+esc(x.romaneio)+(x.placa?' · '+esc(x.placa):'')+'</b><small>'+esc(x.motorista||'')+' · '+n(x.ctes)+' CT-e(s)</small></button>').join(''):'<div class="muted">Nenhum romaneio de hoje no SSW. Digite o número abaixo.</div>';
      $('#roms').onclick=e=>{const b=e.target.closest('[data-rom]');if(b)criar(b,{tipo:'carregamento',modo:'romaneio',romaneio:b.dataset.rom,ctes:b.dataset.ctes,placa:b.dataset.placa,motorista:b.dataset.mot},'Buscando os CT-es do romaneio… (até 1 min)')};
    }).catch(e=>{$('#roms').innerHTML='<div class="muted">Não consegui listar os romaneios: '+esc(e.message)+'</div>'});
  }
  $('#lista').innerHTML=j.rows.length?j.rows.map(s=>'<button class="item" data-s="'+s.id+'"><b>'+esc(s.titulo)+' · '+(s.status==='aberta'?'em andamento':'fechada')+'</b><small>'+n(s.lidos)+' de '+n(s.esperado)+' volumes · aberta por '+esc(s.criado_por)+' em '+dh(s.criado_em)+'</small></button>').join(''):'<div class="muted">Nenhuma conferência ainda.</div>';
  $('#lista').onclick=e=>{const b=e.target.closest('[data-s]');if(b)abrir(b.dataset.s)};
}
async function abrir(id){
  S.id=id;
  render('<button class="voltar" id="voltar">← Conferências</button>'+
    '<div class="leitura" id="caixaLeitura"><input id="cod" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="Bipe a etiqueta ou o DACTE"><button type="button" id="bCam" aria-label="Ler pela câmera">📷</button></div>'+
    '<video id="video" playsinline muted hidden></video>'+
    '<div class="sinal" id="sinal">Pronto para bipar</div><button class="btn" id="bEnsinar" hidden>🏷 Ensinar esta etiqueta</button><div class="aviso" id="aviso" hidden></div>'+
    '<div class="card" id="cRotas" hidden><b>🚚 Rotas do galpão</b><div class="muted">Cada conferente abre a rota que vai bipar. Terminou, abre a próxima. Etiqueta com NF, DANFE ou DACTE de outra rota acusa ROTA ERRADA na hora; nas etiquetas só com o número da caixa, o que passa do total do parceiro na rota aparece como a mais.</div><div class="lst" id="rotasLista"><div class="muted">carregando…</div></div><button class="btn p" id="bRel" type="button">📋 Relatório do galpão</button><button class="btn" id="bRotasCad" type="button">Cadastrar rotas (cidades de cada rota)</button></div>'+
    '<div class="card" id="dica" hidden><b>1º bipe os DACTEs</b><div class="muted">Cada DACTE bipado coloca o CT-e na carga, com os volumes do SSW. Depois bipe os volumes: o que não for desses CT-es aparece em vermelho, NÃO CARREGAR.</div></div>'+
    '<div class="card" id="cMot" hidden><b>📱 Conferência pelo celular do motorista</b><div class="muted">O motorista abre o link e só bipa as caixas: não desfaz, não tira CT-e e não fecha. Vale só para esta carga.</div><div id="motEstado" class="muted"></div><div class="linha" id="motAcoes"><button class="btn p" id="bMot">Gerar link para o motorista</button></div></div>'+
    '<div class="totais" id="totais"></div><div class="lst" id="parceiros"></div>'+
    '<details id="dOutros"><summary id="sOutros">CT-es sem etiqueta reconhecida</summary><div id="outros"></div></details>'+
    '<details><summary>Últimas leituras</summary><div class="lst" id="leituras"></div></details>'+
    '<details><summary>CT-es esperados</summary><div id="esperados" style="overflow:auto"></div></details>'+
    '<div class="linha" id="acoes"><button class="btn" id="bRec">Atualizar CT-es do SSW</button><button class="btn d" id="bFechar">Fechar conferência</button></div>');
  $('#voltar').onclick=()=>S.dados&&S.dados.sessao.pai_id?abrir(S.dados.sessao.pai_id):inicio();
  $('#bRotasCad').onclick=()=>telaRotas(id);
  $('#bRel').onclick=()=>relatorio(id);
  $('#rotasLista').onclick=async e=>{const b=e.target.closest('[data-rota]');if(!b)return;b.disabled=true;
    try{const r=await api('POST','/api/painel/conferencia/sessoes/'+id+'/rotas',{rota:b.dataset.rota});abrir(r.id)}catch(er){aviso(er.message);b.disabled=false}};
  $('#bEnsinar').onclick=()=>etiquetas($('#bEnsinar').dataset.codigo,id);
  $('#bCam').onclick=()=>camera(!stream);
  const cod=$('#cod');
  cod.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=cod.value.trim();cod.value='';if(v)registrar(v)}});
  cod.focus();
  // o foco volta sozinho para o campo (o leitor do coletor digita onde o cursor está)
  document.addEventListener('click',focoCampo);
  $('#bRec').onclick=async()=>{const b=$('#bRec');b.disabled=true;b.textContent='Buscando no SSW…';try{desenhar(await api('POST','/api/painel/conferencia/sessoes/'+id+'/recarregar',{}));aviso('CT-es atualizados.','ok')}catch(e){aviso(e.message)}finally{b.disabled=false;b.textContent='Atualizar CT-es do SSW'}};
  $('#bFechar').onclick=fecharConf;
  $('#bMot').onclick=linkMotorista;
  document.addEventListener('click',tirarCte);

    '<div class="aviso" id="aviso" hidden></div>'+
    '<div class="card"><b>Testar um código</b><div class="leitura"><input id="tCod" autocomplete="off" autocapitalize="characters" placeholder="Bipe para ver de quem é"></div><div id="tRes" class="muted"></div></div>'+
    '<b>Etiquetas cadastradas</b><div class="lst" id="eLista"><div class="muted">carregando…</div></div>');
  $('#voltar').onclick=voltar;
  let F={formatos:[],pode_editar:false};
  const lista=async()=>{F=await api('GET','/api/painel/conferencia/formatos');
    $('#eNomes').innerHTML=[...new Set(F.formatos.map(f=>f.nome))].map(x=>'<option value="'+esc(x)+'">').join('');
    $('#eLista').innerHTML=F.formatos.map((f,i)=>'<div class="lei"><div><b>'+esc(f.nome)+'</b>'+(f.ativo?'':' <span class="chip a">desligada</span>')+'<br><small><code>'+esc(f.padrao)+'</code> · '+(f.por_volume?'um código por caixa':'mesmo código em todas as caixas')+' · CT-e com: '+esc(f.termos||'—')+'</small></div>'+
      (F.pode_editar?'<div style="display:flex;gap:6px"><button data-liga="'+i+'">'+(f.ativo?'Desligar':'Ligar')+'</button><button data-exclui="'+i+'">Excluir</button></div>':'')+'</div>').join('')||'<div class="muted">Nenhuma.</div>'};
  const salvarTodos=async l=>{try{await api('PUT','/api/painel/conferencia/formatos',{formatos:l});await lista();aviso('Etiquetas salvas.','ok')}catch(e){aviso(e.message)}};
  $('#eLista').onclick=e=>{const a=e.target.closest('[data-liga]'),t=e.target.closest('[data-exclui]');
    if(a){const l=F.formatos.map(f=>({...f}));l[+a.dataset.liga].ativo=!l[+a.dataset.liga].ativo;salvarTodos(l)}
    if(t){const f=F.formatos[+t.dataset.exclui];if(confirm('Excluir a etiqueta de '+f.nome+' ('+f.padrao+')?'))salvarTodos(F.formatos.filter((_,i)=>i!==+t.dataset.exclui))}};
  const sugerir=async()=>{
    $('#eEx').innerHTML=E.ex.map((x,i)=>'<button class="chip" style="border:0;cursor:pointer" data-x="'+i+'">'+esc(x)+' ✕</button>').join('');
    $('#ePv1').className='btn'+(E.pv?' p':'');$('#ePv0').className='btn'+(E.pv?'':' p');
    if(!E.ex.length){$('#eAtual').textContent='';if(!E.editado)$('#ePad').value='';return}
    try{const r=await api('POST','/api/painel/conferencia/formatos/sugerir',{exemplos:E.ex,por_volume:E.pv});
      if(!E.editado)$('#ePad').value=r.padrao;
      $('#eAtual').innerHTML=r.atual.filter(a=>a.tipo!=='desconhecido').map(a=>'<span style="color:#fbbf24">'+esc(a.codigo)+(a.tipo==='volume'?' já é reconhecida como <b>'+esc(a.parceiro)+'</b>':' é a chave de um '+esc(a.tipo.toUpperCase())+', não a etiqueta')+'</span>').join('<br>')||(E.ex.length===1&&E.pv?'Se puder, bipe a etiqueta de mais uma caixa: o padrão fica mais certo.':'')
    }catch(e){aviso(e.message)}};
  $('#eEx').onclick=e=>{const b=e.target.closest('[data-x]');if(b){E.ex.splice(+b.dataset.x,1);sugerir()}};
  $('#eCod').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.replace(/\s+/g,'').toUpperCase();e.target.value='';if(v&&!E.ex.includes(v)&&E.ex.length<10){E.ex.push(v);sugerir()}}});
  $('#ePv1').onclick=()=>{E.pv=true;sugerir()};$('#ePv0').onclick=()=>{E.pv=false;sugerir()};
  $('#ePad').oninput=()=>{E.editado=true};
  $('#eNome').oninput=()=>{const f=F.formatos.find(x=>x.nome.toUpperCase()===$('#eNome').value.trim().toUpperCase());if(f&&!$('#eTermos').value)$('#eTermos').value=f.termos};
  $('#tCod').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;e.preventDefault();const v=e.target.value.trim();e.target.value='';if(!v)return;
    try{const r=await api('POST','/api/painel/conferencia/formatos/sugerir',{exemplos:[v]});const a=r.atual[0];
      $('#tRes').innerHTML='<code>'+esc(a.codigo)+'</code>: '+(a.tipo==='volume'?'<b style="color:#4ade80">'+esc(a.parceiro)+'</b>':a.tipo==='desconhecido'?'<b style="color:#f87171">não reconhecida</b>':esc(a.tipo.toUpperCase()))}catch(er){aviso(er.message)}});
  $('#eOk').onclick=async()=>{const b=$('#eOk'),nome=$('#eNome').value.trim();
    if(!E.ex.length){aviso('Bipe a etiqueta do cliente.');return}
    if(!nome){aviso('Informe de qual cliente é a etiqueta.');return}
    b.disabled=true;
    try{const r=await api('POST','/api/painel/conferencia/formatos/ensinar',{nome,termos:$('#eTermos').value.trim(),exemplos:E.ex,por_volume:E.pv,padrao:$('#ePad').value.trim()});
      aviso('Etiqueta de '+nome+' salva.'+(r.reaplicadas?' '+r.reaplicadas+' leitura(s) refeita(s) nas conferências abertas.':''),'ok');
      E.ex=[];E.editado=false;$('#eNome').value='';$('#eTermos').value='';await sugerir();await lista();
      if(voltarSessao)setTimeout(()=>{if(!S.id)voltar()},1500);
    }catch(e){aviso(e.message)}finally{b.disabled=false}};
  await lista();await sugerir();
  $('#eCod').focus();
}

async function linkMotorista(){
  if(S.dados&&S.dados.sessao.motorista_link_em&&!confirm('Gerar um link novo? O link anterior para de funcionar.'))return;
  const b=$('#bMot');b.disabled=true;
  try{
    const r=await api('POST','/api/painel/conferencia/sessoes/'+S.id+'/link-motorista',{});
    S.linkMot={id:S.id,...r};
    $('#motEstado').innerHTML='<input readonly value="'+esc(r.link)+'" style="width:100%;margin:6px 0;padding:8px;border-radius:8px">';
    $('#motAcoes').innerHTML='<a class="btn p" href="'+esc(r.whatsapp)+'" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center">Enviar pelo WhatsApp</a><button class="btn" id="bCopia">Copiar link</button><button class="btn" id="bMot">Gerar outro</button><button class="btn d" id="bMotOff">Cancelar link</button>';
    $('#bCopia').onclick=async()=>{try{await navigator.clipboard.writeText(r.link);aviso('Link copiado.','ok')}catch{$('#motEstado input').select()}};
    $('#bMot').onclick=linkMotorista;
    $('#bMotOff').onclick=async()=>{if(!confirm('Cancelar o link? O motorista não consegue mais bipar.'))return;try{await api('DELETE','/api/painel/conferencia/sessoes/'+S.id+'/link-motorista');S.linkMot=null;$('#motAcoes').innerHTML='<button class="btn p" id="bMot">Gerar link para o motorista</button>';$('#bMot').onclick=linkMotorista;aviso('Link cancelado.','ok');atualizar()}catch(e){aviso(e.message)}};
  }catch(e){aviso(e.message)}finally{const x=$('#bMot');if(x)x.disabled=false}
}
async function tirarCte(e){
  const b=e.target.closest('[data-tira]');if(!b||!S.id)return;
  if(!confirm('Tirar o CT-e '+b.dataset.tira+' desta carga?'))return;
  try{desenhar(await api('DELETE','/api/painel/conferencia/sessoes/'+S.id+'/ctes/'+encodeURIComponent(b.dataset.tira)))}catch(er){aviso(er.message)}
}
async function registrar(codigo){
  if(!S.id)return;
  const x={sessao:S.id,codigo,uuid:uuid()};
  const sin=$('#sinal');
  try{
    const r=await api('POST','/api/painel/conferencia/sessoes/'+S.id+'/leituras',{codigo,uuid:x.uuid});
    sin.className='sinal '+r.sinal;sin.innerHTML=esc(r.mensagem)+'<small>'+esc(codigo)+'</small>';bip(r.sinal);
    const be=$('#bEnsinar');if(be){be.hidden=r.situacao!=='nao_reconhecido';be.dataset.codigo=codigo}
    atualizar();
  }catch(e){
    if(!e.status){   // sem sinal: guarda e manda depois
      const f=filaLer();f.push(x);filaGravar(f);filaMostrar();
      sin.className='sinal alerta';sin.innerHTML='Sem sinal: leitura guardada<small>'+esc(codigo)+'</small>';bip('alerta');
    }else{sin.className='sinal erro';sin.innerHTML=esc(e.message)+'<small>'+esc(codigo)+'</small>';bip('erro')}
  }
}
async function fecharConf(){
  const d=S.dados,t=d.totais;
  const msg='Fechar a conferência?\n\nLidos: '+t.lidos+' de '+t.esperado+'\nFaltam: '+t.faltam+'\nA mais: '+t.excesso+'\nNão reconhecidas: '+d.nao_reconhecidos;
  if(!confirm(msg))return;
  const obs=(t.faltam||t.excesso||d.nao_reconhecidos)?prompt('Observação (o que aconteceu com as diferenças):',''):'';
  if(obs===null)return;
  try{camera(false);desenhar(await api('POST','/api/painel/conferencia/sessoes/'+S.id+'/fechar',{observacao:obs}));aviso('Conferência fechada.','ok')}catch(e){aviso(e.message)}
}

filaMostrar();
inicio().catch(e=>render('<div class="aviso err">'+esc(e.message)+'</div>'));
enviarFila();
</script>
</body>
</html>
