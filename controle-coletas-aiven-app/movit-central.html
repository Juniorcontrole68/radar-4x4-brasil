<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVIT Central</title>
<style>
:root{--nav:#0f172a;--bg:#f3f6f9;--card:#fff;--line:#dbe3ea;--text:#0f172a;--muted:#64748b;--brand:#0f766e;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:linear-gradient(135deg,#111827,#0f3d3e);color:#fff;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 3px 14px #0f172a1f}
.brand h1{margin:0;font-size:24px}.brand p{margin:3px 0 0;color:#cbd5e1;font-size:13px}.back{border:1px solid #ffffff33;background:#ffffff10;color:#fff;border-radius:9px;padding:9px 12px;text-decoration:none;font-weight:700}
.wrap{max-width:1450px;margin:0 auto;padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #0f172a08}.kpi{padding:17px 18px}.kpi span{display:block;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.045em}.kpi b{display:block;font-size:25px;margin-top:7px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.card{padding:18px}.card h2{margin:0 0 12px;font-size:16px;letter-spacing:-.01em}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#475569}
.clients{display:grid;gap:9px;max-height:640px;overflow:auto}.client{border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:#fff;transition:.15s ease}.client:hover{border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 4px 12px #0f172a0b}.client.active{border-color:#0f766e;box-shadow:0 0 0 2px #0f766e16}
.client-head{display:flex;justify-content:space-between;gap:10px}.client h3{margin:0;font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}.tag.active{background:#dcfce7;color:#166534}.tag.pilot{background:#dbeafe;color:#1d4ed8}.tag.overdue,.tag.blocked{background:#fee2e2;color:#991b1b}.tag.trial{background:#fef3c7;color:#92400e}
.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mod{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa;display:flex;gap:9px;align-items:flex-start}.mod input{width:auto;margin-top:3px}.mod b{font-size:13px}.mod small{display:block;color:var(--muted);margin-top:2px}
.msg{min-height:20px;font-size:13px;font-weight:700;margin-top:10px}.empty{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form,.modules{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>MOVIT Central</h1><p>Gestão comercial, licenças e módulos das Torres de Controle</p></div>
  <a class="back" href="/">Voltar à CONSTRULOG</a>
</div>
<div class="wrap">
  <div class="kpis">
    <div class="kpi"><span>Clientes</span><b id="kClients">—</b></div>
    <div class="kpi"><span>Ativos / Piloto</span><b id="kActive">—</b></div>
    <div class="kpi"><span>Receita mensal ativa</span><b id="kMrr">—</b></div>
    <div class="kpi"><span>Módulos disponíveis</span><b id="kModules">—</b></div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="actions" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Clientes</h2><button id="newClient" class="btn primary">+ Novo cliente</button></div>
      <div id="clients" class="clients"><div class="empty">Carregando…</div></div>
    </div>
    <div class="card">
      <h2 id="formTitle">Cadastro do cliente</h2>
      <form id="clientForm">
        <input id="clientId" type="hidden">
        <div class="form">
          <label>Nome da empresa<input id="name" required></label>
          <label>Identificador / slug<input id="slug" placeholder="ex.: construlog"></label>
          <label>CNPJ / CPF<input id="document"></label>
          <label>E-mail administrativo<input id="email" type="email"></label>
          <label>Telefone / WhatsApp<input id="phone"></label>
          <label>Plano<select id="plan"><option>Personalizado</option><option>Essencial</option><option>Profissional</option><option>Completo</option></select></label>
          <label>Mensalidade (R$)<input id="monthlyFee" inputmode="decimal" placeholder="0,00"></label>
          <label>Vencimento<select id="dueDay"></select></label>
          <label>Status<select id="status"><option value="pilot">Piloto</option><option value="active">Ativo</option><option value="trial">Teste</option><option value="overdue">Vencido</option><option value="blocked">Bloqueado</option></select></label>
          <label class="full">Observações<textarea id="notes" rows="2"></textarea></label>
        </div>
        <h2 style="margin-top:18px">Módulos contratados</h2>
        <div id="modules" class="modules"></div>
        <div class="actions" style="margin-top:14px">
          <button class="btn primary" type="submit">Salvar cliente</button>
          <button class="btn secondary" type="button" id="reset">Limpar</button>
        </div>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="actions" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">Mensalidades</h2>
      <div class="actions">
        <select id="billingClient" style="min-width:220px"></select>
        <input id="billingMonth" type="month" style="width:auto">
        <button id="generateBilling" class="btn primary" type="button">Gerar mensalidade</button>
        <button id="recalcBilling" class="btn secondary" type="button">Atualizar vencidos</button>
      </div>
    </div>
    <div id="billingTable" class="clients"><div class="empty">Carregando mensalidades…</div></div>
    <div id="billingMsg" class="msg"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let MODULES=[],CLIENTS=[],PAYMENTS=[];
for(let i=1;i<=31;i++)$('dueDay').insertAdjacentHTML('beforeend','<option value="'+i+'">Dia '+i+'</option>');
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function statusLabel(s){return ({pilot:'PILOTO',active:'ATIVO',trial:'TESTE',overdue:'VENCIDO',blocked:'BLOQUEADO'})[s]||String(s||'').toUpperCase()}
function renderModules(selected=[]){
  const set=new Set(selected||[]);
  $('modules').innerHTML=MODULES.map(m=>'<label class="mod"><input type="checkbox" value="'+m.key+'" '+(set.has(m.key)?'checked':'')+'><span><b>'+m.name+'</b><small>'+m.category+'</small></span></label>').join('');
}
function renderBilling(){
  const clientOptions='<option value="">Selecione o cliente</option>'+CLIENTS.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
  $('billingClient').innerHTML=clientOptions;
  const rows=PAYMENTS.map(p=>{
    const ref=String(p.reference_month||'').slice(0,7);
    const due=String(p.due_date||'').slice(0,10).split('-').reverse().join('/');
    const statusText={pending:'PENDENTE',paid:'PAGO',overdue:'VENCIDO',cancelled:'CANCELADO'}[p.status]||p.status;
    const tagClass=p.status==='paid'?'active':(p.status==='overdue'?'overdue':(p.status==='cancelled'?'blocked':'trial'));
    return '<div class="client"><div class="client-head"><h3>'+p.client_name+' • '+ref+'</h3><span class="tag '+tagClass+'">'+statusText+'</span></div><div class="meta">Vencimento: '+due+' • '+money(p.amount)+'</div><div class="actions" style="margin-top:8px">'+
      (p.status!=='paid'?'<button class="btn primary" data-pay="'+p.id+'">Marcar pago</button>':'')+
      (p.status!=='cancelled'?'<button class="btn secondary" data-cancel="'+p.id+'">Cancelar</button>':'')+
      '</div></div>'
  }).join('');
  $('billingTable').innerHTML=rows||'<div class="empty">Nenhuma mensalidade cadastrada.</div>';
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>setPaymentStatus(b.dataset.pay,'paid'));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>setPaymentStatus(b.dataset.cancel,'cancelled'));
}
async function setPaymentStatus(id,status){
  $('billingMsg').textContent='Atualizando…';
  try{
    const r=await fetch('/api/movit-central/payments/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao atualizar mensalidade.');
    $('billingMsg').style.color='#15803d';$('billingMsg').textContent='✓ Mensalidade atualizada.';
    await loadPayments();
  }catch(e){$('billingMsg').style.color='#b91c1c';$('billingMsg').textContent=e.message}
}
async function loadPayments(){
  const r=await fetch('/api/movit-central/payments',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao carregar mensalidades.');
  PAYMENTS=j.rows||[];renderBilling();
}
function renderClients(){
  $('kClients').textContent=CLIENTS.length;
  $('kActive').textContent=CLIENTS.filter(x=>['active','pilot'].includes(x.status)).length;
  $('kMrr').textContent=money(CLIENTS.filter(x=>x.status==='active').reduce((s,x)=>s+Number(x.monthly_fee||0),0));
  $('kModules').textContent=MODULES.length;
  $('clients').innerHTML=CLIENTS.length?CLIENTS.map(c=>'<div class="client" data-id="'+c.id+'"><div class="client-head"><h3>'+c.name+'</h3><span class="tag '+c.status+'">'+statusLabel(c.status)+'</span></div><div class="meta">'+(c.plan||'Personalizado')+' • '+money(c.monthly_fee)+' • vence dia '+c.due_day+'<br>'+(c.modules||[]).length+' módulo(s) liberado(s)</div></div>').join(''):'<div class="empty">Nenhum cliente cadastrado.</div>';
  document.querySelectorAll('.client').forEach(el=>el.onclick=()=>editClient(el.dataset.id));
}
function resetForm(){
  $('clientId').value='';$('clientForm').reset();$('dueDay').value='10';$('status').value='pilot';$('plan').value='Personalizado';$('formTitle').textContent='Novo cliente';renderModules([]);$('msg').textContent='';
  document.querySelectorAll('.client').forEach(x=>x.classList.remove('active'));
}
function editClient(id){
  const c=CLIENTS.find(x=>String(x.id)===String(id));if(!c)return;
  $('clientId').value=c.id;$('name').value=c.name||'';$('slug').value=c.slug||'';$('document').value=c.document||'';$('email').value=c.email||'';$('phone').value=c.phone||'';$('plan').value=c.plan||'Personalizado';$('monthlyFee').value=Number(c.monthly_fee||0).toFixed(2).replace('.',',');$('dueDay').value=c.due_day||10;$('status').value=c.status||'active';$('notes').value=c.notes||'';$('formTitle').textContent='Editar • '+c.name;renderModules(c.modules||[]);
  document.querySelectorAll('.client').forEach(x=>x.classList.toggle('active',x.dataset.id===String(id)));
}
async function load(){
  const r=await fetch('/api/movit-central/clients',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao carregar MOVIT Central.');
  MODULES=j.modules||[];CLIENTS=j.clients||[];renderClients();resetForm();
  await loadPayments();
}
$('newClient').onclick=resetForm;$('reset').onclick=resetForm;
const now=new Date();$('billingMonth').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
$('generateBilling').onclick=async()=>{
  const clientId=$('billingClient').value,reference=$('billingMonth').value;
  if(!clientId||!reference){$('billingMsg').style.color='#b91c1c';$('billingMsg').textContent='Selecione o cliente e o mês.';return}
  $('billingMsg').style.color='#475569';$('billingMsg').textContent='Gerando mensalidade…';
  try{
    const r=await fetch('/api/movit-central/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:clientId,reference_month:reference})});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao gerar mensalidade.');
    $('billingMsg').style.color='#15803d';$('billingMsg').textContent='✓ Mensalidade gerada.';
    await loadPayments();
  }catch(e){$('billingMsg').style.color='#b91c1c';$('billingMsg').textContent=e.message}
};
$('recalcBilling').onclick=async()=>{
  $('billingMsg').style.color='#475569';$('billingMsg').textContent='Atualizando vencimentos…';
  try{
    const r=await fetch('/api/movit-central/payments/recalculate-overdue',{method:'POST'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao atualizar vencimentos.');
    $('billingMsg').style.color='#15803d';$('billingMsg').textContent='✓ '+(j.updated||0)+' mensalidade(s) atualizada(s).';
    await loadPayments();
  }catch(e){$('billingMsg').style.color='#b91c1c';$('billingMsg').textContent=e.message}
};
$('clientForm').onsubmit=async e=>{
  e.preventDefault();$('msg').textContent='Salvando…';$('msg').style.color='#475569';
  const id=$('clientId').value;
  const body={name:$('name').value.trim(),slug:$('slug').value.trim(),document:$('document').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),plan:$('plan').value,monthly_fee:Number(String($('monthlyFee').value||'0').replace('.','').replace(',','.'))||0,due_day:Number($('dueDay').value)||10,status:$('status').value,notes:$('notes').value.trim(),modules:[...document.querySelectorAll('#modules input:checked')].map(x=>x.value)};
  try{
    const r=await fetch(id?'/api/movit-central/clients/'+id:'/api/movit-central/clients',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha ao salvar.');
    $('msg').style.color='#15803d';$('msg').textContent='✓ Cliente salvo.';
    await load();if(j.client?.id)editClient(j.client.id);
  }catch(err){$('msg').style.color='#b91c1c';$('msg').textContent=err.message}
};
load().catch(e=>{$('clients').innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body></html>
