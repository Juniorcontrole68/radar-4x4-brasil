<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CONSTRULOG</title>
<style>
:root{--nav:#0f172a;--bg:#eef2f6;--white:#fff;--text:#0f172a;--muted:#64748b;--border:#d9e1e8;--blue:#2563eb}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.shell{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--nav);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px #0002;z-index:2}
.brand{min-width:220px}.brand strong{display:block;font-size:19px}.brand span{font-size:12px;color:#cbd5e1}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}
.tab{appearance:none;border:1px solid #ffffff28;background:#ffffff10;color:#fff;padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer}
.tab.active{background:#fff;color:var(--nav)}
.open{color:#fff;text-decoration:none;border:1px solid #ffffff28;border-radius:9px;padding:9px 12px;font-size:13px}
.bar{background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted)}
.delete-btn{margin-left:auto;border:0;border-radius:8px;background:#b91c1c;color:#fff;padding:8px 12px;font-weight:600;cursor:pointer}
.delete-btn:hover{background:#991b1b}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0f172acc;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}.modal-box{width:min(560px,100%);background:#fff;border-radius:14px;padding:20px;box-shadow:0 18px 60px #0005}
.modal-box h3{margin:0 0 8px;color:#991b1b}.modal-box p{margin:0 0 14px;color:#475569;line-height:1.4}
.modal-box select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}.modal-actions button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer}
.cancel{background:#e2e8f0;color:#0f172a}.confirm-delete{background:#b91c1c;color:#fff}.confirm-delete:disabled{opacity:.5;cursor:not-allowed}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
.body{position:relative;flex:1;min-height:0;padding:8px}.module-loading{display:none;position:absolute;inset:8px;z-index:10;background:#ffffffee;align-items:center;justify-content:center;border-radius:12px;font-weight:700;color:#334155}.module-loading.show{display:flex}
iframe{width:100%;height:100%;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 2px 12px #0000000b}
@media(max-width:720px){
 html,body{height:100%;height:100dvh;overflow:hidden}
 .top{padding:9px 10px;display:flex;min-height:48px;flex-wrap:nowrap}
 .brand{min-width:0;flex:1}.brand strong{font-size:17px}.brand span,.open{display:none}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;height:68px;padding:6px;gap:5px;background:var(--nav);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));box-shadow:0 -3px 14px #0003}
 .tab{min-width:0;padding:7px 3px;border-radius:8px;font-size:10px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:normal}
 .tab:before{font-size:18px;line-height:1}
 .tab[data-module="coletas"]:before{content:"🚚"}
 .tab[data-module="financeiro"]:before{content:"💰"}
 .tab[data-module="dashboard"]:before{content:"📊"}
 .tab[data-module="contas"]:before{content:"🧾"}
 .bar{padding:6px 9px;font-size:11px;min-height:35px}
 .bar>span:nth-of-type(3){display:none}
 .delete-btn{padding:6px 8px;font-size:11px}
 .body{padding:3px 3px 72px}
 .module-loading{inset:3px 3px 72px;border-radius:7px}
 iframe{border-radius:7px;border:0}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><strong>CONSTRULOG</strong><span>Coletas, financeiro, dashboard e contas em um único sistema</span></div>
    <div class="tabs">
      <button class="tab active" data-module="coletas" data-src="/coletas?embed=1" data-name="Coletas">Coletas</button>
      <button class="tab" data-module="financeiro" data-src="/coletas?embed=1" data-name="Financeiro">Financeiro</button>
      <button class="tab" data-module="dashboard" data-src="https://construlog-dashboard.onrender.com/?embed=1" data-name="Dashboard">Dashboard</button>
      <button class="tab" data-module="contas" data-src="/contas?embed=1" data-name="Contas a Pagar">Contas a Pagar</button>
    </div>
    <a class="open" id="open" href="/coletas?embed=1" target="_blank" rel="noopener">Abrir separado ↗</a>
  </div>
  <div class="bar"><span class="dot"></span><span id="module">Controle de Coletas</span><span>• Banco Aiven conectado</span><button id="deleteColeta" class="delete-btn" type="button">🗑 Excluir coleta</button></div>
  <div class="body"><div id="moduleLoading" class="module-loading">Abrindo módulo…</div><iframe id="frame" src="/coletas?embed=1" title="Módulo CONSTRULOG"></iframe></div>
</div>

<div id="deleteModal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <h3>Excluir coleta</h3>
    <p>Selecione a coleta que deseja excluir. A exclusão é definitiva e será feita no banco Aiven.</p>
    <select id="deleteSelect"><option value="">Carregando coletas...</option></select>
    <div class="modal-actions">
      <button id="cancelDelete" class="cancel" type="button">Cancelar</button>
      <button id="confirmDelete" class="confirm-delete" type="button" disabled>Excluir definitivamente</button>
    </div>
  </div>
</div>

<script>
const frame=document.getElementById('frame'), moduleName=document.getElementById('module'), open=document.getElementById('open'), moduleLoading=document.getElementById('moduleLoading');
const deleteBtn=document.getElementById('deleteColeta'), deleteModal=document.getElementById('deleteModal'), deleteSelect=document.getElementById('deleteSelect'), cancelDelete=document.getElementById('cancelDelete'), confirmDelete=document.getElementById('confirmDelete');
function abrirModulo(btn){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  const mod=btn.dataset.module||'coletas';
  frame.dataset.module=mod;
  moduleLoading.classList.add('show');
  let src=btn.dataset.src;
  const sep=src.includes('?')?'&':'?';
  if(mod==='financeiro') src += sep+'view=financeiro&refresh='+Date.now();
  else src += sep+'refresh='+Date.now();
  frame.src=src;
  moduleName.textContent=btn.dataset.name;
  open.href=btn.dataset.src;
  deleteBtn.style.display=mod==='coletas'?'inline-block':'none';
  try{history.replaceState(null,'','#'+mod)}catch(e){}
}
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',e=>{e.preventDefault();abrirModulo(btn)});
  btn.addEventListener('touchend',e=>{e.preventDefault();abrirModulo(btn)},{passive:false});
});

function coletaLabel(c){
  const parts=[];
  if(c.os) parts.push('OS/Coleta '+c.os);
  if(c.cliente) parts.push(c.cliente);
  if(c.destino) parts.push(c.destino);
  if(c.placa) parts.push('Placa '+c.placa);
  if(c.data) parts.push(String(c.data).slice(0,10));
  return parts.length?parts.join(' • '):('ID '+c.id);
}

async function abrirExclusao(){
  deleteModal.classList.add('show');
  deleteModal.setAttribute('aria-hidden','false');
  deleteSelect.innerHTML='<option value="">Carregando coletas...</option>';
  confirmDelete.disabled=true;
  try{
    const r=await fetch('/api/painel/coletas-resumo',{cache:'no-store'});
    if(!r.ok) throw new Error('Não foi possível carregar as coletas.');
    const list=await r.json();
    deleteSelect.innerHTML='<option value="">Selecione uma coleta</option>';
    list.forEach(c=>{
      const opt=document.createElement('option');
      opt.value=c.id;
      opt.textContent=coletaLabel(c);
      deleteSelect.appendChild(opt);
    });
    if(!list.length) deleteSelect.innerHTML='<option value="">Nenhuma coleta cadastrada</option>';
  }catch(e){
    deleteSelect.innerHTML='<option value="">Erro ao carregar coletas</option>';
    alert(e.message);
  }
}

function fecharExclusao(){
  deleteModal.classList.remove('show');
  deleteModal.setAttribute('aria-hidden','true');
}

deleteBtn.addEventListener('click',abrirExclusao);
cancelDelete.addEventListener('click',fecharExclusao);
deleteModal.addEventListener('click',e=>{if(e.target===deleteModal)fecharExclusao();});
deleteSelect.addEventListener('change',()=>{confirmDelete.disabled=!deleteSelect.value;});
confirmDelete.addEventListener('click',async()=>{
  const id=deleteSelect.value;
  if(!id) return;
  const descricao=deleteSelect.options[deleteSelect.selectedIndex]?.textContent||'esta coleta';
  if(!confirm('Tem certeza que deseja excluir definitivamente?\n\n'+descricao+'\n\nEsta ação não pode ser desfeita.')) return;
  confirmDelete.disabled=true;
  const oldText=confirmDelete.textContent;
  confirmDelete.textContent='Excluindo...';
  try{
    const r=await fetch('/api/painel/coletas/'+encodeURIComponent(id),{method:'DELETE'});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.error||'Não foi possível excluir a coleta.');
    fecharExclusao();
    frame.src='/coletas?embed=1&refresh='+Date.now();
    alert('Coleta excluída com sucesso.');
  }catch(e){
    alert(e.message);
  }finally{
    confirmDelete.textContent=oldText;
    confirmDelete.disabled=!deleteSelect.value;
  }
});


function titleCasePt(value){
  return String(value||'')
    .toLocaleLowerCase('pt-BR')
    .replace(/(^|[\s\-\/])([\p{L}])/gu,(m,sep,ch)=>sep+ch.toLocaleUpperCase('pt-BR'));
}

function deveFormatarCampo(el){
  if(!el) return false;
  const tag=(el.tagName||'').toLowerCase();
  if(tag!=='input' && tag!=='textarea') return false;
  if(tag==='input'){
    const type=(el.type||'text').toLowerCase();
    if(!['text','search'].includes(type)) return false;
  }
  const ident=((el.name||'')+' '+(el.id||'')+' '+(el.autocomplete||'')).toLowerCase();
  if(/email|e-mail|senha|password|url|site|login/.test(ident)) return false;
  if(el.dataset && el.dataset.noTitlecase==='true') return false;
  return true;
}

function aplicarTitleCaseNoDocumento(doc){
  if(!doc || doc.__titleCaseAtivo) return;
  doc.__titleCaseAtivo=true;

  const formatar=(el)=>{
    if(!deveFormatarCampo(el)) return;
    const inicio=el.selectionStart, fim=el.selectionEnd;
    const novo=titleCasePt(el.value);
    if(novo!==el.value){
      el.value=novo;
      try{
        if(inicio!==null && fim!==null) el.setSelectionRange(inicio,fim);
      }catch{}
    }
  };

  doc.addEventListener('input',e=>formatar(e.target),true);
  doc.addEventListener('change',e=>formatar(e.target),true);
  doc.querySelectorAll('input,textarea').forEach(formatar);

  const obs=new MutationObserver(()=>{
    doc.querySelectorAll('input,textarea').forEach(formatar);
  });
  obs.observe(doc.documentElement||doc.body,{childList:true,subtree:true});
}

function ativarTitleCaseNoModulo(){
  try{
    aplicarTitleCaseNoDocumento(frame.contentDocument);
  }catch(e){
    console.warn('Não foi possível ativar capitalização automática:',e);
  }
}

function aplicarFonteLeveNoModulo(){
  try{
    const doc=frame.contentDocument;
    if(!doc || doc.getElementById('painel-font-light')) return;
    const style=doc.createElement('style');
    style.id='painel-font-light';
    style.textContent=`
      html,body,button,input,select,textarea,table{font-family:"Segoe UI",Roboto,Arial,sans-serif!important}
      body{font-weight:400!important;letter-spacing:0!important}
      label,.muted,.hint,.toolbar,.finance-toolbar{font-weight:400!important}
      button,.btn,.tab,.section-title,th{font-weight:500!important}
      h1,h2,h3,strong,.os,.kpi strong{font-weight:600!important}
      input,select,textarea{font-weight:400!important}
    `;
    (doc.head||doc.documentElement).appendChild(style);
  }catch(e){
    console.warn('Não foi possível aplicar a fonte mais leve:',e);
  }
}


function ajustarCampoClienteEntrega(){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;

    const labels=[...doc.querySelectorAll('label')];
    let encontrado=false;

    for(const label of labels){
      const texto=(label.textContent||'').trim().toLocaleLowerCase('pt-BR');
      if(texto==='cliente' || texto==='nome do cliente' || texto.startsWith('cliente ')){
        label.textContent='Nome Do Cliente Da Entrega';
        encontrado=true;
        const alvo=label.htmlFor ? doc.getElementById(label.htmlFor) : label.querySelector('input,textarea,select');
        if(alvo && (alvo.tagName==='INPUT' || alvo.tagName==='TEXTAREA')){
          alvo.placeholder='Nome Do Cliente Onde Será Feita A Entrega';
          alvo.setAttribute('aria-label','Nome Do Cliente Da Entrega');
        }
        break;
      }
    }

    if(!encontrado){
      const campos=[...doc.querySelectorAll('input,textarea')];
      for(const campo of campos){
        const ident=((campo.name||'')+' '+(campo.id||'')+' '+(campo.placeholder||'')).toLocaleLowerCase('pt-BR');
        if(/(^|\s)(cliente|client)(\s|$)/.test(ident)){
          campo.placeholder='Nome Do Cliente Onde Será Feita A Entrega';
          campo.setAttribute('aria-label','Nome Do Cliente Da Entrega');
          const parent=campo.parentElement;
          if(parent){
            const lab=parent.querySelector('label');
            if(lab) lab.textContent='Nome Do Cliente Da Entrega';
          }
          break;
        }
      }
    }
  }catch(e){
    console.warn('Não foi possível ajustar o campo de cliente da entrega:',e);
  }
}

function abrirFinanceiroNoModulo(){
  if(frame.dataset.module!=='financeiro') return;
  let encerrado=false,obs=null,timer=null;
  const localizar=()=>{
    if(encerrado || frame.dataset.module!=='financeiro') return false;
    try{
      const doc=frame.contentDocument;
      if(!doc) return false;
      const candidatos=[...doc.querySelectorAll('button,a,[role="tab"],.tab,[data-tab],[data-view],[onclick]')];
      const alvo=candidatos.find(el=>{
        const txt=(el.textContent||'').trim().toLocaleLowerCase('pt-BR');
        const meta=((el.id||'')+' '+String(el.className||'')+' '+(el.getAttribute?.('data-tab')||'')+' '+(el.getAttribute?.('data-view')||'')+' '+(el.getAttribute?.('href')||'')+' '+(el.getAttribute?.('onclick')||'')).toLocaleLowerCase('pt-BR');
        return txt==='financeiro' || txt.includes('financeiro') || meta.includes('financeiro');
      });
      if(alvo){
        encerrado=true;
        try{alvo.click()}catch(e){}
        if(obs)obs.disconnect();
        if(timer)clearInterval(timer);
        return true;
      }
      if(!obs && doc.documentElement){
        obs=new MutationObserver(()=>localizar());
        obs.observe(doc.documentElement,{childList:true,subtree:true,attributes:true});
        setTimeout(()=>{try{obs&&obs.disconnect()}catch(e){}},30000);
      }
    }catch(e){}
    return false;
  };
  localizar();
  timer=setInterval(()=>{if(localizar())clearInterval(timer)},500);
  setTimeout(()=>{encerrado=true;clearInterval(timer);try{obs&&obs.disconnect()}catch(e){}},30000);
}

frame.addEventListener('load',()=>{
  moduleLoading.classList.remove('show');
  ativarTitleCaseNoModulo();
  aplicarFonteLeveNoModulo();
  ajustarCampoClienteEntrega();
  abrirFinanceiroNoModulo();
});

const moduloInicial=(location.hash||'#coletas').slice(1);
const botaoInicial=document.querySelector('.tab[data-module="'+moduloInicial+'"]')||document.querySelector('.tab[data-module="coletas"]');
if(botaoInicial) abrirModulo(botaoInicial);
window.addEventListener('hashchange',()=>{
  const mod=(location.hash||'#coletas').slice(1);
  const btn=document.querySelector('.tab[data-module="'+mod+'"]');
  if(btn && frame.dataset.module!==mod) abrirModulo(btn);
});
</script>
</body>
</html>
