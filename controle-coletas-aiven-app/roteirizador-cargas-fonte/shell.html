<title>Roteirizador Inteligente de Cargas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: trilho de navegação à esquerda (barra inferior no celular), área de trabalho com cartões por função. Sinalização viária: asfalto + amarelo de faixa. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --sunk:#E3E8ED;
  --ink:#14202B; --ink-2:#4B5A68; --ink-3:#77869A; --line:#D3DAE1; --line-2:#E4E9EE;
  --brand:#1E3448; --brand-ink:#FFFFFF; --accent:#F2B300; --accent-ink:#7A5400; --accent-soft:#FFF3CC;
  --ok:#1D7F55; --ok-soft:#DDF2E8; --warn:#B66A00; --warn-soft:#FCEBD2; --bad:#B8322A; --bad-soft:#F9DEDB; --info:#2C67A6; --info-soft:#DCE8F6;
  --r1:#2C67A6; --r2:#D1522A; --r3:#1D7F55; --r4:#8B46B0; --r5:#B66A00; --r6:#0E8A8A; --r7:#B0386A; --r8:#5E6E1A;
  --map-dot:#B9C4CF; --map-bg:#F4F6F8;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --rad:10px; --rad-s:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --sunk:#0C1217;
  --ink:#E6ECF1; --ink-2:#A9B6C3; --ink-3:#7B8A99; --line:#2C3946; --line-2:#24303B;
  --brand:#0B1218; --brand-ink:#F3F6F8; --accent:#F2B300; --accent-ink:#FFD25C; --accent-soft:#3A2E0A;
  --ok:#4CC08A; --ok-soft:#173A2B; --warn:#F0A43A; --warn-soft:#3D2A10; --bad:#F07467; --bad-soft:#41201D; --info:#77AEEA; --info-soft:#1A2E45;
  --r1:#77AEEA; --r2:#F08560; --r3:#4CC08A; --r4:#C08BE0; --r5:#F0A43A; --r6:#4CC9C9; --r7:#EE7AA9; --r8:#B5C95A;
  --map-dot:#34424F; --map-bg:#141C23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --surface-2:#1D2731; --sunk:#0C1217;
  --ink:#E6ECF1; --ink-2:#A9B6C3; --ink-3:#7B8A99; --line:#2C3946; --line-2:#24303B;
  --brand:#0B1218; --brand-ink:#F3F6F8; --accent:#F2B300; --accent-ink:#FFD25C; --accent-soft:#3A2E0A;
  --ok:#4CC08A; --ok-soft:#173A2B; --warn:#F0A43A; --warn-soft:#3D2A10; --bad:#F07467; --bad-soft:#41201D; --info:#77AEEA; --info-soft:#1A2E45;
  --r1:#77AEEA; --r2:#F08560; --r3:#4CC08A; --r4:#C08BE0; --r5:#F0A43A; --r6:#4CC9C9; --r7:#EE7AA9; --r8:#B5C95A;
  --map-dot:#34424F; --map-bg:#141C23; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:.93em}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* casca */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--brand);color:var(--brand-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14.5px;color:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button:hover{background:color-mix(in srgb,var(--brand-ink) 9%,transparent);color:var(--brand-ink)}
.nav button[aria-current="page"]{background:var(--accent);color:#1A1300}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);background:color-mix(in srgb,var(--brand-ink) 14%,transparent);padding:1px 6px;border-radius:9px}
.nav button[aria-current="page"] .cnt{background:rgba(0,0,0,.15)}
.rail-foot{margin-top:auto;font-size:12px;opacity:.8;display:flex;flex-direction:column;gap:6px;padding:0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.local{background:var(--warn)}
main{min-width:0;padding-block:18px 60px;padding-inline:24px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:30px;line-height:1.05;text-transform:uppercase}
.top .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.datebox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:4px 6px}
.datebox input{border:0;background:transparent;padding:4px;font-family:var(--f-mono);font-size:14px}
.datebox .dow{font:700 13px var(--f-display);text-transform:uppercase;background:var(--accent);color:#1A1300;border-radius:5px;padding:2px 7px;letter-spacing:.04em}

/* elementos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card+.card,.stack>*+*{margin-top:14px}
.card h2{font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.card h3{font-size:16px}
.card-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink-3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--accent);border-color:var(--accent);color:#1A1300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--accent);border-color:var(--accent);color:#1A1300}}
.btn.go{background:var(--accent);border-color:var(--accent);color:#1A1300}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:13px;border-radius:6px}
.btn.ic{padding:4px 7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14.5px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-size:14px}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2)}
textarea{min-height:64px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.daychips{display:flex;gap:3px}
.daychips button{all:unset;cursor:pointer;font:600 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.03em;width:30px;text-align:center;padding:4px 0;border-radius:5px;background:var(--sunk);color:var(--ink-3)}
.daychips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .daychips button[aria-pressed="true"]{background:var(--accent);color:#1A1300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daychips button[aria-pressed="true"]{background:var(--accent);color:#1A1300}}
.daychips button:disabled{cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.note{border-left:4px solid var(--info);background:var(--info-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:20px;color:var(--ink);margin-bottom:6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.kpi{background:var(--surface);padding:11px 13px;min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 23px/1.15 var(--f-display);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font:500 13px var(--f-body);color:var(--ink-2)}
.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td input[type=number],td input[type=text],td input[type=time],td select{padding:4px 6px;font-size:13px}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* mapa */
.map{position:relative;background:var(--map-bg);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;touch-action:none;user-select:none}
.map svg{display:block;width:100%;height:auto;aspect-ratio:16/10;max-width:100%;cursor:grab}
.map .ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.map .ctl button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.map .tag{position:absolute;left:8px;bottom:8px;font-size:11.5px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 7px;border-radius:5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}

/* rotas */
.vcard{border:1px solid var(--line);border-radius:var(--rad);background:var(--surface);overflow:hidden}
.vcard+.vcard{margin-top:12px}
.vhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vhead .sw{width:12px;height:30px;border-radius:3px;flex:none}
.vhead h3{font-size:19px;text-transform:uppercase}
.plate{font:500 12px var(--f-mono);border:1.5px solid var(--ink-2);border-radius:4px;padding:1px 6px;letter-spacing:.06em}
.vstats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2)}
.vstats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.hi{background:var(--warn)} .bar i.over{background:var(--bad)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-2);align-items:center}
.stop:last-child{border-bottom:0}
.seq{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff}
.stop .who{font-weight:600}
.stop .meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px}
.stop .act{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.stop.locked{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.vfoot{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--surface-2)}
.money b{font-family:var(--f-mono);font-weight:500}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* carga */
.scroll-list{max-height:560px;overflow:auto}
.cargo svg{width:100%;height:auto;max-width:100%;display:block}
.dz{border:2px dashed var(--line);border-radius:var(--rad);padding:22px;text-align:center;background:var(--surface-2);transition:border-color .15s}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* painel lateral */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:18px 18px 40px;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;gap:0}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-between;overflow-x:auto}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;min-width:0;align-items:center}
  .nav .cnt{display:none}
  main{padding-inline:16px;padding-block:14px 96px}
  .top h1{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .stop{grid-template-columns:30px minmax(0,1fr)}
  .stop .act{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dsp-q{width:100%;padding:8px 10px;border:1px solid var(--line,#d5dbe3);border-radius:8px;font:inherit;margin-bottom:10px;background:var(--surface,#fff);color:inherit}.dsp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}.dsp{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--line,#d5dbe3);border-radius:8px}.dsp label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-width:0;flex:1}.dsp input{margin-top:3px}.dsp.com-rota{border-color:var(--info,#2b6cb0);background:rgba(43,108,176,.07)}.dsp span{display:flex;flex-direction:column;min-width:0}.dsp small{opacity:.7;font-size:11.5px}.dsp:has(input:checked){border-color:#2f9e61;background:rgba(47,158,97,.07)}
.escala-cols{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px}@media(max-width:760px){.escala-cols{grid-template-columns:1fr}}.dsp-list{display:flex;flex-direction:column;gap:5px;max-height:460px;overflow:auto}.dsp-list .dsp{cursor:pointer;justify-content:flex-start}.escala{margin-bottom:14px}.ideia{border:1px solid var(--line,#d5dbe3);border-left:4px solid var(--info,#2b6cb0);border-radius:8px;padding:8px 10px;margin-bottom:8px}.ideia .row{gap:8px;align-items:center}.rota-cid{margin-top:3px;opacity:.85}.escala .empty{padding:18px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line,#d5dbe3);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:inherit;border-right:1px solid var(--line,#d5dbe3)}.seg button:last-child{border-right:0}.seg button.on{font-weight:700;color:#fff}.seg button.t-fiorino{background:#2f9e61}.seg button.t-van{background:#2b6cb0}.seg button.t-tubos{background:#b7791f}.seg button:disabled{cursor:default}
.sb-st{font:inherit;font-size:12.5px;font-weight:600;padding:4px 6px;border-radius:7px;border:1px solid var(--line,#d5dbe3)}.sb-st.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}.sb-st.info{background:#dbeafe;color:#1e40af;border-color:#93c5fd}.sb-st.ok{background:#dcfce7;color:#166534;border-color:#86efac}
.copiar-nf{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:4px;padding:0;border:1px solid var(--line,#d5dbe3);border-radius:6px;background:var(--surface,#fff);color:var(--ink,#334155);cursor:pointer;vertical-align:middle}.copiar-nf:hover{border-color:currentColor}
</style>
<div id="app"></div>
