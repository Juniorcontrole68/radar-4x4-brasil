plugins { id 'com.android.application' }

// Endereço do servidor. Só o teste automático (emulador) troca este valor.
def apiBase = (project.findProperty('apiBase') ?: 'https://controle-coletas-jr.onrender.com').toString()
def testHooks = (project.findProperty('testHooks') ?: 'false').toString() == 'true'

android {
    namespace 'br.com.movit.rotas'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.1.0'
        buildConfigField 'String', 'API_BASE', '"' + apiBase + '"'
        manifestPlaceholders = [cleartext: testHooks.toString()]
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'channel'
    productFlavors {
        internal {
            dimension 'channel'
            applicationId 'br.com.movit.rotas.teste'
            versionNameSuffix '-teste'
            buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'false'
        }
        play {
            dimension 'channel'
            applicationId 'br.com.movit.rotas'
            buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'true'
        }
    }

    signingConfigs {
        playRelease {
            def ksPath = System.getenv('MOVIT_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('MOVIT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOVIT_KEY_ALIAS')
                keyPassword System.getenv('MOVIT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('MOVIT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.playRelease
            }
        }
        debug {
            applicationIdSuffix ''
        }
    }
}

dependencies {
}
