plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oswaldo.listaconvites'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oswaldo.listaconvites'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
