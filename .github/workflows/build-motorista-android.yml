name: Build CONSTRULOG Motorista

on:
  push:
    branches: [controle-coletas-aiven]
    paths:
      - 'motorista-android-v2/**'
      - '.github/workflows/build-motorista-android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Onde o APK é publicado:
#   teste  -> só /downloads/CONSTRULOG-Motorista-TESTE.apk (link .../motorista-instalar?canal=teste).
#             O link normal dos motoristas continua com a versão anterior.
#   normal -> também vira o download padrão e os aplicativos instalados avisam da atualização.
env:
  CANAL: teste

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controle-coletas-aiven

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Assinatura fixa: permite atualizar o aplicativo por cima, sem desinstalar e sem refazer
      # o cadastro. A chave fica no repositório CRIPTOGRAFADA com a frase do segredo
      # MOTORISTA_CHAVE (que só o dono do repositório conhece). Sem o segredo, o APK sai com
      # assinatura provisória, como sempre foi, e cada versão nova exige reinstalar.
      - name: Preparar assinatura fixa
        env:
          MOTORISTA_CHAVE: ${{ secrets.MOTORISTA_CHAVE }}
        run: |
          ENC=motorista-android-v2/assinatura/chave.p12.enc
          if [ -z "$MOTORISTA_CHAVE" ]; then
            echo "::warning title=Assinatura provisória::O segredo MOTORISTA_CHAVE não existe. O APK sai com assinatura provisória: a próxima versão exigirá desinstalar e instalar de novo."
            exit 0
          fi
          if [ ${#MOTORISTA_CHAVE} -lt 16 ]; then
            echo "::error title=Frase curta::O segredo MOTORISTA_CHAVE precisa ter pelo menos 16 caracteres."; exit 1
          fi
          KS="$RUNNER_TEMP/motorista.p12"
          SENHA=$(printf '%s' "construlog-motorista:$MOTORISTA_CHAVE" | sha256sum | cut -c1-40)
          echo "::add-mask::$SENHA"
          if [ -f "$ENC" ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:MOTORISTA_CHAVE 2>/dev/null \
               || ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$SENHA" -alias construlog-motorista >/dev/null 2>&1; then
              echo "::error title=Frase diferente::O segredo MOTORISTA_CHAVE não abre a chave de assinatura já existente. Use a mesma frase de antes; trocar a frase impediria a atualização nos celulares."
              exit 1
            fi
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$SENHA" -keypass "$SENHA" \
              -alias construlog-motorista -keyalg RSA -keysize 3072 -validity 18250 \
              -dname "CN=CONSTRULOG Motorista, O=CONSTRULOG, C=BR"
            mkdir -p "$(dirname "$ENC")"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:MOTORISTA_CHAVE
            echo "::notice title=Assinatura criada::Chave de assinatura fixa criada e guardada criptografada no repositório."
          fi
          echo "MOTORISTA_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "MOTORISTA_KEYSTORE_PASSWORD=$SENHA" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [ -n "$MOTORISTA_KEYSTORE_PATH" ]; then
            gradle -p motorista-android-v2 :app:assembleRelease --no-daemon
            cp motorista-android-v2/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/motorista.apk"
          else
            gradle -p motorista-android-v2 :app:assembleDebug --no-daemon
            cp motorista-android-v2/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/motorista.apk"
          fi

      - name: Publish APKs
        run: |
          CODE=$(grep -oE "versionCode [0-9]+" motorista-android-v2/app/build.gradle | grep -oE "[0-9]+")
          NAME=$(grep -oE "versionName '[^']+'" motorista-android-v2/app/build.gradle | cut -d"'" -f2)
          cp "$RUNNER_TEMP/motorista.apk" controle-coletas-aiven-app/downloads/CONSTRULOG-Motorista-TESTE.apk
          if [ "$CANAL" = "normal" ]; then
            cp "$RUNNER_TEMP/motorista.apk" controle-coletas-aiven-app/downloads/CONSTRULOG-Motorista-NORMAL.apk
          fi
          CODE="$CODE" NAME="$NAME" FIXA="${MOTORISTA_KEYSTORE_PATH:+sim}" python3 - <<'PY'
          import json, os
          p='controle-coletas-aiven-app/downloads/update.json'
          d=json.load(open(p))
          code=int(os.environ['CODE']); name=os.environ['NAME']
          notes='Religa sozinho, diagnóstico para a central, fila de posições sem internet, tela de um passo só e botão da rota do dia.'
          d.setdefault('teste',{}).update(versionCode=code,versionName=name+'-teste',notes=notes,assinaturaFixa=bool(os.environ.get('FIXA')))
          if os.environ.get('CANAL')=='normal':
              d.setdefault('normal',{}).update(versionCode=code,versionName=name,notes=notes,assinaturaFixa=bool(os.environ.get('FIXA')))
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit published APK
        run: |
          NAME=$(grep -oE "versionName '[^']+'" motorista-android-v2/app/build.gradle | cut -d"'" -f2)
          git config user.name "CONSTRULOG Build"
          git config user.email "actions@users.noreply.github.com"
          git add controle-coletas-aiven-app/downloads/CONSTRULOG-Motorista-NORMAL.apk controle-coletas-aiven-app/downloads/CONSTRULOG-Motorista-TESTE.apk controle-coletas-aiven-app/downloads/update.json
          if [ -f motorista-android-v2/assinatura/chave.p12.enc ]; then git add motorista-android-v2/assinatura/chave.p12.enc; fi
          git commit -m "Publica app motorista $NAME ($CANAL) [skip ci]" || exit 0
          # Outro build (MOVIT) pode ter publicado no mesmo instante: reaplica por cima e tenta de novo.
          for i in 1 2 3; do
            git fetch origin controle-coletas-aiven
            git rebase origin/controle-coletas-aiven
            if git push origin HEAD:controle-coletas-aiven; then exit 0; fi
            sleep 5
          done
          exit 1
