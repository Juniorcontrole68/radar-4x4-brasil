name: Build Motorista APKs

on:
  push:
    branches:
      - construlog-dashboard
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build TESTE e NORMAL
        run: gradle -p motorista-tracker-android assembleDebug assembleRelease --stacktrace

      - name: Upload TESTE APK
        uses: actions/upload-artifact@v4
        with:
          name: construlog-motorista-teste-apk
          path: motorista-tracker-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload NORMAL APK
        uses: actions/upload-artifact@v4
        with:
          name: construlog-motorista-normal-apk
          path: motorista-tracker-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
