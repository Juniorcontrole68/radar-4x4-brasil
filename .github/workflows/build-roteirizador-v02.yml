name: Build MOVIT Android

on:
  push:
    branches: [controle-coletas-aiven]
    paths:
      - 'roteirizador-v02-android/**'
      - '.github/workflows/build-roteirizador-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movit-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOVIT_KEYSTORE_PASSWORD: ${{ secrets.MOVIT_KEYSTORE_PASSWORD }}
      MOVIT_KEY_ALIAS: ${{ secrets.MOVIT_KEY_ALIAS }}
      MOVIT_KEY_PASSWORD: ${{ secrets.MOVIT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controle-coletas-aiven
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Garantir Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Preparar chave de upload Play Store
        env:
          MOVIT_KEYSTORE_B64: ${{ secrets.MOVIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$MOVIT_KEYSTORE_B64" ]; then
            echo "$MOVIT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/movit-upload.jks"
            echo "MOVIT_KEYSTORE_PATH=$RUNNER_TEMP/movit-upload.jks" >> "$GITHUB_ENV"
          else
            echo "Chave Play Store não configurada; o AAB será gerado sem assinatura de upload."
          fi

      - name: Build APK de teste e AAB Play Store
        id: movit_build
        continue-on-error: true
        run: |
          set +e
          mkdir -p controle-coletas-aiven-app/downloads
          {
            echo "=== assembleTesteDebug ==="
            gradle -p roteirizador-v02-android :app:assembleTesteDebug --no-daemon
            A=$?
            echo "assembleTesteDebug exit=$A"
            echo "=== bundlePlayRelease ==="
            gradle -p roteirizador-v02-android :app:bundlePlayRelease --no-daemon
            B=$?
            echo "bundlePlayRelease exit=$B"
            exit $(( A != 0 || B != 0 ))
          } 2>&1 | tee controle-coletas-aiven-app/downloads/MOVIT-BUILD-LOG.txt
          exit ${PIPESTATUS[0]}

      - name: Validar assinatura Play Store
        if: steps.movit_build.outcome == 'success'
        run: |
          AAB="roteirizador-v02-android/app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -f "$AAB"
          if [ -z "$MOVIT_KEYSTORE_PATH" ]; then
            echo "AAB Play Store gerado, porém ainda sem chave de upload configurada."
          else
            jarsigner -verify "$AAB"
          fi

      - name: Publicar arquivos
        if: always()
        run: |
          mkdir -p controle-coletas-aiven-app/downloads
          if [ -f roteirizador-v02-android/app/build/outputs/apk/teste/debug/app-teste-debug.apk ]; then
            cp roteirizador-v02-android/app/build/outputs/apk/teste/debug/app-teste-debug.apk controle-coletas-aiven-app/downloads/MOVIT.apk
          fi
          if [ -n "$MOVIT_KEYSTORE_PATH" ] && [ -f roteirizador-v02-android/app/build/outputs/bundle/playRelease/app-play-release.aab ]; then
            cp roteirizador-v02-android/app/build/outputs/bundle/playRelease/app-play-release.aab controle-coletas-aiven-app/downloads/MOVIT-PLAYSTORE.aab
          fi
          git config user.name "MOVIT Build"
          git config user.email "actions@users.noreply.github.com"
          git add controle-coletas-aiven-app/downloads/MOVIT-BUILD-LOG.txt
          if [ -f controle-coletas-aiven-app/downloads/MOVIT.apk ]; then git add controle-coletas-aiven-app/downloads/MOVIT.apk; fi
          if [ -f controle-coletas-aiven-app/downloads/MOVIT-PLAYSTORE.aab ]; then git add controle-coletas-aiven-app/downloads/MOVIT-PLAYSTORE.aab; fi
          git commit -m "Publica builds MOVIT Android [skip ci]" || exit 0
          git fetch origin controle-coletas-aiven
          git rebase origin/controle-coletas-aiven
          git push origin HEAD:controle-coletas-aiven
          if [ "${{ steps.movit_build.outcome }}" != "success" ]; then exit 1; fi
