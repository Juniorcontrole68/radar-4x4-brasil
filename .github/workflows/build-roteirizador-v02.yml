name: Build Roteirizador V02 Android

on:
  push:
    branches: [controle-coletas-aiven]
    paths:
      - 'roteirizador-v02-android/**'
      - '.github/workflows/build-roteirizador-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controle-coletas-aiven
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p roteirizador-v02-android :app:assembleDebug --no-daemon
      - name: Publish APK
        run: |
          mkdir -p controle-coletas-aiven-app/downloads
          cp roteirizador-v02-android/app/build/outputs/apk/debug/app-debug.apk controle-coletas-aiven-app/downloads/ROTEIRIZADOR-V02.apk
          git config user.name "CONSTRULOG Build"
          git config user.email "actions@users.noreply.github.com"
          git add controle-coletas-aiven-app/downloads/ROTEIRIZADOR-V02.apk
          git commit -m "Publica Roteirizador V02 Android 0.2.0 [skip ci]" || exit 0
          git push origin HEAD:controle-coletas-aiven
