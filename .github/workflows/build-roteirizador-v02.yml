name: Build MOVIT Android

on:
  push:
    branches: [controle-coletas-aiven]
    paths:
      - 'roteirizador-v02-android/**'
      - '.github/workflows/build-roteirizador-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movit-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controle-coletas-aiven
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK e AAB
        run: |
          gradle -p roteirizador-v02-android :app:assembleDebug --no-daemon
          gradle -p roteirizador-v02-android :app:bundleRelease --no-daemon
      - name: Publish APK
        run: |
          mkdir -p controle-coletas-aiven-app/downloads
          cp roteirizador-v02-android/app/build/outputs/apk/debug/app-debug.apk controle-coletas-aiven-app/downloads/MOVIT.apk
          cp roteirizador-v02-android/app/build/outputs/bundle/release/app-release.aab controle-coletas-aiven-app/downloads/MOVIT-PLAYSTORE.aab
          git config user.name "CONSTRULOG Build"
          git config user.email "actions@users.noreply.github.com"
          git add controle-coletas-aiven-app/downloads/MOVIT.apk controle-coletas-aiven-app/downloads/MOVIT-PLAYSTORE.aab
          git commit -m "Publica MOVIT Android 0.5.1 teste [skip ci]" || exit 0
          git fetch origin controle-coletas-aiven
          git rebase origin/controle-coletas-aiven
          git push origin HEAD:controle-coletas-aiven
