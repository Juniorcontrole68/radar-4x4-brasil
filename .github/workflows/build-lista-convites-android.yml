name: Build Lista de Convites Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-twa/**'
      - '.github/workflows/build-lista-convites-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lista-convites-android-debug
          path: |
            android-twa/app/build/outputs/apk/debug/app-debug.apk
            android-twa/app/build/outputs/bundle/debug/app-debug.aab
