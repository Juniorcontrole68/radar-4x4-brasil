name: Android test and bundle build
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint demo
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: conversa-de-bar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: conversa-de-bar-unsigned-aab-NOT-FOR-PLAY-UPLOAD
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
