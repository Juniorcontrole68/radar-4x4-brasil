name: Testes do servidor (modo teste)

# Roda nas branches de trabalho e em pull requests. Não roda na branch de produção
# e não publica nada: só sobe o servidor em TEST_MODE com um banco vazio e testa.
on:
  push:
    branches-ignore: [controle-coletas-aiven]
    paths:
      - 'controle-coletas-aiven-app/**'
      - 'contas-a-pagar-v3/**'
      - '.github/workflows/testes.yml'
  pull_request:
    paths:
      - 'controle-coletas-aiven-app/**'
      - 'contas-a-pagar-v3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: construlog_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teste -d construlog_teste"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MODE: '1'
      DATABASE_URL: postgresql://teste:teste@127.0.0.1:5432/construlog_teste
      PGSSLMODE: disable
      PORT: '10000'
      DASH_INTERNAL_PORT: '10001'
      PUBLIC_BASE_URL: http://127.0.0.1:10000
      DASHBOARD_INITIAL_ADMIN_USER: admin_teste
      DASHBOARD_INITIAL_ADMIN_PASSWORD: senha-de-teste-123
      WMS_ATIVO: '1'
      MOVIT_DEMO_URL: http://127.0.0.1:10777
      MOVIT_CENTRAL_TOKEN: token-da-movit-central-com-32-caracteres-ou-mais
      MOVIT_DEMO_INTERVALO_MS: '200'
      MOVIT_DEMO_ESPERA_MS: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências (igual ao Render)
        run: cd controle-coletas-aiven-app && npm install --omit=dev
      - name: Verificar sintaxe
        run: |
          node --check controle-coletas-aiven-app/server.js
          node --check controle-coletas-aiven-app/dashboard/server.js
          node --check controle-coletas-aiven-app/lancamentos.js
          node --check controle-coletas-aiven-app/dashboard/public/lancamentos.js
          node --check contas-a-pagar-v3/src/coletas.js
          node --check contas-a-pagar-v3/src/cnh-leitor.js
          node --check controle-coletas-aiven-app/roteirizador-cargas.js
          node --check controle-coletas-aiven-app/lotacao-rastreio.js
          node --check controle-coletas-aiven-app/lotacao-clientes.js
          node --check controle-coletas-aiven-app/compartilhar.js
          node --check controle-coletas-aiven-app/entregas.js
          node --check controle-coletas-aiven-app/compressao.js
          node --check controle-coletas-aiven-app/movit-demo.js
          node --check controle-coletas-aiven-app/movit-guia.js
          node --check controle-coletas-aiven-app/dre.js
          node --check controle-coletas-aiven-app/dashboard/public/dre.js
          node --check controle-coletas-aiven-app/dashboard/ssw-despesas.js
          node --check controle-coletas-aiven-app/veic.js
          node --check controle-coletas-aiven-app/dashboard/public/frota.js
          node --check controle-coletas-aiven-app/wms.js
          node --check controle-coletas-aiven-app/sefaz-nfe.js
          node --check controle-coletas-aiven-app/agendamento.js
          node --check controle-coletas-aiven-app/dashboard/public/agendamentos.js
          node --check controle-coletas-aiven-app/tests/agendamento.js
          node --check controle-coletas-aiven-app/tests/wms.js
      - name: Certificado A1 de teste e SEFAZ de mentira (o teste do WMS sobe a SEFAZ na porta 10778)
        run: |
          F=controle-coletas-aiven-app/tests/fixtures/sefaz
          echo "WMS_NFE_CERT_PFX_BASE64=$(base64 -w0 $F/a1-teste-legado.pfx)" >> "$GITHUB_ENV"
          echo "WMS_NFE_CERT_SENHA=senha-a1" >> "$GITHUB_ENV"
          echo "WMS_NFE_URL_DIST=https://127.0.0.1:10778/dist" >> "$GITHUB_ENV"
          echo "WMS_NFE_URL_EVENTO=https://127.0.0.1:10778/evento" >> "$GITHUB_ENV"
          { echo "WMS_NFE_CA_PEM<<FIM_DO_PEM"; cat $F/ca.pem; echo "FIM_DO_PEM"; } >> "$GITHUB_ENV"
      - name: Subir o servidor em modo teste
        run: |
          cd controle-coletas-aiven-app
          nohup npm start > ../servidor.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs -o /dev/null http://127.0.0.1:10001/health && curl -fs -o /dev/null http://127.0.0.1:10000/; then echo "no ar em ${i}s"; exit 0; fi
          done
          echo "Servidor não subiu"; cat ../servidor.log; exit 1
      - name: Testes ponta a ponta
        run: node controle-coletas-aiven-app/tests/e2e.js
      - name: MOVIT Central envia o teste pela versão de teste
        run: node controle-coletas-aiven-app/tests/movit-central-teste.js
      - name: Roteirizador de Cargas (motor e servidor)
        run: |
          node controle-coletas-aiven-app/roteirizador-cargas-fonte/test.js
          node controle-coletas-aiven-app/tests/roteirizador-cargas.js
      - name: Despesas (DRE) e holerites em PDF
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q poppler-utils
          node controle-coletas-aiven-app/tests/dre.js
      - name: Abastecimentos do Veic na Frota (Veic de mentira, sem rede externa)
        run: node controle-coletas-aiven-app/tests/veic.js
      - name: Armazém (WMS) — Fase 1
        run: node controle-coletas-aiven-app/tests/wms.js
      - name: Agendamento de entregas (varredura do SSW simulada, listas e histórico)
        run: node controle-coletas-aiven-app/tests/agendamento.js
      - name: Grupos de acesso em Usuários
        run: node controle-coletas-aiven-app/tests/grupos-acesso.js
      - name: Rastreio de lotação (base do cliente e link de rastreio)
        run: node controle-coletas-aiven-app/tests/lotacao-rastreio.js
      - name: Cadastro de clientes da Lotação (e endereço da coleta do cliente)
        run: node controle-coletas-aiven-app/tests/lotacao-clientes.js
      - name: Torre Docs (PDF do WhatsApp pelo Compartilhar, para a coleta ou a conta pessoal)
        run: node controle-coletas-aiven-app/tests/compartilhar.js
      - name: Comprovante de entrega pelo MOVIT (foto, não entregue e tela da central)
        run: node controle-coletas-aiven-app/tests/entregas.js
      - name: Economia de banda (compressão e 304)
        run: node controle-coletas-aiven-app/tests/compressao.js
      - name: Leitor da CNH do motorista (Lotação)
        run: node controle-coletas-aiven-app/tests/cnh-leitor.js
      - name: Leitores de valor e data da planilha
        run: TZ=America/Sao_Paulo node controle-coletas-aiven-app/tests/leitores.js
      - name: Localização de endereços no mapa (respostas gravadas, sem rede)
        run: node controle-coletas-aiven-app/tests/geo-endereco.js
      - name: Leitura do CT-e guardado no SSW (zip do XML e tela 101, sem rede)
        run: node controle-coletas-aiven-app/tests/ssw-cte.js
      - name: Leitor de PDF (o mesmo pdftotext do servidor; sem ele os testes de romaneio completo são pulados)
        run: sudo apt-get install -y -q poppler-utils || true
      - name: Sessão do SSW (contra um SSW de mentira, sem rede externa)
        env:
          TEST_MODE: ''
          SSW_INTERNAL_DOMINIO: tst
          SSW_INTERNAL_CPF: '00000000000'
          SSW_INTERNAL_USUARIO: usuario
          SSW_INTERNAL_SENHA: senha
          TRACKING_SYNC_SECONDS: '3600'
          LANC_ESTAVEL_SEGUNDOS: '3'
          DRE_SSW_AUTO: '0'
        run: |
          pkill -f "node server.js" || true
          pkill -f "dashboard/server.js" || true
          for i in $(seq 1 20); do
            if ! curl -s -o /dev/null http://127.0.0.1:10000/ && ! curl -s -o /dev/null http://127.0.0.1:10001/health; then break; fi
            sleep 1
          done
          cd controle-coletas-aiven-app
          nohup node tests/apoio/ssw-falso.js > ../ssw-falso.log 2>&1 &
          export NODE_OPTIONS="--require $PWD/tests/apoio/sem-rede.js --require $PWD/tests/apoio/ssw-desvio.js"
          nohup node server.js > ../servidor-ssw.log 2>&1 &
          unset NODE_OPTIONS
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs -o /dev/null http://127.0.0.1:10001/health && curl -fs -o /dev/null http://127.0.0.1:10000/; then echo "no ar em ${i}s"; break; fi
          done
          node tests/ssw-sessao.js
          node tests/carga.js
          node tests/lancamentos.js
          node tests/ssw-despesas.js
      - name: Versão de demonstração (cada empresa entra com o próprio SSW; SSW de mentira, sem rede externa)
        env:
          TEST_MODE: '1'
          DATABASE_URL: postgresql://teste:teste@127.0.0.1:5432/movit_demo_teste
          MOVIT_DEMO: '1'
          MOVIT_CHAVE_SSW: chave-de-teste-com-mais-de-32-caracteres
          MOVIT_CONVITE_TOKEN: token-de-teste-do-convite-com-32-caracteres-ou-mais
          MOVIT_SSW_BLOQUEADOS: BLQ
        run: |
          pkill -f "node server.js" || true
          pkill -f "dashboard/server.js" || true
          for i in $(seq 1 20); do
            if ! curl -s -o /dev/null http://127.0.0.1:10000/ && ! curl -s -o /dev/null http://127.0.0.1:10001/health; then break; fi
            sleep 1
          done
          cd controle-coletas-aiven-app
          node -e "const {Client}=require('pg');const c=new Client({connectionString:'postgresql://teste:teste@127.0.0.1:5432/construlog_teste'});c.connect().then(()=>c.query('CREATE DATABASE movit_demo_teste')).then(()=>c.end())"
          curl -fs -o /dev/null http://127.0.0.1:10555/__mock/stats || (nohup node tests/apoio/ssw-falso.js > ../ssw-falso-demo.log 2>&1 &)
          export NODE_OPTIONS="--require $PWD/tests/apoio/sem-rede.js --require $PWD/tests/apoio/ssw-desvio.js"
          nohup node server.js > ../servidor-demo.log 2>&1 &
          unset NODE_OPTIONS
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs -o /dev/null http://127.0.0.1:10001/health && curl -fs -o /dev/null http://127.0.0.1:10000/demo; then echo "no ar em ${i}s"; break; fi
          done
          node tests/movit-demo.js
      - name: Log do servidor
        if: always()
        run: cat servidor.log || true; echo ----; cat servidor-ssw.log || true; echo ----; cat servidor-demo.log || true
