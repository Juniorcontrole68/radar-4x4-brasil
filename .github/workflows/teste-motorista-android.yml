name: Teste do aplicativo do motorista (emulador)

# Compila o aplicativo e o exercita num Android emulado contra o servidor em modo teste.
# Não publica nada e não roda na branch de produção.
on:
  push:
    branches-ignore: [controle-coletas-aiven]
    paths:
      - 'motorista-android-v2/**'
      - 'controle-coletas-aiven-app/tests/app-emulador.js'
      - '.github/workflows/teste-motorista-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: construlog_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teste -d construlog_teste"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MODE: '1'
      DATABASE_URL: postgresql://teste:teste@127.0.0.1:5432/construlog_teste
      PGSSLMODE: disable
      PORT: '10000'
      DASH_INTERNAL_PORT: '10001'
      PUBLIC_BASE_URL: http://10.0.2.2:10000
      DASHBOARD_INITIAL_ADMIN_USER: admin_teste
      DASHBOARD_INITIAL_ADMIN_PASSWORD: senha-de-teste-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar o aplicativo apontando para o servidor de teste
        run: |
          gradle -p motorista-android-v2 :app:assembleDebug --no-daemon -PapiBase=http://10.0.2.2:10000 -PtestHooks=true 2> erros-compilacao.txt || {
            grep -E "error:|FAILED|What went wrong" -A3 erros-compilacao.txt | head -60 | while IFS= read -r l; do echo "::error title=Compilação::$l"; done
            cat erros-compilacao.txt; exit 1; }
      - name: Subir o servidor em modo teste
        run: |
          cd controle-coletas-aiven-app && npm install --omit=dev
          nohup npm start > ../servidor.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs -o /dev/null http://127.0.0.1:10001/health && curl -fs -o /dev/null http://127.0.0.1:10000/; then echo "no ar em ${i}s"; exit 0; fi
          done
          echo "::error::Servidor de teste não subiu"; cat ../servidor.log; exit 1
      - name: Liberar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar no Android emulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node controle-coletas-aiven-app/tests/app-emulador.js
      - name: Log do servidor
        if: always()
        run: tail -100 servidor.log || true
