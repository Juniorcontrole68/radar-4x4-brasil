<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Conversa de Bar">
  <title>Conversa de Bar</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header><div class="logo">🍺</div><div><h1>Conversa de Bar</h1><p>Uma companhia para conversar</p></div></header>
    <section class="card">
      <div id="orb" class="orb"><span>🎙️</span></div>
      <h2 id="status">Pronto para conversar</h2>
      <p id="hint">Toque em iniciar uma vez. Depois, converse naturalmente.</p>
      <button id="start" class="primary">Iniciar conversa</button>
      <button id="stop" class="secondary" hidden>Encerrar</button>
    </section>
    <footer>As conversas não são salvas neste aparelho.</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
