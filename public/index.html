<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Conversa de Bar">
  <title>Conversa de Bar — Carol</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=carol-20261004-1718">
</head>
<body>
  <main class="app">
    <header><div class="logo">🍺</div><div><h1>Conversa de Bar</h1><p>Carol está com você</p></div></header>
    <section class="card">
      <div id="orb" class="orb avatar" role="img" aria-label="Rosto da assistente virtual">
        <img class="avatar-photo" src="/avatar-loira.jpg" alt="" width="640" height="640">
        <canvas id="avatar" width="480" height="480" aria-hidden="true"></canvas>
      </div>
      <h2 id="status">Carol está pronta para conversar</h2>
      <p id="hint">Toque em iniciar uma vez. Depois, converse naturalmente.</p>
      <button id="start" class="primary">Iniciar conversa</button>
      <button id="stop" class="secondary" hidden>Encerrar</button>
    </section>
    <footer>As conversas não são salvas neste aparelho.</footer>
  </main>
  <script src="/avatar.js?v=carol-20261004-1718"></script>
  <script src="/app.js?v=carol-20261004-1718"></script>
</body>
</html>
