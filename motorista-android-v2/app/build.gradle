plugins {
    id 'com.android.application'
}

// Endereço do servidor. Só o teste automático (emulador) troca este valor; o aplicativo
// publicado sempre usa a produção.
def apiBase = (project.findProperty('apiBase') ?: 'https://controle-coletas-jr.onrender.com').toString()
def testHooks = (project.findProperty('testHooks') ?: 'false').toString() == 'true'
// Assinatura fixa: o arquivo da chave é preparado pelo GitHub Actions quando o segredo
// MOTORISTA_CHAVE existe. Sem ele, o APK sai com a assinatura de depuração da máquina.
def ksPath = System.getenv('MOTORISTA_KEYSTORE_PATH')
// Versão da Play Store (tipo de build "play"): chave de upload própria, preparada fora do
// repositório. Sem ela o AAB sai sem assinatura, para ser assinado depois com jarsigner.
// -PassinarDebug=true assina com a chave de depuração, só para instalar no emulador.
def playKsPath = System.getenv('MOTORISTA_PLAY_KEYSTORE_PATH')
def playDebugSign = (project.findProperty('assinarDebug') ?: 'false').toString() == 'true'

android {
    namespace 'br.com.construlog.motorista'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.construlog.motorista'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.2.0'
        buildConfigField 'String', 'API_BASE', '"' + apiBase + '"'
        buildConfigField 'boolean', 'TEST_HOOKS', testHooks.toString()
        buildConfigField 'boolean', 'PLAY_STORE', 'false'
        manifestPlaceholders = [cleartext: testHooks.toString()]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        fixa {
            if (ksPath) {
                storeFile file(ksPath)
                storeType 'pkcs12'
                storePassword System.getenv('MOTORISTA_KEYSTORE_PASSWORD')
                keyAlias 'construlog-motorista'
                keyPassword System.getenv('MOTORISTA_KEYSTORE_PASSWORD')
            }
        }
        loja {
            if (playKsPath) {
                storeFile file(playKsPath)
                storeType 'pkcs12'
                storePassword System.getenv('MOTORISTA_PLAY_KEYSTORE_PASSWORD')
                keyAlias 'construlog-motorista-upload'
                keyPassword System.getenv('MOTORISTA_PLAY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.fixa
        }
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            if (ksPath) signingConfig signingConfigs.fixa
        }
        // Versão da Play Store: sem auto-atualização pelo site, sem alarme exato, sem pedido
        // direto de liberar a bateria e sem o serviço "uso especial" (ver src/play/AndroidManifest.xml).
        play {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'PLAY_STORE', 'true'
            signingConfig playKsPath ? signingConfigs.loja : (playDebugSign ? signingConfigs.debug : null)
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
