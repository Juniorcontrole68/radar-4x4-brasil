plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.construlog.motorista'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.construlog.motorista'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
    }
}

dependencies {
}
