plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.construlog.motorista'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.construlog.motorista"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "API_BASE_URL", "\"https://controle-coletas-jr.onrender.com\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
