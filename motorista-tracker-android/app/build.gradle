plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.construlog.motorista'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.construlog.motorista"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.0.5"

        buildConfigField "String", "API_BASE_URL", "\"https://controle-coletas-jr.onrender.com\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".teste"
            versionNameSuffix "-teste"
            buildConfigField "boolean", "TEST_MODE", "true"
            manifestPlaceholders = [appLabel: "CONSTRULOG Motorista TESTE"]
        }
        release {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "TEST_MODE", "false"
            manifestPlaceholders = [appLabel: "CONSTRULOG Motorista"]
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
