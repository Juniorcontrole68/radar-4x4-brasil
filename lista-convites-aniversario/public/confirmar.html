<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar presença</title><link rel="stylesheet" href="styles.css?v=20261005-2"></head>
<body class="confirmBody">
<main class="inviteCard">
  <div class="balloon">🎈</div>
  <span class="eyebrow">VOCÊ ESTÁ CONVIDADO PARA NOSSO ANIVERSÁRIO</span>
  <h1 id="title">Convite</h1>
  <p class="hello" id="hello"></p>
  <div class="inviteDetails" id="details"></div>
  <p id="message"></p>
  <div id="inviteImageWrap" class="hidden inviteImageWrap"><img id="inviteImage" alt="Convite"></div>
  <p id="canvaWrap" class="hidden"><a id="canvaLink" target="_blank" rel="noopener">Abrir convite</a></p>
  <hr>
  <div id="responseBox">
    <h2>Você poderá comparecer?</h2>
    <div class="rsvpBtns three">
      <button class="primary yesBtn" id="yes">Estarei lá 🎉</button>
      <button class="maybeBtn" id="maybe">Ainda não sei</button>
      <button class="noBtn" id="no">Não poderei ir</button>
    </div>
    <div id="qtyBox" class="hidden">
      <label>Quantas pessoas irão?<input id="qty" type="number" min="1" value="1"></label>
      <button class="primary full" id="confirm">Confirmar presença</button>
    </div>
  </div>
  <div id="thanks" class="thanks hidden"></div>
</main>
<script src="confirmar.js?v=20261005-2"></script>
</body></html>
